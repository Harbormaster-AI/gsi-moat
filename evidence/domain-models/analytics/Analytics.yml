  - name: "workspace"
    type: "AnalyticsWorkspace"
    multiplicity: "ManyToOne"
  - name: "trainingRuns"
    type: "TrainingRun"
    multiplicity: "OneToMany"
  - name: "models"
    type: "Model"
    multiplicity: "ManyToMany"
  - name: "notebooks"
    type: "Notebook"
    multiplicity: "ManyToMany"
- name: "TrainingRun"
  description: "Execution record of a model training process with inputs, parameters,\
