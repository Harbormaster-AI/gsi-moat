  - name: "trainingRun"
    type: "TrainingRun"
    multiplicity: "ManyToOne"
  - name: "metric"
    type: "Metric"
    multiplicity: "ManyToOne"
  - name: "dataset"
    type: "DataSet"
    multiplicity: "ManyToOne"
- name: "RunParameter"
