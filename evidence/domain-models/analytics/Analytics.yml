  - name: "runLabel"
    type: "String"
  - name: "status"
    type: "TrainingStatus"
  - name: "startedAt"
    type: "Date"
  - name: "completedAt"
    type: "Date"
  relations:
  - name: "experiment"
    type: "Experiment"
    multiplicity: "ManyToOne"
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
  - name: "inputDatasets"
    type: "DataSet"
    multiplicity: "ManyToMany"
  - name: "features"
    type: "Feature"
    multiplicity: "ManyToMany"
  - name: "runMetrics"
    type: "RunMetric"
    multiplicity: "OneToMany"
  - name: "runParameters"
    type: "RunParameter"
    multiplicity: "OneToMany"
- name: "RunMetric"
  description: "Observed metric value produced during a training run, optionally tied\
    \ to a dataset."
