  - name: "name"
    type: "String"
  - name: "dimensionType"
    type: "DimensionType"
  - name: "typeTime"
    type: "Boolean"
  relations:
  - name: "semanticModel"
    type: "SemanticModel"
    multiplicity: "ManyToOne"
  - name: "datasets"
    type: "DataSet"
    multiplicity: "ManyToMany"
  - name: "glossaryTerms"
    type: "BusinessGlossaryTerm"
    multiplicity: "ManyToMany"
- name: "Measure"
  description: "Numeric field with a defined aggregation behavior usable in calculations\
    \ and visuals."
  data:
  - name: "name"
    type: "String"
  - name: "aggregation"
    type: "AggregationType"
  - name: "format"
    type: "String"
  relations:
  - name: "semanticModel"
    type: "SemanticModel"
    multiplicity: "ManyToOne"
  - name: "datasets"
    type: "DataSet"
    multiplicity: "ManyToMany"
  - name: "glossaryTerms"
    type: "BusinessGlossaryTerm"
    multiplicity: "ManyToMany"
- name: "Metric"
  description: "Standardized business performance indicator defined by an expression\
    \ over measures and dimensions."
  data:
  - name: "name"
    type: "String"
  - name: "metricType"
    type: "MetricType"
  - name: "expression"
    type: "String"
  - name: "unit"
