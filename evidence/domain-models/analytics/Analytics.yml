    type: "String"
  - name: "sourceType"
    type: "DataSourceType"
  - name: "format"
    type: "DataFormat"
  - name: "connection"
    type: "ConnectionInfo"
  - name: "Streaming"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "AnalyticsWorkspace"
    multiplicity: "ManyToOne"
  - name: "producedDatasets"
    type: "DataSet"
    multiplicity: "OneToMany"
  - name: "pipelines"
    type: "DataPipeline"
    multiplicity: "ManyToMany"
- name: "DataSet"
  description: "Curated, queryable collection of data such as a table or view intended\
    \ for analysis."
