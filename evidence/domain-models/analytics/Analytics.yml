  - name: "name"
    type: "String"
  - name: "schemaVersion"
    type: "String"
  - name: "dataFormat"
    type: "DataFormat"
  - name: "refreshSchedule"
    type: "CronSchedule"
  - name: "Sensitive"
    type: "Boolean"
  relations:
  - name: "workspace"
    type: "AnalyticsWorkspace"
    multiplicity: "ManyToOne"
  - name: "sources"
    type: "DataSource"
    multiplicity: "ManyToMany"
  - name: "pipelines"
    type: "DataPipeline"
    multiplicity: "ManyToMany"
  - name: "semanticModels"
    type: "SemanticModel"
    multiplicity: "ManyToMany"
  - name: "dimensions"
    type: "Dimension"
    multiplicity: "ManyToMany"
  - name: "measures"
    type: "Measure"
    multiplicity: "ManyToMany"
  - name: "metrics"
    type: "Metric"
    multiplicity: "ManyToMany"
  - name: "qualityRules"
    type: "QualityRule"
    multiplicity: "OneToMany"
  - name: "lineageNode"
    type: "LineageNode"
    multiplicity: "ManyToOne"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
- name: "DataPipeline"
