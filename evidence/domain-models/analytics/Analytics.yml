---
metadata:
  name: "Analytics Capabilities Model"
  description: "A comprehensive capabilities model for analytics, business intelligence,\
    \ machine learning, forecasting, data quality, and data lineage across the analytics\
    \ lifecycle."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Analytics & AI"
  type: "Capability"
  domain: "Analytics"
entities:
- name: "AnalyticsWorkspace"
  description: "Logical container that organizes analytics assets, governance, and\
    \ collaboration for a specific domain or team."
  data:
  - name: "name"
    type: "String"
  - name: "businessDomain"
    type: "String"
  - name: "ownerTeam"
    type: "String"
  - name: "governanceTier"
    type: "GovernanceTier"
  relations:
  - name: "datasets"
    type: "DataSet"
    multiplicity: "OneToMany"
  - name: "dataSources"
    type: "DataSource"
    multiplicity: "OneToMany"
  - name: "pipelines"
    type: "DataPipeline"
    multiplicity: "OneToMany"
  - name: "dashboards"
    type: "Dashboard"
    multiplicity: "OneToMany"
  - name: "reports"
    type: "Report"
    multiplicity: "OneToMany"
  - name: "notebooks"
    type: "Notebook"
    multiplicity: "OneToMany"
  - name: "models"
    type: "Model"
    multiplicity: "OneToMany"
  - name: "featureSets"
    type: "FeatureSet"
    multiplicity: "OneToMany"
