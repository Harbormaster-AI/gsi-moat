  relations:
  - name: "modelVersion"
    type: "ModelVersion"
    multiplicity: "ManyToOne"
  - name: "metric"
    type: "Metric"
    multiplicity: "ManyToOne"
  - name: "dataset"
    type: "DataSet"
    multiplicity: "ManyToOne"
- name: "FeatureSet"
