    type: "String"
  - name: "version"
    type: "String"
  - name: "grain"
    type: "String"
  relations:
  - name: "datasets"
    type: "DataSet"
    multiplicity: "ManyToMany"
  - name: "metrics"
    type: "Metric"
    multiplicity: "OneToMany"
  - name: "dimensions"
    type: "Dimension"
    multiplicity: "OneToMany"
  - name: "measures"
    type: "Measure"
    multiplicity: "OneToMany"
  - name: "glossaryTerms"
    type: "BusinessGlossaryTerm"
    multiplicity: "ManyToMany"
- name: "Dimension"
