  relations:
  - name: "semanticModel"
    type: "SemanticModel"
    multiplicity: "ManyToOne"
  - name: "datasets"
    type: "DataSet"
    multiplicity: "ManyToMany"
  - name: "glossaryTerms"
    type: "BusinessGlossaryTerm"
    multiplicity: "ManyToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
  - name: "visualizations"
    type: "Visualization"
    multiplicity: "ManyToMany"
- name: "Report"
  description: "Structured presentation of data using visuals, often paginated and\
    \ scheduled for distribution."
  data:
  - name: "title"
    type: "String"
  - name: "status"
    type: "ReportStatus"
  - name: "audience"
    type: "String"
  relations:
  - name: "workspace"
    type: "AnalyticsWorkspace"
    multiplicity: "ManyToOne"
  - name: "visualizations"
    type: "Visualization"
    multiplicity: "OneToMany"
  - name: "datasets"
    type: "DataSet"
    multiplicity: "ManyToMany"
  - name: "semanticModels"
    type: "SemanticModel"
    multiplicity: "ManyToMany"
  - name: "queries"
    type: "BIQuery"
    multiplicity: "ManyToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
- name: "Dashboard"
  description: "Interactive canvas that composes visuals to monitor metrics and insights\
