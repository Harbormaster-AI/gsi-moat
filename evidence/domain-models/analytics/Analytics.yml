  data:
  - name: "title"
    type: "String"
  - name: "status"
    type: "DashboardStatus"
  - name: "theme"
    type: "String"
  relations:
  - name: "workspace"
    type: "AnalyticsWorkspace"
    multiplicity: "ManyToOne"
  - name: "visualizations"
    type: "Visualization"
    multiplicity: "OneToMany"
  - name: "reports"
    type: "Report"
    multiplicity: "ManyToMany"
  - name: "datasets"
    type: "DataSet"
    multiplicity: "ManyToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
  - name: "queries"
    type: "BIQuery"
    multiplicity: "ManyToMany"
  - name: "tags"
    type: "Tag"
    multiplicity: "ManyToMany"
- name: "Visualization"
