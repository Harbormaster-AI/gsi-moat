    type: "ChartOptions"
  relations:
  - name: "dashboard"
    type: "Dashboard"
    multiplicity: "ManyToOne"
  - name: "report"
    type: "Report"
    multiplicity: "ManyToOne"
  - name: "metrics"
    type: "Metric"
    multiplicity: "ManyToMany"
  - name: "dimensions"
    type: "Dimension"
    multiplicity: "ManyToMany"
  - name: "datasets"
    type: "DataSet"
    multiplicity: "ManyToMany"
- name: "Notebook"
