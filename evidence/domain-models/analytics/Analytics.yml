  - name: "datasets"
    type: "DataSet"
    multiplicity: "ManyToMany"
  - name: "reports"
    type: "Report"
    multiplicity: "ManyToMany"
  - name: "dashboards"
    type: "Dashboard"
    multiplicity: "ManyToMany"
  - name: "notebooks"
    type: "Notebook"
    multiplicity: "ManyToMany"
