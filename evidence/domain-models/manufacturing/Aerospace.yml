---
entities:
  - name: "AerospaceManufacturer"
    description: "Organization that designs, certifies, and produces aircraft and aerospace\
    \ systems."
    data:
      - name: "name"
        type: "String"
      - name: "legalName"
        type: "String"
      - name: "headquartersCountry"
        type: "String"
      - name: "website"
        type: "String"
    relations:
      - name: "programs"
        type: "AircraftProgram"
        multiplicity: "OneToMany"
      - name: "plants"
        type: "Plant"
        multiplicity: "OneToMany"
      - name: "suppliers"
        type: "Supplier"
        multiplicity: "ManyToMany"
      - name: "productionCertificates"
        type: "ProductionCertificate"
        multiplicity: "OneToMany"
  - name: "AircraftProgram"
    description: "Multi-year development, certification, and production effort for an\
    \ aircraft family."
    data:
      - name: "name"
        type: "String"
      - name: "programCode"
        type: "String"
      - name: "status"
        type: "ProgramStatus"
      - name: "entryIntoServiceYear"
        type: "Integer"
    relations:
      - name: "manufacturer"
        type: "AerospaceManufacturer"
        multiplicity: "ManyToOne"
      - name: "aircraftFamilies"
        type: "AircraftFamily"
        multiplicity: "OneToMany"
      - name: "typeCertificate"
        type: "TypeCertificate"
        multiplicity: "OneToOne"
      - name: "keySuppliers"
        type: "Supplier"
        multiplicity: "ManyToMany"
  - name: "AircraftFamily"
    description: "Set of closely related aircraft models sharing major design features\
    \ and structures."
    data:
      - name: "name"
        type: "String"
      - name: "familyCode"
        type: "String"
    relations:
      - name: "program"
        type: "AircraftProgram"
        multiplicity: "ManyToOne"
      - name: "aircraftModels"
        type: "AircraftModel"
        multiplicity: "OneToMany"
  - name: "AircraftModel"
    description: "Certified aircraft model within a family that defines primary performance\
    \ and configuration boundaries."
    data:
      - name: "name"
        type: "String"
      - name: "modelDesignation"
        type: "String"
      - name: "aircraftType"
        type: "AircraftType"
    relations:
      - name: "family"
        type: "AircraftFamily"
        multiplicity: "ManyToOne"
      - name: "variants"
        type: "AircraftVariant"
        multiplicity: "OneToMany"
      - name: "engineTypes"
        type: "EngineType"
        multiplicity: "ManyToMany"
  - name: "EngineType"
    description: "Certified propulsion system definition offered for one or more aircraft\
    \ models."
    data:
      - name: "engineModelCode"
        type: "String"
      - name: "category"
        type: "EngineCategory"
      - name: "maxThrustKn"
        type: "Decimal"
    relations:
      - name: "supplier"
        type: "Supplier"
        multiplicity: "ManyToOne"
      - name: "compatibleModels"
        type: "AircraftModel"
        multiplicity: "ManyToMany"
  - name: "AircraftVariant"
    description: "Specific variant of an aircraft model with defined range, weight,\
    \ and system options."
    data:
      - name: "variantCode"
        type: "String"
      - name: "rangeNm"
        type: "Integer"
      - name: "maxTakeoffWeightKg"
        type: "Decimal"
    relations:
      - name: "model"
        type: "AircraftModel"
        multiplicity: "ManyToOne"
      - name: "engineType"
        type: "EngineType"
        multiplicity: "ManyToOne"
      - name: "avionicsSuite"
        type: "AvionicsSuite"
        multiplicity: "ManyToOne"
      - name: "apu"
        type: "APU"
        multiplicity: "ManyToOne"
      - name: "landingGear"
        type: "LandingGear"
        multiplicity: "ManyToOne"
      - name: "cabinLayouts"
        type: "CabinLayout"
        multiplicity: "OneToMany"
      - name: "options"
        type: "AircraftOption"
        multiplicity: "ManyToMany"
      - name: "packages"
        type: "AircraftPackage"
        multiplicity: "ManyToMany"
  - name: "AvionicsSuite"
    description: "Integrated flight deck hardware and software baseline certified for\
    \ specific aircraft."
    data:
      - name: "suiteName"
        type: "String"
      - name: "softwareBaseline"
        type: "String"
    relations:
      - name: "supplier"
        type: "Supplier"
        multiplicity: "ManyToOne"
      - name: "variants"
        type: "AircraftVariant"
        multiplicity: "OneToMany"
      - name: "softwareLoads"
        type: "SoftwareLoad"
        multiplicity: "OneToMany"
  - name: "APU"
    description: "Auxiliary power unit specification providing electrical and pneumatic\
    \ power on the ground and in flight."
    data:
      - name: "model"
        type: "String"
    relations:
      - name: "supplier"
        type: "Supplier"
        multiplicity: "ManyToOne"
      - name: "variants"
        type: "AircraftVariant"
        multiplicity: "OneToMany"
  - name: "LandingGear"
    description: "Landing gear system definition, including configuration and supplier\
    \ part references."
    data:
      - name: "gearType"
        type: "LandingGearType"
      - name: "supplierPartNumber"
        type: "String"
    relations:
      - name: "supplier"
        type: "Supplier"
        multiplicity: "ManyToOne"
      - name: "variants"
        type: "AircraftVariant"
        multiplicity: "OneToMany"
  - name: "AircraftOption"
    description: "Selectable customer option such as satcom, galleys, or safety equipment."
    data:
      - name: "code"
        type: "String"
      - name: "name"
        type: "String"
      - name: "optionCategory"
        type: "OptionCategory"
    relations:
      - name: "variants"
        type: "AircraftVariant"
        multiplicity: "ManyToMany"
      - name: "packages"
        type: "AircraftPackage"
        multiplicity: "ManyToMany"
  - name: "AircraftPackage"
    description: "Bundle of coordinated options sold and certified together."
    data:
      - name: "name"
        type: "String"
      - name: "packageType"
        type: "PackageType"
    relations:
      - name: "options"
        type: "AircraftOption"
        multiplicity: "ManyToMany"
      - name: "variants"
        type: "AircraftVariant"
        multiplicity: "ManyToMany"
  - name: "Supplier"
    description: "External organization providing parts, systems, tooling, or services\
    \ to aerospace manufacturers."
    data:
      - name: "name"
        type: "String"
      - name: "supplierType"
        type: "SupplierType"
      - name: "approvalStatus"
        type: "SupplierApprovalStatus"
    relations:
      - name: "manufacturers"
        type: "AerospaceManufacturer"
        multiplicity: "ManyToMany"
      - name: "components"
        type: "Component_"
        multiplicity: "OneToMany"
      - name: "engineTypes"
        type: "EngineType"
        multiplicity: "OneToMany"
      - name: "avionicsSuites"
        type: "AvionicsSuite"
        multiplicity: "OneToMany"
      - name: "apus"
        type: "APU"
        multiplicity: "OneToMany"
      - name: "landingGears"
        type: "LandingGear"
        multiplicity: "OneToMany"
  - name: "Component_"
    description: "Part or assembly used in production or maintenance, tracked by part\
    \ number and serialization method."
    data:
      - name: "partNumber"
        type: "String"
      - name: "name"
        type: "String"
      - name: "componentCategory"
        type: "ComponentCategory"
      - name: "serializationMethod"
        type: "SerializationMethod"
    relations:
      - name: "supplier"
        type: "Supplier"
        multiplicity: "ManyToOne"
  - name: "Plant"
    description: "Manufacturing facility where assembly, integration, and testing operations\
    \ occur."
    data:
      - name: "name"
        type: "String"
      - name: "plantCode"
        type: "String"
      - name: "address"
        type: "Address"
    relations:
      - name: "manufacturer"
        type: "AerospaceManufacturer"
        multiplicity: "ManyToOne"
      - name: "productionLines"
        type: "ProductionLine"
        multiplicity: "OneToMany"
      - name: "warehouses"
        type: "Warehouse"
        multiplicity: "OneToMany"
  - name: "ProductionLine"
    description: "Organized line or area performing repeatable assembly or integration\
    \ activities."
    data:
      - name: "name"
        type: "String"
      - name: "lineType"
        type: "ProductionLineType"
    relations:
      - name: "plant"
        type: "Plant"
        multiplicity: "ManyToOne"
      - name: "workCenters"
        type: "WorkCenter"
        multiplicity: "OneToMany"
  - name: "WorkCenter"
    description: "Station or cell with defined capability and staffing within a production\
    \ line."
    data:
      - name: "name"
        type: "String"
      - name: "capability"
        type: "String"
    relations:
      - name: "productionLine"
        type: "ProductionLine"
        multiplicity: "ManyToOne"
  - name: "ProductionOrder"
    description: "Executable instruction to assemble an aircraft or major assembly according\
    \ to a defined configuration."
    data:
      - name: "orderNumber"
        type: "String"
      - name: "status"
        type: "ProductionOrderStatus"
    relations:
      - name: "variant"
        type: "AircraftVariant"
        multiplicity: "ManyToOne"
      - name: "plant"
        type: "Plant"
        multiplicity: "ManyToOne"
      - name: "aircraftOrder"
        type: "AircraftOrder"
        multiplicity: "ManyToOne"
  - name: "BuildSchedule"
    description: "Time-phased plan grouping and sequencing multiple production orders."
    data:
      - name: "scheduleNumber"
        type: "String"
      - name: "status"
        type: "ScheduleStatus"
    relations:
      - name: "productionOrders"
        type: "ProductionOrder"
        multiplicity: "OneToMany"
  - name: "Warehouse"
    description: "Storage location for components, materials, and consumables."
    data:
      - name: "name"
        type: "String"
    relations:
      - name: "inventoryItems"
        type: "InventoryItem"
        multiplicity: "OneToMany"
  - name: "InventoryItem"
    description: "Stock record for a component within a specific warehouse."
    data:
      - name: "quantityOnHand"
        type: "Integer"
      - name: "quantityReserved"
        type: "Integer"
      - name: "lotNumber"
        type: "String"
    relations:
      - name: "component"
        type: "Component_"
        multiplicity: "ManyToOne"
      - name: "warehouse"
        type: "Warehouse"
        multiplicity: "ManyToOne"
  - name: "Operator"
    description: "Organization that operates aircraft, including airlines, cargo carriers,\
    \ governments, private owners, and lessors."
    data:
      - name: "name"
        type: "String"
      - name: "operatorType"
        type: "OperatorType"
      - name: "icaoDesignator"
        type: "String"
    relations:
      - name: "aircraftOrders"
        type: "AircraftOrder"
        multiplicity: "OneToMany"
      - name: "operatedAircraft"
        type: "Aircraft"
        multiplicity: "OneToMany"
      - name: "salesRegion"
        type: "SalesRegion"
        multiplicity: "ManyToOne"
  - name: "AircraftOrder"
    description: "Commercial order placed by an operator for one or more aircraft."
    data:
      - name: "orderNumber"
        type: "String"
      - name: "status"
        type: "AircraftOrderStatus"
      - name: "totalAmount"
        type: "Money"
    relations:
      - name: "operator"
        type: "Operator"
        multiplicity: "ManyToOne"
      - name: "variant"
        type: "AircraftVariant"
        multiplicity: "ManyToOne"
      - name: "quote"
        type: "Quote"
        multiplicity: "OneToOne"
      - name: "purchaseAgreement"
        type: "PurchaseAgreement"
        multiplicity: "OneToOne"
  - name: "Quote"
    description: "Commercial quotation issued to an operator for an aircraft order."
    data:
      - name: "quoteNumber"
        type: "String"
      - name: "totalAmount"
        type: "Money"
    relations:
      - name: "aircraftOrder"
        type: "AircraftOrder"
        multiplicity: "OneToOne"
  - name: "PurchaseAgreement"
    description: "Binding sales contract that governs pricing, deliveries, and terms\
    \ for aircraft purchases."
    data:
      - name: "agreementNumber"
        type: "String"
      - name: "effectiveDate"
        type: "Date"
    relations:
      - name: "aircraftOrder"
        type: "AircraftOrder"
        multiplicity: "OneToOne"
  - name: "Aircraft"
    description: "Individual aircraft produced and delivered, identified by manufacturer\
    \ serial number and national registration."
    data:
      - name: "msn"
        type: "MSN"
      - name: "deliveryDate"
        type: "Date"
    relations:
      - name: "variant"
        type: "AircraftVariant"
        multiplicity: "ManyToOne"
      - name: "operator"
        type: "Operator"
        multiplicity: "ManyToOne"
      - name: "registration"
        type: "Registration"
        multiplicity: "OneToOne"
      - name: "warranty"
        type: "Warranty"
        multiplicity: "OneToOne"
      - name: "maintenanceRecords"
        type: "MaintenanceWorkOrder"
        multiplicity: "OneToMany"
      - name: "connectedAircraft"
        type: "ConnectedAircraft"
        multiplicity: "OneToOne"
      - name: "cabinLayout"
        type: "CabinLayout"
        multiplicity: "ManyToOne"
  - name: "Registration"
    description: "National registration details for an aircraft including tail number\
    \ and registry."
    data:
      - name: "tailNumber"
        type: "TailNumber"
      - name: "registryCountry"
        type: "String"
    relations:
      - name: "aircraft"
        type: "Aircraft"
        multiplicity: "OneToOne"
  - name: "Warranty"
    description: "Post-delivery coverage provided by the manufacturer or system suppliers."
    data:
      - name: "warrantyType"
        type: "WarrantyType"
      - name: "coverageMonths"
        type: "Integer"
    relations:
      - name: "aircraft"
        type: "Aircraft"
        multiplicity: "OneToOne"
  - name: "CabinLayout"
    description: "Certified interior configuration including seating, monuments, and\
    \ equipment."
    data:
      - name: "layoutCode"
        type: "String"
      - name: "totalSeats"
        type: "Integer"
      - name: "classLayout"
        type: "String"
    relations:
      - name: "variant"
        type: "AircraftVariant"
        multiplicity: "ManyToOne"
      - name: "aircraft"
        type: "Aircraft"
        multiplicity: "OneToMany"
      - name: "options"
        type: "AircraftOption"
        multiplicity: "ManyToMany"
  - name: "MROFacility"
    description: "Maintenance, repair, and overhaul facility authorized to service aircraft\
    \ and components."
    data:
      - name: "name"
        type: "String"
      - name: "approvalScope"
        type: "String"
      - name: "address"
        type: "Address"
    relations:
      - name: "appointments"
        type: "MaintenanceAppointment"
        multiplicity: "OneToMany"
      - name: "workOrders"
        type: "MaintenanceWorkOrder"
        multiplicity: "OneToMany"
  - name: "MaintenanceAppointment"
    description: "Scheduled maintenance slot for an aircraft at an MRO facility."
    data:
      - name: "appointmentDate"
        type: "Date"
      - name: "status"
        type: "AppointmentStatus"
    relations:
      - name: "aircraft"
        type: "Aircraft"
        multiplicity: "ManyToOne"
      - name: "mroFacility"
        type: "MROFacility"
        multiplicity: "ManyToOne"
      - name: "workOrder"
        type: "MaintenanceWorkOrder"
        multiplicity: "OneToOne"
  - name: "MaintenanceWorkOrder"
    description: "Authorization, execution, and record of maintenance performed on an\
    \ aircraft."
    data:
      - name: "workOrderNumber"
        type: "String"
      - name: "status"
        type: "WorkOrderStatus"
    relations:
      - name: "aircraft"
        type: "Aircraft"
        multiplicity: "ManyToOne"
      - name: "airworthinessDirective"
        type: "AirworthinessDirective"
        multiplicity: "ManyToOne"
      - name: "serviceBulletin"
        type: "ServiceBulletin"
        multiplicity: "ManyToOne"
  - name: "AirworthinessDirective"
    description: "Mandatory corrective action issued by aviation authorities to address\
    \ unsafe conditions."
    data:
      - name: "directiveNumber"
        type: "String"
      - name: "title"
        type: "String"
    relations:
      - name: "workOrders"
        type: "MaintenanceWorkOrder"
        multiplicity: "OneToMany"
  - name: "ServiceBulletin"
    description: "Manufacturer-issued instruction recommending modifications, inspections,\
    \ or updates."
    data:
      - name: "bulletinNumber"
        type: "String"
      - name: "category"
        type: "ServiceBulletinCategory"
    relations:
      - name: "workOrders"
        type: "MaintenanceWorkOrder"
        multiplicity: "OneToMany"
      - name: "variants"
        type: "AircraftVariant"
        multiplicity: "ManyToMany"
  - name: "ConnectedAircraft"
    description: "Aircraft with active connectivity enabling telemetry, diagnostics,\
    \ and remote updates."
    data:
      - name: "communicationsProvider"
        type: "String"
      - name: "connectivityStatus"
        type: "ConnectivityStatus"
    relations:
      - name: "aircraft"
        type: "Aircraft"
        multiplicity: "OneToOne"
      - name: "flightHealthEvents"
        type: "FlightHealthEvent"
        multiplicity: "OneToMany"
      - name: "softwareLoads"
        type: "SoftwareLoad"
        multiplicity: "OneToMany"
  - name: "FlightHealthEvent"
    description: "Aircraft condition or fault event captured by onboard monitoring and\
    \ transmitted via connectivity."
    data:
      - name: "eventCode"
        type: "String"
      - name: "severity"
        type: "EventSeverity"
    relations:
      - name: "connectedAircraft"
        type: "ConnectedAircraft"
        multiplicity: "ManyToOne"
  - name: "SoftwareLoad"
    description: "Delivered software image or configuration for onboard systems."
    data:
      - name: "version"
        type: "String"
      - name: "loadType"
        type: "SoftwareLoadType"
    relations:
      - name: "connectedAircraft"
        type: "ConnectedAircraft"
        multiplicity: "ManyToOne"
      - name: "avionicsSuite"
        type: "AvionicsSuite"
        multiplicity: "ManyToOne"
  - name: "TypeCertificate"
    description: "Regulatory approval that the aircraft design meets applicable airworthiness\
    \ standards."
    data:
      - name: "certificateNumber"
        type: "String"
      - name: "authority"
        type: "String"
    relations:
      - name: "program"
        type: "AircraftProgram"
        multiplicity: "ManyToOne"
  - name: "ProductionCertificate"
    description: "Regulatory approval that the manufacturer’s production system maintains\
    \ conformity to the type design."
    data:
      - name: "certificateNumber"
        type: "String"
      - name: "authority"
        type: "String"
    relations:
      - name: "manufacturer"
        type: "AerospaceManufacturer"
        multiplicity: "ManyToOne"
  - name: "SalesRegion"
    description: "Geographic region used to organize aerospace sales and marketing activities."
    data:
      - name: "name"
        type: "String"
      - name: "regionCode"
        type: "String"
    relations:
      - name: "operators"
        type: "Operator"
        multiplicity: "OneToMany"
      - name: "salesCampaigns"
        type: "SalesCampaign"
        multiplicity: "OneToMany"
  - name: "SalesCampaign"
    description: "Coordinated sales effort targeting specific operators within a region."
    data:
      - name: "campaignCode"
        type: "String"
      - name: "status"
        type: "SalesCampaignStatus"
    relations:
      - name: "region"
        type: "SalesRegion"
        multiplicity: "ManyToOne"
      - name: "operator"
        type: "Operator"
        multiplicity: "ManyToOne"
      - name: "quotes"
        type: "Quote"
        multiplicity: "OneToMany"
metadata:
  name: "Aerospace Industry Domain Model"
  description: "Metadata describing this Aerospace HCIDL document."
  version: "1.0.0"
  industry: "Aerospace"
  category: "Manufacturing"
  type: "Industry"
  domain: "Aerospace"
enums:
  - name: "AircraftType"
    description: "High-level classification of aircraft based on design and mission."
    data:
      - name: "NarrowBody"
      - name: "WideBody"
      - name: "RegionalJet"
      - name: "Turboprop"
      - name: "BusinessJet"
      - name: "Helicopter"
      - name: "eVTOL"
      - name: "CargoPlane"
  - name: "EngineCategory"
    description: "Primary propulsion technology and architecture."
    data:
      - name: "Turbofan"
      - name: "Turboprop"
      - name: "Turbojet"
      - name: "Piston"
      - name: "Electric"
      - name: "Rocket"
  - name: "LandingGearType"
    description: "Configuration of the landing gear system."
    data:
      - name: "Tricycle"
      - name: "Tandem"
      - name: "Taildragger"
      - name: "Skid"
      - name: "Floats"
      - name: "Retractable"
  - name: "OptionCategory"
    description: "Logical grouping for selectable aircraft options."
    data:
      - name: "Cabin"
      - name: "Connectivity"
      - name: "Safety"
      - name: "Performance"
      - name: "Paint"
      - name: "FlightDeck"
  - name: "PackageType"
    description: "Category of bundled options offered commercially."
    data:
      - name: "PerformancePack"
      - name: "CabinPack"
      - name: "ConnectivityPack"
      - name: "CompliancePack"
  - name: "SupplierType"
    description: "Nature of goods or services provided by the supplier."
    data:
      - name: "Airframe"
      - name: "Engine"
      - name: "Avionics"
      - name: "Systems"
      - name: "Materials"
      - name: "MRO"
      - name: "Testing"
  - name: "SupplierApprovalStatus"
    description: "Qualification status for participating in production or services."
    data:
      - name: "Applied"
      - name: "Approved"
      - name: "OnHold"
      - name: "Suspended"
  - name: "ComponentCategory"
    description: "Classification of parts and assemblies by function."
    data:
      - name: "Structure"
      - name: "System"
      - name: "Avionics"
      - name: "Interior"
      - name: "LandingGear"
      - name: "Powerplant"
      - name: "Consumable"
  - name: "SerializationMethod"
    description: "Method used to track the identity of a part."
    data:
      - name: "Serialized"
      - name: "LotTracked"
      - name: "None"
  - name: "ProductionLineType"
    description: "Type of manufacturing flow or area."
    data:
      - name: "FinalAssembly"
      - name: "SubAssembly"
      - name: "Integration"
      - name: "TestAndDelivery"
  - name: "ProductionOrderStatus"
    description: "Lifecycle state of a production order."
    data:
      - name: "Planned"
      - name: "Released"
      - name: "InAssembly"
      - name: "FlightTest"
      - name: "Completed"
  - name: "ScheduleStatus"
    description: "Publication and control status of a build schedule."
    data:
      - name: "Draft"
      - name: "Published"
      - name: "Revised"
      - name: "Closed"
  - name: "OperatorType"
    description: "Type of entity operating the aircraft."
    data:
      - name: "Airline"
      - name: "Cargo"
      - name: "Government"
      - name: "Private"
      - name: "Lessor"
  - name: "AircraftOrderStatus"
    description: "Commercial status of an aircraft order."
    data:
      - name: "Draft"
      - name: "Committed"
      - name: "InProduction"
      - name: "Delivered"
      - name: "Cancelled"
  - name: "WarrantyType"
    description: "Coverage category applicable to the delivered aircraft."
    data:
      - name: "Basic"
      - name: "Powerplant"
      - name: "Avionics"
      - name: "Corrosion"
  - name: "AppointmentStatus"
    description: "Status of a maintenance appointment at an MRO facility."
    data:
      - name: "Scheduled"
      - name: "InProgress"
      - name: "Completed"
      - name: "Cancelled"
      - name: "Deferred"
  - name: "WorkOrderStatus"
    description: "Execution state of a maintenance work order."
    data:
      - name: "Open"
      - name: "InProgress"
      - name: "AwaitingParts"
      - name: "Closed"
      - name: "Deferred"
  - name: "ServiceBulletinCategory"
    description: "Criticality and recommended action level for a service bulletin."
    data:
      - name: "Recommended"
