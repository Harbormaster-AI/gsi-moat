metadata:
  name: "Manufacturing Industry Domain Model"
  version: "1.0.0"
  industry: "Manufacturing"
  category: "Manufacturing"
  description: "HCIDL model capturing core discrete and process manufacturing capabilities\
    \ across planning, procurement, production, quality, maintenance, inventory, and\
    \ sales."
  language: "en-US"
  type: "Industry"
  domain: "Manufacturing"
