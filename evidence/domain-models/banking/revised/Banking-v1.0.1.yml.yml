  - name: "Mastercard"
  - name: "Amex"
  - name: "Discover"
  - name: "UnionPay"
  - name: "Other"
- name: "LoanType"
  description: "Category of loan product."
  data:
  - name: "Mortgage"
  - name: "Personal"
  - name: "Auto"
  - name: "SmallBusiness"
  - name: "CreditLine"
  - name: "Student"
- name: "LoanStatus"
  description: "Lifecycle state of a loan account."
  data:
  - name: "Applied"
  - name: "Approved"
  - name: "Active"
  - name: "Delinquent"
  - name: "Defaulted"
  - name: "Closed"
- name: "RateType"
  description: "Interest rate behavior over time."
