metadata:
  name: "Banking Industry Domain Model"
  version: "1.0.1"
  industry: "Banking"
  category: "Banking"
  description: "HCIDL model capturing core banking, payments, lending, cards, KYC,\
    \ and FX capabilities."
  type: "Industry"
  domain: "Banking"
enums:
- name: "CustomerType"
  description: "Classification of the customer as a legal person or organization."
  data:
  - name: "Individual"
  - name: "Business"
  - name: "NonProfit"
  - name: "Government"
- name: "AccountType"
  description: "Kind of deposit account offered by the bank."
  data:
  - name: "Checking"
  - name: "Savings"
  - name: "MoneyMarket"
  - name: "TimeDeposit"
- name: "AccountStatus"
  description: "Lifecycle state of a deposit account."
  data:
  - name: "Open"
  - name: "Frozen"
  - name: "Dormant"
  - name: "Closed"
- name: "AccountOwnershipType"
  description: "Ownership structure of an account."
  data:
  - name: "Sole"
  - name: "Joint"
  - name: "Corporate"
  - name: "Trust"
- name: "StatementDeliveryMethod"
  description: "Preferred channel for receiving account statements."
  data:
  - name: "Electronic"
  - name: "Paper"
- name: "TransactionType"
  description: "Business categorization of a financial transaction."
  data:
  - name: "Deposit"
  - name: "Withdrawal"
  - name: "Transfer"
  - name: "Payment"
  - name: "Fee"
  - name: "Interest"
  - name: "Adjustment"
  - name: "Chargeback"
  - name: "Refund"
  - name: "FXConversion"
- name: "TransactionStatus"
  description: "Processing state of a transaction."
  data:
  - name: "Pending"
  - name: "Posted"
  - name: "Reversed"
  - name: "Failed"
  - name: "Cancelled"
- name: "TransactionDirection"
  description: "Indicates whether funds are credited or debited."
  data:
  - name: "Credit"
  - name: "Debit"
- name: "ChannelType"
  description: "Channel through which a customer interaction or transaction occurs."
  data:
  - name: "Branch"
  - name: "Online"
  - name: "Mobile"
  - name: "ATM"
  - name: "API"
  - name: "CallCenter"
- name: "PaymentMethod"
  description: "Network or instrument used to move funds."
  data:
  - name: "InternalTransfer"
  - name: "ACH"
  - name: "Wire"
  - name: "SEPA"
  - name: "SWIFT"
  - name: "Card"
  - name: "Cash"
  - name: "Check"
  - name: "MobileWallet"
- name: "PaymentStatus"
  description: "Settlement state of a payment or transfer."
  data:
  - name: "Initiated"
  - name: "InProcess"
  - name: "Settled"
  - name: "Failed"
  - name: "Reversed"
  - name: "Cancelled"
- name: "StandingInstructionFrequency"
  description: "Cadence for executing a standing instruction."
  data:
  - name: "OneTime"
  - name: "Weekly"
  - name: "BiWeekly"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "Annually"
- name: "StandingInstructionStatus"
  description: "Lifecycle status of a standing instruction."
  data:
  - name: "Active"
  - name: "Paused"
  - name: "Cancelled"
  - name: "Completed"
- name: "CardType"
  description: "Functional type of a payment card."
  data:
  - name: "Debit"
  - name: "Credit"
  - name: "Prepaid"
  - name: "Virtual"
- name: "CardStatus"
  description: "Operational state of a payment card."
  data:
  - name: "Active"
  - name: "Blocked"
  - name: "LostStolen"
  - name: "Expired"
  - name: "Closed"
- name: "CardNetwork"
  description: "Payment card network facilitating authorization and settlement."
  data:
