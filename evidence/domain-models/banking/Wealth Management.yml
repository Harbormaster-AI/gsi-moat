---
metadata:
  name: "Wealth Management Capabilities Model"
  description: "Canonical HCIDL model for wealth management covering advisory, portfolio\
    \ management, trading, client servicing, billing, and compliance."
  version: "1.0.0"
  industry: "Financial Services"
  category: "Banking"
  type: "Capability"
  domain: "Wealth Management"
entities:
- name: "WealthFirm"
  description: "Legal entity providing wealth and investment advisory services."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "domicileCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "advisors"
    type: "Advisor"
    multiplicity: "OneToMany"
  - name: "offices"
    type: "Office"
    multiplicity: "OneToMany"
  - name: "custodians"
    type: "Custodian"
    multiplicity: "ManyToMany"
  - name: "investmentPrograms"
    type: "InvestmentProgram"
    multiplicity: "OneToMany"
- name: "Office"
  description: "Physical or virtual branch location serving clients and hosting advisors."
  data:
  - name: "name"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "firm"
    type: "WealthFirm"
    multiplicity: "ManyToOne"
  - name: "advisors"
    type: "Advisor"
    multiplicity: "OneToMany"
- name: "Advisor"
  description: "Licensed professional who provides financial planning and investment\
    \ advice."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "role"
    type: "AdvisorRole"
  - name: "licenseNumber"
    type: "String"
  relations:
  - name: "firm"
    type: "WealthFirm"
    multiplicity: "ManyToOne"
  - name: "office"
    type: "Office"
    multiplicity: "ManyToOne"
  - name: "clients"
    type: "Client"
    multiplicity: "OneToMany"
  - name: "advisoryTeam"
    type: "AdvisoryTeam"
    multiplicity: "ManyToOne"
- name: "AdvisoryTeam"
  description: "Collaborative group of advisors and support staff serving shared households."
  data:
  - name: "name"
    type: "String"
  - name: "specialization"
    type: "String"
  relations:
  - name: "advisors"
    type: "Advisor"
    multiplicity: "OneToMany"
  - name: "households"
    type: "Household"
    multiplicity: "OneToMany"
- name: "Household"
  description: "Grouping of related clients for planning, reporting, and advice delivery."
  data:
  - name: "name"
    type: "String"
  relations:
  - name: "clients"
    type: "Client"
    multiplicity: "OneToMany"
  - name: "primaryAdvisor"
    type: "Advisor"
    multiplicity: "ManyToOne"
  - name: "portfolios"
    type: "Portfolio"
    multiplicity: "OneToMany"
  - name: "goals"
    type: "WealthGoal"
    multiplicity: "OneToMany"
  - name: "riskAssessments"
    type: "RiskAssessment"
    multiplicity: "OneToMany"
- name: "Client"
  description: "Individual or entity receiving advisory and investment services."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "taxResidency"
    type: "String"
  - name: "dateOfBirth"
    type: "Date"
  - name: "email"
    type: "String"
  relations:
  - name: "household"
    type: "Household"
    multiplicity: "ManyToOne"
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
  - name: "beneficiaries"
    type: "Beneficiary"
    multiplicity: "OneToMany"
  - name: "kycRecord"
    type: "KycRecord"
    multiplicity: "OneToOne"
  - name: "agreements"
    type: "Agreement"
    multiplicity: "OneToMany"
- name: "KycRecord"
  description: "Know-your-customer profile capturing client identity, due diligence,\
    \ and AML screening results."
  data:
  - name: "assessmentDate"
    type: "Date"
  - name: "status"
    type: "KycStatus"
  - name: "pepFlag"
    type: "Boolean"
  - name: "sourceOfWealth"
    type: "String"
  relations:
  - name: "client"
    type: "Client"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
- name: "Beneficiary"
  description: "Person or entity designated to receive assets or benefits from an\
    \ account."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "relationship"
    type: "String"
  - name: "allocationPercent"
    type: "Percentage"
  relations:
  - name: "client"
    type: "Client"
    multiplicity: "ManyToOne"
  - name: "accounts"
    type: "Account"
    multiplicity: "ManyToMany"
- name: "Custodian"
  description: "Financial institution safeguarding client assets and facilitating\
    \ settlement."
  data:
  - name: "name"
    type: "String"
  - name: "clearingNumber"
    type: "String"
  - name: "country"
    type: "String"
  relations:
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "transfers"
    type: "AccountTransfer"
    multiplicity: "OneToMany"
- name: "Account"
  description: "Financial account used to custody assets and record transactions."
  data:
  - name: "name"
    type: "String"
  - name: "accountNumber"
    type: "AccountNumber"
  - name: "accountType"
    type: "AccountType"
  - name: "registrationType"
    type: "RegistrationType"
  - name: "baseCurrency"
    type: "String"
  - name: "openedDate"
    type: "Date"
  - name: "status"
    type: "AccountStatus"
  relations:
  - name: "household"
    type: "Household"
    multiplicity: "ManyToOne"
  - name: "advisor"
    type: "Advisor"
    multiplicity: "ManyToOne"
  - name: "custodian"
    type: "Custodian"
    multiplicity: "ManyToOne"
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "OneToOne"
  - name: "beneficiaries"
    type: "Beneficiary"
    multiplicity: "ManyToMany"
  - name: "positions"
    type: "Position"
    multiplicity: "OneToMany"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
  - name: "fees"
    type: "Fee"
    multiplicity: "OneToMany"
  - name: "standingInstructions"
    type: "StandingInstruction"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
- name: "Portfolio"
  description: "Aggregation of holdings managed to a stated objective, often aligned\
    \ to an account."
  data:
  - name: "name"
    type: "String"
  - name: "portfolioType"
    type: "PortfolioType"
  - name: "baseCurrency"
    type: "String"
  - name: "inceptionDate"
    type: "Date"
  - name: "rebalanceFrequency"
    type: "RebalanceFrequency"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "OneToOne"
  - name: "modelPortfolio"
    type: "ModelPortfolio"
    multiplicity: "ManyToOne"
  - name: "benchmark"
    type: "Benchmark"
    multiplicity: "ManyToOne"
  - name: "investmentPolicy"
    type: "InvestmentPolicy"
    multiplicity: "OneToOne"
  - name: "positions"
    type: "Position"
    multiplicity: "OneToMany"
  - name: "performanceReports"
    type: "PerformanceReport"
    multiplicity: "OneToMany"
  - name: "rebalancePlans"
    type: "RebalancePlan"
    multiplicity: "OneToMany"
- name: "InvestmentProgram"
  description: "Discretionary or advisory program defining governance, product set,\
    \ and fee construct."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "programType"
    type: "String"
  relations:
  - name: "modelPortfolios"
    type: "ModelPortfolio"
    multiplicity: "OneToMany"
  - name: "feeSchedules"
    type: "FeeSchedule"
    multiplicity: "OneToMany"
- name: "ModelPortfolio"
  description: "Blueprint portfolio with target asset allocation and risk parameters."
  data:
  - name: "name"
    type: "String"
  - name: "objective"
    type: "String"
  - name: "riskLevel"
    type: "RiskToleranceLevel"
  relations:
  - name: "allocations"
    type: "AssetAllocationSlice"
    multiplicity: "OneToMany"
  - name: "portfolios"
    type: "Portfolio"
    multiplicity: "OneToMany"
- name: "AssetAllocationSlice"
  description: "Target weight for a specific asset class within a model portfolio."
  data:
  - name: "assetClass"
    type: "AssetClass"
  - name: "targetWeight"
    type: "Percentage"
  relations:
  - name: "modelPortfolio"
    type: "ModelPortfolio"
    multiplicity: "ManyToOne"
- name: "InvestmentPolicy"
  description: "Portfolio-specific constraints, objectives, and suitability criteria."
  data:
  - name: "policyNumber"
    type: "String"
  - name: "suitabilityStatus"
    type: "SuitabilityStatus"
  - name: "constraints"
    type: "String"
  relations:
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
  - name: "riskAssessment"
    type: "RiskAssessment"
    multiplicity: "ManyToOne"
  - name: "goals"
    type: "WealthGoal"
    multiplicity: "OneToMany"
- name: "RiskAssessment"
  description: "Measurement of client risk tolerance, capacity, and investment horizon."
  data:
  - name: "assessmentDate"
    type: "Date"
  - name: "riskTolerance"
    type: "RiskToleranceLevel"
  - name: "capacityScore"
    type: "Integer"
  - name: "horizonYears"
    type: "Integer"
  relations:
  - name: "household"
    type: "Household"
    multiplicity: "ManyToOne"
  - name: "advisor"
    type: "Advisor"
    multiplicity: "ManyToOne"
- name: "WealthGoal"
  description: "Financial objective used to guide planning and portfolio design."
  data:
  - name: "name"
    type: "String"
  - name: "goalType"
    type: "GoalType"
  - name: "targetAmount"
    type: "Money"
  - name: "targetDate"
    type: "Date"
  - name: "priority"
    type: "Integer"
  relations:
  - name: "household"
    type: "Household"
    multiplicity: "ManyToOne"
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
  - name: "investmentPolicy"
    type: "InvestmentPolicy"
    multiplicity: "ManyToOne"
- name: "Security"
  description: "Tradable financial instrument such as equity, fund, or fixed income."
  data:
  - name: "ticker"
    type: "String"
  - name: "name"
    type: "String"
  - name: "securityType"
    type: "SecurityType"
  - name: "assetClass"
    type: "AssetClass"
  - name: "currency"
    type: "String"
  - name: "isin"
    type: "ISIN"
  - name: "cusip"
    type: "CUSIP"
  - name: "expenseRatio"
    type: "Percentage"
  relations:
  - name: "corporateActions"
    type: "CorporateAction"
    multiplicity: "OneToMany"
  - name: "prices"
    type: "MarketPrice"
    multiplicity: "OneToMany"
  - name: "benchmarks"
    type: "Benchmark"
    multiplicity: "ManyToMany"
- name: "MarketPrice"
  description: "End-of-day or evaluated price for a security from a given source."
  data:
  - name: "price"
    type: "Money"
  - name: "priceDate"
    type: "Date"
  - name: "source"
    type: "PricingSourceType"
  relations:
  - name: "security"
    type: "Security"
    multiplicity: "ManyToOne"
- name: "CorporateAction"
  description: "Mandatory or voluntary event affecting a security and its holders."
  data:
  - name: "actionType"
    type: "CorporateActionType"
  - name: "recordDate"
    type: "Date"
  - name: "payableDate"
    type: "Date"
  - name: "details"
    type: "String"
  relations:
  - name: "security"
    type: "Security"
    multiplicity: "ManyToOne"
  - name: "dividends"
    type: "Dividend"
    multiplicity: "OneToMany"
- name: "Dividend"
  description: "Distribution of cash or shares to holders of a security."
  data:
  - name: "grossAmount"
    type: "Money"
  - name: "taxWithheld"
    type: "Money"
  relations:
  - name: "corporateAction"
    type: "CorporateAction"
    multiplicity: "ManyToOne"
- name: "Position"
  description: "Portfolio holding representing ownership of a security."
  data:
  - name: "positionType"
    type: "PositionType"
  - name: "quantity"
    type: "Decimal"
  - name: "costBasis"
    type: "Money"
  - name: "lotMethod"
    type: "TaxLotMethod"
  relations:
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
  - name: "security"
    type: "Security"
    multiplicity: "ManyToOne"
  - name: "taxLots"
    type: "TaxLot"
    multiplicity: "OneToMany"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
- name: "TaxLot"
  description: "Parcel of a position acquired at a specific time and price."
  data:
  - name: "acquisitionDate"
    type: "Date"
  - name: "quantity"
    type: "Decimal"
  - name: "unitCost"
    type: "Decimal"
  relations:
  - name: "position"
    type: "Position"
    multiplicity: "ManyToOne"
- name: "Transaction"
  description: "Ledger movement representing buys, sells, income, fees, or transfers."
  data:
  - name: "transactionType"
    type: "TransactionType"
  - name: "tradeDate"
    type: "Date"
  - name: "settleDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "quantity"
    type: "Decimal"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "security"
    type: "Security"
    multiplicity: "ManyToOne"
  - name: "order"
    type: "Order_"
    multiplicity: "ManyToOne"
  - name: "position"
    type: "Position"
    multiplicity: "ManyToOne"
- name: "Order_"
  description: "Instruction to buy or sell a security with specified terms."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "orderType"
    type: "OrderType"
  - name: "side"
    type: "OrderSide"
  - name: "quantity"
    type: "Decimal"
  - name: "priceType"
    type: "PriceType"
  - name: "limitPrice"
    type: "Decimal"
  - name: "timeInForce"
    type: "TimeInForce"
  - name: "status"
    type: "OrderStatus"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "security"
    type: "Security"
    multiplicity: "ManyToOne"
  - name: "allocations"
    type: "OrderAllocation"
    multiplicity: "OneToMany"
  - name: "trades"
    type: "Trade"
    multiplicity: "OneToMany"
  - name: "advisor"
    type: "Advisor"
    multiplicity: "ManyToOne"
- name: "OrderAllocation"
  description: "Allocation of an order to accounts or portfolios."
  data:
  - name: "allocationPercent"
    type: "Percentage"
  relations:
  - name: "order"
    type: "Order_"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
- name: "Trade"
  description: "Executed fill resulting from an order."
  data:
  - name: "executionId"
    type: "String"
  - name: "executionPrice"
    type: "Money"
  - name: "executedQuantity"
    type: "Decimal"
  - name: "tradeDate"
    type: "Date"
  - name: "status"
    type: "TradeStatus"
  - name: "venue"
    type: "String"
  relations:
  - name: "order"
    type: "Order_"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "security"
    type: "Security"
    multiplicity: "ManyToOne"
  - name: "transaction"
    type: "Transaction"
    multiplicity: "OneToOne"
- name: "RebalancePlan"
  description: "Proposed set of trades to realign a portfolio to targets and constraints."
  data:
  - name: "planDate"
    type: "Date"
  - name: "status"
    type: "RebalanceStatus"
  - name: "method"
    type: "RebalanceMethod"
  relations:
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
  - name: "proposedOrders"
    type: "Order_"
    multiplicity: "OneToMany"
  - name: "advisor"
    type: "Advisor"
    multiplicity: "ManyToOne"
- name: "PerformanceReport"
  description: "Periodic performance measurement and attribution for a portfolio."
  data:
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "netReturn"
    type: "Percentage"
  - name: "grossReturn"
    type: "Percentage"
  - name: "frequency"
    type: "PerformanceFrequency"
  relations:
  - name: "portfolio"
    type: "Portfolio"
    multiplicity: "ManyToOne"
  - name: "benchmark"
    type: "Benchmark"
    multiplicity: "ManyToOne"
- name: "Benchmark"
  description: "Reference index used to compare portfolio performance."
  data:
  - name: "name"
    type: "String"
  - name: "benchmarkType"
    type: "BenchmarkType"
  relations:
  - name: "performanceReports"
    type: "PerformanceReport"
    multiplicity: "OneToMany"
  - name: "constituents"
    type: "Security"
    multiplicity: "ManyToMany"
- name: "FeeSchedule"
  description: "Billing policy defining fee type, rate, and method of calculation."
  data:
  - name: "name"
    type: "String"
  - name: "feeType"
    type: "FeeType"
  - name: "billingMethod"
    type: "BillingMethod"
  - name: "rate"
    type: "Percentage"
  - name: "minimumFee"
    type: "Money"
  relations:
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "billingRuns"
    type: "BillingRun"
    multiplicity: "OneToMany"
- name: "Fee"
  description: "Calculated charge applied to an account for services rendered."
  data:
  - name: "feeDate"
    type: "Date"
  - name: "amount"
    type: "Money"
  - name: "feeType"
    type: "FeeType"
  - name: "description"
    type: "String"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "invoice"
    type: "Invoice"
    multiplicity: "ManyToOne"
- name: "BillingRun"
  description: "Operational cycle that computes fees and generates invoices for a\
    \ period."
  data:
  - name: "runDate"
    type: "Date"
  - name: "periodStart"
    type: "Date"
  - name: "periodEnd"
    type: "Date"
  - name: "status"
    type: "BillingRunStatus"
  relations:
  - name: "feeSchedule"
    type: "FeeSchedule"
    multiplicity: "ManyToOne"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
- name: "Invoice"
  description: "Statement of fees due from an account for a billing period."
  data:
  - name: "invoiceNumber"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "totalDue"
    type: "Money"
  - name: "status"
    type: "InvoiceStatus"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "fees"
    type: "Fee"
    multiplicity: "OneToMany"
  - name: "billingRun"
    type: "BillingRun"
    multiplicity: "ManyToOne"
- name: "Document"
  description: "Artifact supporting onboarding, compliance, or advice (e.g., IDs,\
    \ statements, forms)."
  data:
  - name: "documentType"
    type: "DocumentType"
  - name: "title"
    type: "String"
  - name: "fileName"
    type: "String"
  - name: "receivedDate"
    type: "Date"
  relations:
  - name: "client"
    type: "Client"
    multiplicity: "ManyToOne"
  - name: "kycRecord"
    type: "KycRecord"
    multiplicity: "ManyToOne"
  - name: "agreement"
    type: "Agreement"
    multiplicity: "ManyToOne"
- name: "Agreement"
  description: "Executed contract governing services, discretion, and fee authorization."
  data:
  - name: "agreementType"
    type: "AgreementType"
  - name: "effectiveDate"
    type: "Date"
  - name: "status"
    type: "AgreementStatus"
  relations:
  - name: "client"
    type: "Client"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "Document"
    multiplicity: "OneToMany"
- name: "ComplianceRule"
  description: "Policy or regulation expressed as a rule for pre- and post-trade controls."
  data:
  - name: "name"
    type: "String"
  - name: "ruleCode"
    type: "String"
  - name: "description"
    type: "String"
  - name: "ruleSeverity"
    type: "AlertSeverity"
  relations:
  - name: "alerts"
    type: "ComplianceAlert"
    multiplicity: "OneToMany"
- name: "ComplianceAlert"
  description: "Finding generated when a compliance rule is triggered."
  data:
  - name: "alertDate"
    type: "Date"
  - name: "status"
    type: "ComplianceStatus"
  - name: "severity"
    type: "AlertSeverity"
  - name: "message"
    type: "String"
  relations:
  - name: "rule"
    type: "ComplianceRule"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "order"
    type: "Order_"
    multiplicity: "ManyToOne"
  - name: "advisor"
    type: "Advisor"
    multiplicity: "ManyToOne"
- name: "Proposal"
  description: "Recommended strategy, allocations, and products prepared for a household."
  data:
  - name: "proposalNumber"
    type: "String"
  - name: "createdDate"
    type: "Date"
  - name: "recommendationText"
    type: "String"
  - name: "status"
    type: "ProposalStatus"
  - name: "expectedRisk"
    type: "RiskToleranceLevel"
  relations:
  - name: "household"
    type: "Household"
    multiplicity: "ManyToOne"
  - name: "advisor"
    type: "Advisor"
    multiplicity: "ManyToOne"
  - name: "modelPortfolio"
    type: "ModelPortfolio"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
- name: "AccountTransfer"
  description: "Movement of assets between custodians or accounts, including ACAT\
    \ transfers."
  data:
  - name: "transferType"
    type: "TransferType"
  - name: "status"
    type: "TransferStatus"
  - name: "requestDate"
    type: "Date"
  - name: "completionDate"
    type: "Date"
  relations:
  - name: "fromCustodian"
    type: "Custodian"
