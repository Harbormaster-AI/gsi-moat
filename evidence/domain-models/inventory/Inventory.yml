---
metadata:
  name: "HCIDL Inventory Capabilities Model"
  description: "Canonical capability model for managing inventory across warehouses,\
    \ locations, items, and stock movements."
  version: "1.0.0"
  industry: "Cross-Industry"
  category: "Product & Catalog"
  type: "Capability"
  domain: "Inventory"
entities:
- name: "StockKeepingUnit"
  description: "Master definition of an inventory-managed item used for stocking,\
    \ movement, and valuation."
  data:
  - name: "skuCode"
    type: "SKU"
  - name: "name"
    type: "String"
  - name: "itemType"
    type: "ItemType"
  - name: "unitOfMeasure"
    type: "UnitOfMeasure"
  - name: "weight"
    type: "Decimal"
  - name: "weightUnit"
    type: "String"
  - name: "volume"
    type: "Decimal"
  - name: "volumeUnit"
    type: "String"
  - name: "shelfLifeDays"
    type: "Integer"
  - name: "hazardousMaterial"
    type: "Boolean"
  relations:
  - name: "inventoryItems"
    type: "InventoryItem"
    multiplicity: "OneToMany"
  - name: "uomConversions"
    type: "UoMConversion"
    multiplicity: "OneToMany"
  - name: "replenishmentPolicies"
    type: "ReplenishmentPolicy"
    multiplicity: "OneToMany"
  - name: "lots"
    type: "Lot"
    multiplicity: "OneToMany"
  - name: "serialNumbers"
    type: "SerialNumber"
    multiplicity: "OneToMany"
- name: "Warehouse"
  description: "Physical or virtual facility where inventory is stored and processed."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "timeZone"
    type: "String"
  - name: "allowsOverAllocation"
    type: "Boolean"
  relations:
  - name: "storageLocations"
    type: "StorageLocation"
    multiplicity: "OneToMany"
  - name: "inventoryItems"
    type: "InventoryItem"
    multiplicity: "OneToMany"
  - name: "inboundShipments"
    type: "InboundShipment"
    multiplicity: "OneToMany"
  - name: "outboundAllocations"
    type: "OutboundAllocation"
    multiplicity: "OneToMany"
  - name: "originTransfers"
    type: "TransferOrder"
    multiplicity: "OneToMany"
  - name: "destinationTransfers"
    type: "TransferOrder"
    multiplicity: "OneToMany"
  - name: "cycleCounts"
    type: "CycleCount"
    multiplicity: "OneToMany"
- name: "StorageLocation"
  description: "Logical bin or area within a warehouse where stock is kept."
  data:
  - name: "code"
    type: "String"
  - name: "locationType"
    type: "LocationType"
  - name: "temperatureControlled"
    type: "Boolean"
  - name: "capacity"
    type: "Decimal"
  - name: "capacityUnit"
    type: "String"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "parentLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "childLocations"
    type: "StorageLocation"
    multiplicity: "OneToMany"
  - name: "inventoryItems"
    type: "InventoryItem"
    multiplicity: "OneToMany"
- name: "InventoryItem"
  description: "Stock record representing quantity and status for a SKU at a specific\
    \ warehouse and location."
  data:
  - name: "stockStatus"
    type: "StockStatus"
  - name: "quantityOnHand"
    type: "Decimal"
  - name: "quantityAvailable"
    type: "Decimal"
  - name: "quantityReserved"
    type: "Decimal"
  - name: "unitCost"
    type: "Money"
  - name: "lastUpdated"
    type: "Date"
  relations:
  - name: "sku"
    type: "StockKeepingUnit"
    multiplicity: "ManyToOne"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "serialNumbers"
    type: "SerialNumber"
    multiplicity: "OneToMany"
  - name: "transactions"
    type: "InventoryTransaction"
    multiplicity: "OneToMany"
  - name: "reservations"
    type: "Reservation"
    multiplicity: "OneToMany"
- name: "Lot"
  description: "Batch of units sharing production and expiration attributes for traceability."
  data:
  - name: "batchNumber"
    type: "BatchNumber"
  - name: "manufactureDate"
    type: "Date"
  - name: "expirationDate"
    type: "Date"
  - name: "lotStatus"
    type: "LotStatus"
  relations:
  - name: "sku"
    type: "StockKeepingUnit"
    multiplicity: "ManyToOne"
  - name: "inventoryItems"
    type: "InventoryItem"
    multiplicity: "OneToMany"
- name: "SerialNumber"
  description: "Unique serialized unit for item-level traceability."
  data:
  - name: "serial"
    type: "SerialCode"
  - name: "status"
    type: "SerialStatus"
  - name: "activationDate"
    type: "Date"
  relations:
  - name: "sku"
    type: "StockKeepingUnit"
    multiplicity: "ManyToOne"
  - name: "currentInventoryItem"
    type: "InventoryItem"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
- name: "Reservation"
  description: "Allocation of stock to satisfy anticipated demand."
  data:
  - name: "referenceNumber"
    type: "String"
  - name: "reservationStatus"
    type: "ReservationStatus"
  - name: "reservedQuantity"
    type: "Decimal"
  - name: "reservationType"
    type: "ReservationType"
  - name: "promisedDate"
    type: "Date"
  relations:
  - name: "sku"
    type: "StockKeepingUnit"
    multiplicity: "ManyToOne"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "inventoryItem"
    type: "InventoryItem"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "serialNumbers"
    type: "SerialNumber"
    multiplicity: "OneToMany"
  - name: "demandSignal"
    type: "DemandSignal"
    multiplicity: "ManyToOne"
- name: "DemandSignal"
  description: "Abstract representation of downstream requirement driving inventory\
    \ allocation."
  data:
  - name: "externalReference"
    type: "String"
  - name: "demandType"
    type: "DemandType"
  - name: "requestedDate"
    type: "Date"
  - name: "quantity"
    type: "Decimal"
  relations:
  - name: "sku"
    type: "StockKeepingUnit"
    multiplicity: "ManyToOne"
  - name: "reservations"
    type: "Reservation"
    multiplicity: "OneToMany"
- name: "InventoryTransaction"
  description: "Atomic movement or adjustment that changes on-hand balances."
  data:
  - name: "transactionNumber"
    type: "String"
  - name: "transactionType"
    type: "TransactionType"
  - name: "quantity"
    type: "Decimal"
  - name: "unitOfMeasure"
    type: "UnitOfMeasure"
  - name: "unitCost"
    type: "Money"
  - name: "transactionDate"
    type: "Date"
  - name: "status"
    type: "TransactionStatus"
  - name: "reasonCode"
    type: "String"
  relations:
  - name: "sku"
    type: "StockKeepingUnit"
    multiplicity: "ManyToOne"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "serialNumbers"
    type: "SerialNumber"
    multiplicity: "OneToMany"
  - name: "relatedReservation"
    type: "Reservation"
    multiplicity: "ManyToOne"
  - name: "transferOrder"
    type: "TransferOrder"
    multiplicity: "ManyToOne"
  - name: "adjustment"
    type: "StockAdjustment"
    multiplicity: "ManyToOne"
  - name: "cycleCount"
    type: "CycleCount"
    multiplicity: "ManyToOne"
- name: "TransferOrder"
  description: "Directive to move inventory between warehouses or storage locations."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "status"
    type: "TransferOrderStatus"
  - name: "requestedShipDate"
    type: "Date"
  - name: "requestedReceiveDate"
    type: "Date"
  - name: "shippedDate"
    type: "Date"
  - name: "receivedDate"
    type: "Date"
  relations:
  - name: "originWarehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "destinationWarehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "TransferOrderLine"
    multiplicity: "OneToMany"
  - name: "transactions"
    type: "InventoryTransaction"
    multiplicity: "OneToMany"
- name: "TransferOrderLine"
  description: "Line item specifying SKU and quantity to be transferred."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "quantity"
    type: "Decimal"
  - name: "unitOfMeasure"
    type: "UnitOfMeasure"
  - name: "stockStatus"
    type: "StockStatus"
  relations:
  - name: "transferOrder"
    type: "TransferOrder"
    multiplicity: "ManyToOne"
  - name: "sku"
    type: "StockKeepingUnit"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "serialNumbers"
    type: "SerialNumber"
    multiplicity: "OneToMany"
  - name: "fromLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "toLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
- name: "StockAdjustment"
  description: "Controlled process for manually correcting inventory balances."
  data:
  - name: "adjustmentNumber"
    type: "String"
  - name: "adjustmentType"
    type: "AdjustmentType"
  - name: "reason"
    type: "String"
  - name: "status"
    type: "AdjustmentStatus"
  - name: "adjustmentDate"
    type: "Date"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "StockAdjustmentLine"
    multiplicity: "OneToMany"
  - name: "transactions"
    type: "InventoryTransaction"
    multiplicity: "OneToMany"
- name: "StockAdjustmentLine"
  description: "Line-level quantity and status change within an adjustment."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "quantity"
    type: "Decimal"
  - name: "unitOfMeasure"
    type: "UnitOfMeasure"
  - name: "stockStatus"
    type: "StockStatus"
  relations:
  - name: "adjustment"
    type: "StockAdjustment"
    multiplicity: "ManyToOne"
  - name: "sku"
    type: "StockKeepingUnit"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "serialNumbers"
    type: "SerialNumber"
    multiplicity: "OneToMany"
- name: "CycleCount"
  description: "Event to verify physical stock and reconcile variances."
  data:
  - name: "countNumber"
    type: "String"
  - name: "status"
    type: "CountStatus"
  - name: "scheduledDate"
    type: "Date"
  - name: "performedDate"
    type: "Date"
  - name: "approvedBy"
    type: "String"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "locations"
    type: "StorageLocation"
    multiplicity: "OneToMany"
  - name: "entries"
    type: "CycleCountEntry"
    multiplicity: "OneToMany"
  - name: "transactions"
    type: "InventoryTransaction"
    multiplicity: "OneToMany"
- name: "CycleCountEntry"
  description: "Counted result for a SKU in a specific location during a cycle count."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "systemQuantity"
    type: "Decimal"
  - name: "countedQuantity"
    type: "Decimal"
  - name: "varianceQuantity"
    type: "Decimal"
  - name: "stockStatus"
    type: "StockStatus"
  - name: "recountRequired"
    type: "Boolean"
  relations:
  - name: "cycleCount"
    type: "CycleCount"
    multiplicity: "ManyToOne"
  - name: "sku"
    type: "StockKeepingUnit"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "serialNumbers"
    type: "SerialNumber"
    multiplicity: "OneToMany"
- name: "ReplenishmentPolicy"
  description: "Target levels and ordering rules for maintaining stock availability."
  data:
  - name: "policyType"
    type: "ReplenishmentPolicyType"
  - name: "minLevel"
    type: "Decimal"
  - name: "maxLevel"
    type: "Decimal"
  - name: "reorderPoint"
    type: "Decimal"
  - name: "reorderQuantity"
    type: "Decimal"
  - name: "leadTimeDays"
    type: "Integer"
  - name: "reviewPeriodDays"
    type: "Integer"
  relations:
  - name: "sku"
    type: "StockKeepingUnit"
    multiplicity: "ManyToOne"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
- name: "UoMConversion"
  description: "Conversion mapping between two units of measure for a SKU."
  data:
  - name: "fromUnit"
    type: "UnitOfMeasure"
  - name: "toUnit"
    type: "UnitOfMeasure"
  - name: "factor"
    type: "Decimal"
  - name: "precision"
    type: "Integer"
  relations:
  - name: "sku"
    type: "StockKeepingUnit"
    multiplicity: "ManyToOne"
- name: "InventoryThresholdAlert"
  description: "Alert generated when stock crosses predefined thresholds or risk conditions."
  data:
  - name: "alertNumber"
    type: "String"
  - name: "alertType"
    type: "InventoryAlertType"
  - name: "status"
    type: "AlertStatus"
  - name: "detectedAt"
    type: "Date"
  - name: "message"
    type: "String"
  relations:
  - name: "sku"
    type: "StockKeepingUnit"
    multiplicity: "ManyToOne"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "location"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
  - name: "relatedPolicy"
    type: "ReplenishmentPolicy"
    multiplicity: "ManyToOne"
- name: "Quarantine"
  description: "Temporary hold and disposition tracking for stock pending inspection\
    \ or review."
  data:
  - name: "reason"
    type: "String"
  - name: "startedAt"
    type: "Date"
  - name: "releasedAt"
    type: "Date"
  - name: "disposition"
    type: "Disposition"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "InventoryItem"
    multiplicity: "OneToMany"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "serialNumbers"
    type: "SerialNumber"
    multiplicity: "OneToMany"
- name: "ExpirationPolicy"
  description: "Rules governing rotation and handling of perishable inventory."
  data:
  - name: "rotationMethod"
    type: "RotationMethod"
  - name: "rejectIfDaysToExpireLessThan"
    type: "Integer"
  - name: "autoQuarantineDaysToExpire"
    type: "Integer"
  relations:
  - name: "sku"
    type: "StockKeepingUnit"
    multiplicity: "ManyToOne"
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
- name: "InboundShipment"
  description: "Expected receipt of goods intended for putaway into inventory."
  data:
  - name: "shipmentNumber"
    type: "String"
  - name: "status"
    type: "InboundShipmentStatus"
  - name: "expectedArrivalDate"
    type: "Date"
  - name: "arrivalDate"
    type: "Date"
  - name: "carrierName"
    type: "String"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "lines"
    type: "InboundShipmentLine"
    multiplicity: "OneToMany"
  - name: "transactions"
    type: "InventoryTransaction"
    multiplicity: "OneToMany"
- name: "InboundShipmentLine"
  description: "SKU-level details for an inbound shipment."
  data:
  - name: "lineNumber"
    type: "Integer"
  - name: "quantity"
    type: "Decimal"
  - name: "unitOfMeasure"
    type: "UnitOfMeasure"
  - name: "stockStatus"
    type: "StockStatus"
  relations:
  - name: "inboundShipment"
    type: "InboundShipment"
    multiplicity: "ManyToOne"
  - name: "sku"
    type: "StockKeepingUnit"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "serialNumbers"
    type: "SerialNumber"
    multiplicity: "OneToMany"
  - name: "destinationLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
- name: "OutboundAllocation"
  description: "Assignment of available stock to fulfill outbound demand."
  data:
  - name: "allocationNumber"
    type: "String"
  - name: "status"
    type: "AllocationStatus"
  - name: "allocatedQuantity"
    type: "Decimal"
  - name: "allocationDate"
    type: "Date"
  relations:
  - name: "warehouse"
    type: "Warehouse"
    multiplicity: "ManyToOne"
  - name: "sku"
    type: "StockKeepingUnit"
    multiplicity: "ManyToOne"
  - name: "inventoryItem"
    type: "InventoryItem"
    multiplicity: "ManyToOne"
  - name: "reservation"
    type: "Reservation"
    multiplicity: "ManyToOne"
  - name: "lot"
    type: "Lot"
    multiplicity: "ManyToOne"
  - name: "serialNumbers"
    type: "SerialNumber"
    multiplicity: "OneToMany"
  - name: "sourceLocation"
    type: "StorageLocation"
    multiplicity: "ManyToOne"
enums:
- name: "ItemType"
  description: "Classification of inventory-managed items by their role in operations."
  data:
  - name: "FinishedGood"
  - name: "Component"
  - name: "RawMaterial"
  - name: "Packaging"
  - name: "SparePart"
  - name: "Consumable"
- name: "UnitOfMeasure"
  description: "Standard units used to quantify inventory and movements."
  data:
  - name: "Each"
  - name: "Case"
  - name: "Pallet"
  - name: "Dozen"
  - name: "Gram"
  - name: "Kilogram"
  - name: "Pound"
  - name: "Ounce"
  - name: "Milliliter"
  - name: "Liter"
  - name: "CubicMeter"
  - name: "Meter"
  - name: "Foot"
  - name: "SquareMeter"
- name: "StockStatus"
  description: "Availability and condition state of inventory stock."
  data:
  - name: "Available"
  - name: "Reserved"
  - name: "Damaged"
  - name: "Hold"
  - name: "Quarantined"
  - name: "InTransit"
  - name: "PendingInspection"
- name: "LocationType"
  description: "Functional category of a storage location within a warehouse."
  data:
  - name: "Bin"
  - name: "Bulk"
  - name: "Staging"
  - name: "Dock"
  - name: "Picking"
  - name: "Packing"
  - name: "Quality"
  - name: "Return"
  - name: "ColdStorage"
- name: "LotStatus"
  description: "Lifecycle state of a product lot."
  data:
  - name: "Released"
  - name: "Quarantined"
  - name: "Expired"
  - name: "Blocked"
  - name: "PendingTest"
- name: "SerialStatus"
  description: "Tracking state of a serialized unit."
  data:
  - name: "Active"
  - name: "Assigned"
  - name: "InTransit"
  - name: "Consumed"
  - name: "Returned"
  - name: "Scrapped"
- name: "ReservationStatus"
  description: "Progress state of an inventory reservation."
  data:
  - name: "Draft"
  - name: "Confirmed"
  - name: "Released"
  - name: "Fulfilled"
  - name: "Cancelled"
  - name: "Expired"
- name: "ReservationType"
  description: "Context driving the reservation of inventory."
  data:
  - name: "SalesOrder"
  - name: "WorkOrder"
  - name: "TransferOrder"
  - name: "ServiceOrder"
  - name: "Other"
- name: "DemandType"
  description: "Source classification of demand signals affecting inventory."
  data:
  - name: "SalesOrder"
  - name: "WorkOrder"
  - name: "TransferOrder"
  - name: "Forecast"
  - name: "SampleRequest"
- name: "TransactionType"
  description: "Nature of inventory movement or quantity change."
  data:
  - name: "Receipt"
  - name: "Issue"
  - name: "AdjustmentIncrease"
  - name: "AdjustmentDecrease"
  - name: "Reclassification"
  - name: "TransferOut"
  - name: "TransferIn"
  - name: "CountIncrease"
  - name: "CountDecrease"
  - name: "Putaway"
  - name: "Pick"
- name: "TransactionStatus"
  description: "Posting state of an inventory transaction."
  data:
  - name: "Pending"
  - name: "Posted"
  - name: "Voided"
- name: "TransferOrderStatus"
  description: "Lifecycle state of an inventory transfer order."
  data:
  - name: "Draft"
  - name: "Released"
  - name: "InTransit"
  - name: "Received"
  - name: "Closed"
  - name: "Cancelled"
- name: "AdjustmentType"
  description: "Classification of manual inventory corrections."
  data:
  - name: "Increase"
  - name: "Decrease"
  - name: "Reclassification"
- name: "AdjustmentStatus"
  description: "Approval and posting state of a stock adjustment."
  data:
  - name: "Draft"
  - name: "Approved"
  - name: "Posted"
  - name: "Cancelled"
- name: "CountStatus"
  description: "Execution state for a cycle count event."
  data:
  - name: "Planned"
  - name: "InProgress"
  - name: "Completed"
  - name: "Posted"
  - name: "Cancelled"
- name: "ReplenishmentPolicyType"
  description: "Approach used to determine reorder timing and quantities."
  data:
  - name: "MinMax"
  - name: "ReorderPoint"
  - name: "EOQ"
  - name: "Kanban"
- name: "InventoryAlertType"
  description: "Type of threshold or risk condition detected by inventory monitoring."
  data:
  - name: "BelowMin"
  - name: "AboveMax"
  - name: "StockoutRisk"
  - name: "ExcessStock"
  - name: "ExpiryRisk"
- name: "AlertStatus"
  description: "Handling state of an inventory alert."
  data:
  - name: "New"
  - name: "Acknowledged"
  - name: "Resolved"
  - name: "Dismissed"
- name: "Disposition"
  description: "Resolution action applied to quarantined inventory."
  data:
  - name: "Release"
  - name: "Scrap"
  - name: "ReturnToVendor"
  - name: "Rework"
- name: "RotationMethod"
  description: "Strategy for selecting inventory for issue based on age or expiry."
  data:
  - name: "FIFO"
  - name: "LIFO"
  - name: "FEFO"
- name: "InboundShipmentStatus"
  description: "Processing state of an inbound shipment destined for inventory."
  data:
  - name: "Planned"
  - name: "Arrived"
  - name: "Received"
  - name: "Closed"
