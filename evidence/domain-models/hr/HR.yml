metadata:
  name: "Human Resources Industry Domain Model"
  version: "1.0.0"
  industry: "Human Resources"
  category: "Human Resources"
  description: "HCIDL model capturing core HR capabilities across organization design,\
    \ workforce, compensation, benefits, time, payroll, performance, learning, and\
    \ talent acquisition."
  type: "Industry"
  domain: "HR"
enums:
