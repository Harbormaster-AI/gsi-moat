  - name: "invoiceNumber"
    type: "String"
  - name: "issueDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "total"
    type: "Money"
  - name: "status"
    type: "InvoiceStatus"
  - name: "currency"
    type: "String"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "payments"
    type: "PaymentOrder"
    multiplicity: "OneToMany"
- name: "AccountStatement"
