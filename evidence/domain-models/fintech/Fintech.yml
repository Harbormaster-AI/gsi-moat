---
metadata:
  name: "FinTech Industry Domain Model"
  description: "HCIDL model capturing core digital banking, payments, wallets, lending,\
    \ investments, FX, compliance, and risk management capabilities."
  version: "1.0.0"
  industry: "FinTech"
  category: "Financial"
  language: "English"
  type: "Industry"
  domain: "Fintech"
entities:
- name: "FinancialInstitution"
  description: "Regulated organization that offers financial products and services\
    \ to customers."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "countryOfIncorporation"
    type: "String"
  - name: "bic"
    type: "BIC"
  - name: "website"
    type: "String"
  relations:
  - name: "branches"
    type: "Branch"
    multiplicity: "OneToMany"
  - name: "customers"
    type: "Customer"
    multiplicity: "OneToMany"
  - name: "productOfferings"
    type: "ProductOffering"
    multiplicity: "OneToMany"
  - name: "paymentProcessors"
    type: "PaymentProcessor"
    multiplicity: "ManyToMany"
  - name: "compliancePolicies"
    type: "CompliancePolicy"
    multiplicity: "OneToMany"
- name: "Branch"
  description: "Physical or virtual location through which a financial institution\
    \ serves customers."
  data:
  - name: "name"
    type: "String"
  - name: "branchCode"
    type: "String"
  - name: "address"
    type: "Address"
  relations:
  - name: "institution"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
- name: "ProductOffering"
  description: "Marketed financial product with defined features and eligibility."
  data:
  - name: "name"
    type: "String"
  - name: "productCode"
    type: "String"
  - name: "category"
    type: "ProductCategory"
  relations:
  - name: "institution"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "pricingPlans"
    type: "PricingPlan"
    multiplicity: "OneToMany"
- name: "PricingPlan"
  description: "Configurable plan of fees, limits, and rates for a product offering."
  data:
  - name: "name"
    type: "String"
  - name: "planCode"
    type: "String"
  - name: "status"
    type: "PlanStatus"
  - name: "baseCurrency"
    type: "String"
  relations:
  - name: "productOffering"
    type: "ProductOffering"
    multiplicity: "ManyToOne"
  - name: "feeSchedules"
    type: "FeeSchedule"
    multiplicity: "OneToMany"
  - name: "limits"
    type: "UsageLimit"
    multiplicity: "OneToMany"
- name: "FeeSchedule"
  description: "Definition of how fees are calculated and applied."
  data:
  - name: "name"
    type: "String"
  - name: "feeType"
    type: "FeeType"
  - name: "calculationMethod"
    type: "FeeCalculationMethod"
  - name: "amount"
    type: "Money"
  - name: "percentage"
    type: "Decimal"
  - name: "minimum"
    type: "Money"
  - name: "maximum"
    type: "Money"
  relations:
  - name: "pricingPlan"
    type: "PricingPlan"
    multiplicity: "ManyToOne"
- name: "UsageLimit"
  description: "Monetary or count-based usage restriction over a defined period."
  data:
  - name: "name"
    type: "String"
  - name: "scope"
    type: "LimitScope"
  - name: "period"
    type: "LimitPeriod"
  - name: "amount"
    type: "Money"
  - name: "count"
    type: "Integer"
  relations:
  - name: "pricingPlan"
    type: "PricingPlan"
    multiplicity: "ManyToOne"
- name: "Customer"
  description: "Individual or business that holds accounts or uses services."
  data:
  - name: "customerId"
    type: "String"
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "customerType"
    type: "CustomerType"
  - name: "dateOfBirth"
    type: "Date"
  - name: "email"
    type: "Email"
  - name: "phone"
    type: "PhoneNumber"
  - name: "address"
    type: "Address"
  - name: "taxId"
    type: "TaxId"
  - name: "riskScore"
    type: "RiskScore"
  relations:
  - name: "institution"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "accounts"
    type: "Account"
    multiplicity: "OneToMany"
  - name: "wallets"
    type: "Wallet"
    multiplicity: "OneToMany"
  - name: "cards"
    type: "PaymentCard"
    multiplicity: "OneToMany"
  - name: "kycProfiles"
    type: "KYCProfile"
    multiplicity: "OneToMany"
  - name: "consents"
    type: "Consent"
    multiplicity: "OneToMany"
  - name: "agreements"
    type: "Agreement"
    multiplicity: "OneToMany"
  - name: "loanApplications"
    type: "LoanApplication"
    multiplicity: "OneToMany"
  - name: "loans"
    type: "Loan"
    multiplicity: "OneToMany"
  - name: "portfolios"
    type: "InvestmentPortfolio"
    multiplicity: "OneToMany"
  - name: "disputes"
    type: "Dispute"
    multiplicity: "OneToMany"
- name: "KYCProfile"
  description: "Know Your Customer verification lifecycle and outcomes."
  data:
  - name: "profileId"
    type: "String"
  - name: "status"
    type: "KYCStatus"
  - name: "verificationLevel"
    type: "VerificationLevel"
  - name: "createdAt"
    type: "DateTime"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "documents"
    type: "KYCDocument"
    multiplicity: "OneToMany"
  - name: "screenings"
    type: "Screening"
    multiplicity: "OneToMany"
  - name: "addresses"
    type: "VerifiedAddress"
    multiplicity: "OneToMany"
- name: "KYCDocument"
  description: "Identity or registration document submitted for verification."
  data:
  - name: "documentType"
    type: "KYCDocumentType"
  - name: "reference"
    type: "DocumentReference"
  - name: "issuedCountry"
    type: "String"
  - name: "expirationDate"
    type: "Date"
  - name: "status"
    type: "DocumentStatus"
  relations:
  - name: "kycProfile"
    type: "KYCProfile"
    multiplicity: "ManyToOne"
- name: "Screening"
  description: "AML, sanctions, or PEP screening event and decision."
  data:
  - name: "screeningType"
    type: "ScreeningType"
  - name: "status"
    type: "ScreeningStatus"
  - name: "score"
    type: "RiskScore"
  - name: "screenedAt"
    type: "DateTime"
  relations:
  - name: "kycProfile"
    type: "KYCProfile"
    multiplicity: "ManyToOne"
  - name: "alerts"
    type: "ComplianceAlert"
    multiplicity: "OneToMany"
- name: "VerifiedAddress"
  description: "Address verified via KYC checks."
  data:
  - name: "address"
    type: "Address"
  - name: "verificationStatus"
    type: "VerificationStatus"
  - name: "verifiedAt"
    type: "DateTime"
  relations:
  - name: "kycProfile"
    type: "KYCProfile"
    multiplicity: "ManyToOne"
- name: "CompliancePolicy"
  description: "Internal policy defining compliance rules and thresholds."
  data:
  - name: "name"
    type: "String"
  - name: "policyCode"
    type: "String"
  - name: "status"
    type: "PolicyStatus"
  - name: "description"
    type: "String"
  relations:
  - name: "institution"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
- name: "ComplianceAlert"
  description: "Alert indicating potential AML, sanctions, or fraud risk."
  data:
  - name: "alertCode"
    type: "String"
  - name: "severity"
    type: "AlertSeverity"
  - name: "status"
    type: "AlertStatus"
  - name: "raisedAt"
    type: "DateTime"
  - name: "notes"
    type: "String"
  relations:
  - name: "screening"
    type: "Screening"
    multiplicity: "ManyToOne"
  - name: "transaction"
    type: "Transaction"
    multiplicity: "ManyToOne"
- name: "Consent"
  description: "Authorization granted by a customer for data access or payment initiation."
  data:
  - name: "consentType"
    type: "ConsentType"
  - name: "grantedAt"
    type: "DateTime"
  - name: "expiresAt"
    type: "DateTime"
  - name: "status"
    type: "ConsentStatus"
  - name: "scope"
    type: "String"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "apiClient"
    type: "APIClient"
    multiplicity: "ManyToOne"
- name: "APIClient"
  description: "Registered third-party application acting on behalf of users."
  data:
  - name: "name"
    type: "String"
  - name: "clientId"
    type: "String"
  - name: "clientType"
    type: "ClientType"
  - name: "redirectUri"
    type: "String"
  relations:
  - name: "consents"
    type: "Consent"
    multiplicity: "OneToMany"
- name: "Agreement"
  description: "Contractual agreement defining terms between customer and institution."
  data:
  - name: "agreementNumber"
    type: "String"
  - name: "agreementType"
    type: "AgreementType"
  - name: "effectiveDate"
    type: "Date"
  - name: "status"
    type: "AgreementStatus"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "productOffering"
    type: "ProductOffering"
    multiplicity: "ManyToOne"
- name: "Account"
  description: "Deposit or custody account holding monetary balances."
  data:
  - name: "accountNumber"
    type: "AccountNumber"
  - name: "iban"
    type: "IBAN"
  - name: "bic"
    type: "BIC"
  - name: "accountType"
    type: "AccountType"
  - name: "status"
    type: "AccountStatus"
  - name: "openedDate"
    type: "Date"
  - name: "currency"
    type: "String"
  - name: "balance"
    type: "Money"
  - name: "availableBalance"
    type: "Money"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "institution"
    type: "FinancialInstitution"
    multiplicity: "ManyToOne"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
  - name: "cards"
    type: "PaymentCard"
    multiplicity: "OneToMany"
  - name: "statements"
    type: "AccountStatement"
    multiplicity: "OneToMany"
  - name: "mandates"
    type: "DirectDebitMandate"
    multiplicity: "OneToMany"
- name: "Wallet"
  description: "Digital stored-value container enabling payments and transfers."
  data:
  - name: "walletId"
    type: "String"
  - name: "status"
    type: "WalletStatus"
  - name: "currency"
    type: "String"
  - name: "balance"
    type: "Money"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
- name: "PaymentCard"
  description: "Payment card issued to a customer for purchases and cash access."
  data:
  - name: "cardToken"
    type: "CardNumberToken"
  - name: "scheme"
    type: "CardScheme"
  - name: "status"
    type: "CardStatus"
  - name: "maskedPan"
    type: "String"
  - name: "expiryMonth"
    type: "Integer"
  - name: "expiryYear"
    type: "Integer"
  - name: "cardholderName"
    type: "String"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "tokenizations"
    type: "CardTokenization"
    multiplicity: "OneToMany"
  - name: "disputes"
    type: "Dispute"
    multiplicity: "OneToMany"
- name: "CardTokenization"
  description: "Provisioning record that maps a card to a network token."
  data:
  - name: "tokenReference"
    type: "String"
  - name: "walletProvider"
    type: "WalletProvider"
  - name: "status"
    type: "TokenizationStatus"
  - name: "createdAt"
    type: "DateTime"
  relations:
  - name: "card"
    type: "PaymentCard"
    multiplicity: "ManyToOne"
- name: "Merchant"
  description: "Business entity that accepts electronic payments."
  data:
  - name: "name"
    type: "String"
  - name: "merchantId"
    type: "String"
  - name: "mcc"
    type: "String"
  - name: "url"
    type: "String"
  - name: "country"
    type: "String"
  - name: "settlementCurrency"
    type: "String"
  relations:
  - name: "terminals"
    type: "Terminal"
    multiplicity: "OneToMany"
  - name: "paymentContracts"
    type: "PaymentContract"
    multiplicity: "OneToMany"
  - name: "payouts"
    type: "Payout"
    multiplicity: "OneToMany"
  - name: "settlements"
    type: "SettlementBatch"
    multiplicity: "OneToMany"
  - name: "disputes"
    type: "Dispute"
    multiplicity: "OneToMany"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
- name: "Terminal"
  description: "Physical or virtual acceptance device for card-present or e-commerce\
    \ transactions."
  data:
  - name: "terminalId"
    type: "String"
  - name: "type"
    type: "TerminalType"
  - name: "status"
    type: "TerminalStatus"
  - name: "location"
    type: "Address"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
- name: "PaymentContract"
  description: "Agreement enabling a merchant to process payments with defined terms."
  data:
  - name: "contractNumber"
    type: "String"
  - name: "status"
    type: "ContractStatus"
  - name: "pricingPlanCode"
    type: "String"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "acquirer"
    type: "PaymentProcessor"
    multiplicity: "ManyToOne"
- name: "PaymentProcessor"
  description: "Acquirer or processor routing and settling payment transactions."
  data:
  - name: "name"
    type: "String"
  - name: "processorCode"
    type: "String"
  - name: "networkSupport"
    type: "String"
  relations:
  - name: "institutions"
    type: "FinancialInstitution"
    multiplicity: "ManyToMany"
  - name: "contracts"
    type: "PaymentContract"
    multiplicity: "OneToMany"
  - name: "settlements"
    type: "SettlementBatch"
    multiplicity: "OneToMany"
- name: "Transaction"
  description: "Ledger entry representing a monetary movement and its lifecycle."
  data:
  - name: "transactionId"
    type: "TransactionId"
  - name: "transactionType"
    type: "TransactionType"
  - name: "status"
    type: "TransactionStatus"
  - name: "amount"
    type: "Money"
  - name: "fee"
    type: "Money"
  - name: "exchangeRate"
    type: "Decimal"
  - name: "createdAt"
    type: "DateTime"
  - name: "completedAt"
    type: "DateTime"
  - name: "narrative"
    type: "String"
  relations:
  - name: "account"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "wallet"
    type: "Wallet"
    multiplicity: "ManyToOne"
  - name: "paymentOrder"
    type: "PaymentOrder"
    multiplicity: "ManyToOne"
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "card"
    type: "PaymentCard"
    multiplicity: "ManyToOne"
  - name: "relatedTransactions"
    type: "Transaction"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "ComplianceAlert"
    multiplicity: "OneToMany"
- name: "PaymentOrder"
  description: "Instruction to move funds between parties through a selected method."
  data:
  - name: "orderReference"
    type: "String"
  - name: "paymentMethod"
    type: "PaymentMethod"
  - name: "status"
    type: "PaymentOrderStatus"
  - name: "requestedExecutionDate"
    type: "Date"
  - name: "priority"
    type: "PaymentPriority"
  - name: "purpose"
    type: "String"
  relations:
  - name: "sourceAccount"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "destinationAccount"
    type: "Account"
    multiplicity: "ManyToOne"
  - name: "beneficiary"
    type: "Beneficiary"
    multiplicity: "ManyToOne"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
  - name: "fxDeal"
    type: "FXDeal"
    multiplicity: "ManyToOne"
  - name: "fees"
    type: "AppliedFee"
    multiplicity: "OneToMany"
- name: "Beneficiary"
  description: "Designated recipient of funds for transfers and payouts."
  data:
  - name: "name"
    type: "String"
  - name: "accountIdentifier"
    type: "AccountIdentifier"
  - name: "iban"
    type: "IBAN"
  - name: "bic"
    type: "BIC"
  - name: "address"
    type: "Address"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
- name: "AppliedFee"
  description: "Fee applied to a payment instruction or transaction."
