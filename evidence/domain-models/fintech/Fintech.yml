  - name: "feeType"
    type: "FeeType"
  - name: "amount"
    type: "Money"
  - name: "description"
    type: "String"
  relations:
  - name: "paymentOrder"
    type: "PaymentOrder"
    multiplicity: "ManyToOne"
  - name: "transaction"
    type: "Transaction"
    multiplicity: "ManyToOne"
- name: "FXQuote"
  description: "Indicative or firm price for converting between currency pairs."
  data:
  - name: "baseCurrency"
    type: "String"
  - name: "quoteCurrency"
    type: "String"
  - name: "rate"
    type: "Decimal"
  - name: "quotedAt"
    type: "DateTime"
  - name: "expiresAt"
    type: "DateTime"
  - name: "priceType"
    type: "FXPriceType"
  relations:
  - name: "requestedBy"
    type: "Customer"
    multiplicity: "ManyToOne"
- name: "FXDeal"
  description: "Executed foreign exchange agreement for settlement."
  data:
  - name: "dealReference"
    type: "String"
  - name: "baseCurrency"
    type: "String"
  - name: "quoteCurrency"
    type: "String"
  - name: "rate"
    type: "Decimal"
  - name: "amount"
    type: "Money"
  - name: "settlementDate"
    type: "Date"
  - name: "status"
    type: "FXDealStatus"
  relations:
  - name: "quote"
    type: "FXQuote"
    multiplicity: "ManyToOne"
  - name: "paymentOrders"
    type: "PaymentOrder"
    multiplicity: "OneToMany"
- name: "SettlementBatch"
  description: "Aggregation of transactions for clearing and settlement."
  data:
  - name: "batchId"
    type: "String"
  - name: "status"
    type: "SettlementStatus"
  - name: "periodStart"
    type: "DateTime"
  - name: "periodEnd"
    type: "DateTime"
  - name: "totalVolume"
    type: "Money"
  - name: "totalCount"
    type: "Integer"
  relations:
  - name: "processor"
    type: "PaymentProcessor"
    multiplicity: "ManyToOne"
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "payouts"
    type: "Payout"
    multiplicity: "OneToMany"
  - name: "transactions"
    type: "Transaction"
    multiplicity: "OneToMany"
- name: "Payout"
  description: "Transfer of settled funds from processor to merchant."
  data:
  - name: "payoutReference"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "currency"
    type: "String"
  - name: "status"
    type: "PayoutStatus"
  - name: "scheduledDate"
    type: "Date"
  - name: "paidDate"
    type: "Date"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "settlementBatch"
    type: "SettlementBatch"
    multiplicity: "ManyToOne"
  - name: "destinationAccount"
    type: "Account"
    multiplicity: "ManyToOne"
- name: "Dispute"
  description: "Case raised to challenge a transaction outcome."
  data:
  - name: "disputeReference"
    type: "String"
  - name: "reason"
    type: "DisputeReason"
  - name: "status"
    type: "DisputeStatus"
  - name: "openedAt"
    type: "DateTime"
  - name: "closedAt"
    type: "DateTime"
  relations:
  - name: "transaction"
    type: "Transaction"
    multiplicity: "ManyToOne"
  - name: "card"
    type: "PaymentCard"
    multiplicity: "ManyToOne"
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "chargebacks"
    type: "Chargeback"
    multiplicity: "OneToMany"
- name: "Chargeback"
