  data:
  - name: "name"
    type: "String"
  - name: "creditorId"
    type: "String"
  - name: "bic"
    type: "BIC"
  - name: "address"
    type: "Address"
  relations:
  - name: "mandates"
    type: "DirectDebitMandate"
    multiplicity: "OneToMany"
