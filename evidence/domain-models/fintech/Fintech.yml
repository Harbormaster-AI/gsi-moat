  - name: "chargebackReference"
    type: "String"
  - name: "stage"
    type: "ChargebackStage"
  - name: "amount"
    type: "Money"
  - name: "status"
    type: "ChargebackStatus"
  - name: "postedAt"
    type: "DateTime"
  relations:
  - name: "dispute"
    type: "Dispute"
    multiplicity: "ManyToOne"
  - name: "transaction"
    type: "Transaction"
    multiplicity: "ManyToOne"
