metadata:
  name: "Advertising Industry Domain Model"
  description: "HCIDL model for advertising planning, buying, trafficking, delivery,\
    \ and measurement."
  version: "1.0.0"
  industry: "Advertising"
  category: "Sales & CRM"
  language: "en-US"
  type: "Industry"
  domain: "Advertising"
enums:
- name: "CampaignStatus"
  description: "Lifecycle status of a campaign."
  data:
  - name: "Draft"
  - name: "Active"
  - name: "Paused"
  - name: "Completed"
  - name: "Cancelled"
- name: "LineItemStatus"
  description: "Execution status of a line item."
  data:
  - name: "Draft"
  - name: "Scheduled"
  - name: "Running"
  - name: "Paused"
  - name: "Completed"
  - name: "Cancelled"
- name: "ObjectiveType"
  description: "Primary marketing goal of a campaign."
  data:
  - name: "Awareness"
  - name: "Reach"
  - name: "Traffic"
  - name: "Engagement"
  - name: "Leads"
  - name: "Sales"
  - name: "AppInstalls"
  - name: "VideoViews"
- name: "PricingModel"
  description: "Method by which media is bought and billed."
  data:
