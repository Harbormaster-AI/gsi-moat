metadata:
  name: "Insurance Industry Domain Model"
  description: "HCIDL model capturing core insurance product, underwriting, policy,\
    \ billing, claims, and reinsurance capabilities."
  version: "1.0.0"
  industry: "Insurance"
  category: "Insurance"
  language: "en-US"
  type: "Industry"
  domain: "Insurance"
enums:
- name: "LineOfBusiness"
  description: "Classification of insurance business lines under which products and\
    \ policies are written."
  data:
  - name: "PersonalAuto"
  - name: "Homeowners"
  - name: "Renters"
  - name: "TermLife"
  - name: "WholeLife"
  - name: "CommercialProperty"
  - name: "GeneralLiability"
  - name: "WorkersCompensation"
- name: "CoverageType"
  description: "Types of insurance coverages offered across lines of business."
  data:
  - name: "Liability"
  - name: "Collision"
  - name: "Comprehensive"
  - name: "PropertyDamage"
  - name: "BodilyInjury"
  - name: "UninsuredMotorist"
  - name: "MedicalPayments"
  - name: "Dwelling"
  - name: "Contents"
  - name: "PersonalLiability"
  - name: "BusinessInterruption"
  - name: "ProfessionalLiability"
- name: "DistributionChannelType"
  description: "Mechanisms through which insurance products are marketed and sold."
  data:
  - name: "Agency"
  - name: "Broker"
  - name: "Direct"
  - name: "Bancassurance"
  - name: "AffinityPartner"
  - name: "OnlineAggregator"
- name: "ProducerStatus"
  description: "Licensing and appointment standing of a producer."
  data:
  - name: "Active"
  - name: "Suspended"
  - name: "Terminated"
- name: "CustomerType"
  description: "Distinguishes whether the customer is a person or an organization."
  data:
  - name: "Individual"
  - name: "Organization"
- name: "ApplicationStatus"
  description: "Lifecycle state of an insurance application."
  data:
  - name: "Draft"
  - name: "Submitted"
  - name: "UnderReview"
  - name: "Quoted"
  - name: "Declined"
  - name: "Withdrawn"
  - name: "Bound"
- name: "UnderwritingDecisionType"
  description: "Outcome of the underwriting process determining insurability and terms."
  data:
  - name: "Approve"
  - name: "ConditionalApprove"
  - name: "Refer"
  - name: "Decline"
- name: "PolicyStatus"
  description: "Administrative state of a policy during its lifecycle."
  data:
  - name: "Quoted"
  - name: "Active"
  - name: "Lapsed"
  - name: "Cancelled"
  - name: "Expired"
  - name: "PendingCancel"
  - name: "PendingReinstatement"
- name: "PaymentPlanType"
  description: "Schedule by which premium is billed and collected."
  data:
  - name: "Annual"
  - name: "SemiAnnual"
  - name: "Quarterly"
  - name: "Monthly"
  - name: "PayInFull"
- name: "BillingStatus"
  description: "Standing of a billing account relative to required payments."
  data:
  - name: "Current"
  - name: "Delinquent"
  - name: "Collections"
  - name: "Closed"
- name: "InvoiceStatus"
  description: "Payment state of an issued invoice."
  data:
  - name: "Open"
  - name: "Paid"
  - name: "PartiallyPaid"
  - name: "Void"
- name: "PaymentMethod"
  description: "Means by which a financial transaction is executed."
  data:
  - name: "ACH"
  - name: "CreditCard"
  - name: "DebitCard"
  - name: "Check"
  - name: "Cash"
  - name: "Wire"
- name: "PaymentStatus"
  description: "Settlement status of a financial transaction."
  data:
  - name: "Pending"
  - name: "Settled"
  - name: "Failed"
  - name: "Refunded"
  - name: "Reversed"
- name: "InsuredObjectType"
  description: "Category of risk item covered by a policy."
  data:
  - name: "Vehicle"
  - name: "Property"
  - name: "Person"
  - name: "Equipment"
  - name: "LiabilityExposure"
- name: "RelationshipType"
  description: "Relationship between a beneficiary and the insured."
  data:
  - name: "Spouse"
  - name: "Child"
  - name: "Parent"
  - name: "Sibling"
  - name: "BusinessPartner"
  - name: "Estate"
  - name: "Trust"
  - name: "Other"
- name: "ClaimStatus"
  description: "Processing state of a claim file."
  data:
  - name: "Open"
  - name: "Closed"
  - name: "Reopened"
  - name: "Denied"
  - name: "PendingInvestigation"
  - name: "Litigation"
- name: "PerilType"
  description: "Type of event or hazard that can cause a loss."
  data:
  - name: "AutoAccident"
  - name: "Fire"
  - name: "Theft"
  - name: "Windstorm"
  - name: "Flood"
  - name: "Hail"
  - name: "Earthquake"
  - name: "Vandalism"
  - name: "Injury"
  - name: "Death"
- name: "CauseOfLoss"
  description: "Specific cause that led to the reported damage or injury."
  data:
  - name: "Collision"
  - name: "Weather"
  - name: "MechanicalFailure"
  - name: "HumanError"
  - name: "NaturalDisaster"
  - name: "Theft"
  - name: "Vandalism"
  - name: "LiabilityClaim"
  - name: "Illness"
- name: "ExposureType"
  description: "Unit of coverage within a claim used for adjustment and payment."
  data:
  - name: "BodilyInjury"
  - name: "PropertyDamage"
  - name: "Medical"
  - name: "UninsuredMotorist"
  - name: "PersonalInjuryProtection"
  - name: "DwellingDamage"
  - name: "ContentsDamage"
  - name: "BusinessIncome"
- name: "ExposureStatus"
  description: "Processing state of a claim exposure."
  data:
