  - name: "encounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "MedicalDevice"
    multiplicity: "ManyToOne"
  - name: "labResult"
    type: "LabResult"
    multiplicity: "ManyToOne"
