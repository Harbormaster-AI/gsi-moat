  - name: "name"
    type: "String"
  - name: "cliaNumber"
    type: "String"
  relations:
  - name: "facility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "laboratoryOrders"
    type: "LaboratoryOrder"
    multiplicity: "OneToMany"
  - name: "labResults"
    type: "LabResult"
    multiplicity: "OneToMany"
- name: "LaboratoryOrder"
  description: "Order to perform one or more laboratory tests."
  data:
  - name: "testCode"
    type: "String"
  - name: "specimenType"
    type: "SpecimenType"
  - name: "fastingRequired"
    type: "Boolean"
  relations:
  - name: "order"
    type: "ClinicalOrder"
    multiplicity: "ManyToOne"
  - name: "laboratory"
    type: "Laboratory"
    multiplicity: "ManyToOne"
  - name: "results"
    type: "LabResult"
    multiplicity: "OneToMany"
- name: "LabResult"
  description: "Result set returned from a performed laboratory order."
  data:
  - name: "resultCode"
    type: "String"
  - name: "status"
    type: "ResultStatus"
  - name: "issuedDate"
    type: "DateTime"
  relations:
  - name: "laboratoryOrder"
    type: "LaboratoryOrder"
    multiplicity: "ManyToOne"
  - name: "observations"
    type: "Observation"
    multiplicity: "OneToMany"
  - name: "laboratory"
    type: "Laboratory"
    multiplicity: "ManyToOne"
- name: "ImagingCenter"
  description: "Facility unit that performs medical imaging procedures."
  data:
  - name: "name"
    type: "String"
  relations:
  - name: "facility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "imagingOrders"
    type: "ImagingOrder"
    multiplicity: "OneToMany"
  - name: "imagingReports"
    type: "ImagingReport"
    multiplicity: "OneToMany"
- name: "ImagingOrder"
  description: "Order for a diagnostic imaging study."
  data:
  - name: "modality"
    type: "ImagingModality"
  - name: "bodySite"
    type: "String"
  - name: "contrast"
    type: "Boolean"
  relations:
  - name: "order"
    type: "ClinicalOrder"
    multiplicity: "ManyToOne"
  - name: "imagingCenter"
    type: "ImagingCenter"
    multiplicity: "ManyToOne"
  - name: "reports"
    type: "ImagingReport"
    multiplicity: "OneToMany"
- name: "ImagingReport"
  description: "Radiologist interpretation of an imaging study."
  data:
  - name: "reportNumber"
    type: "String"
  - name: "impression"
    type: "String"
  - name: "status"
    type: "ResultStatus"
  - name: "reportedDate"
    type: "DateTime"
  relations:
  - name: "imagingOrder"
    type: "ImagingOrder"
    multiplicity: "ManyToOne"
  - name: "clinician"
    type: "Clinician"
    multiplicity: "ManyToOne"
  - name: "encounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
  - name: "imagingCenter"
    type: "ImagingCenter"
    multiplicity: "ManyToOne"
- name: "ProcedureOrder"
  description: "Instruction to perform a clinical or surgical procedure."
  data:
  - name: "procedureCode"
    type: "String"
  - name: "anesthesiaType"
    type: "AnesthesiaType"
  - name: "consentObtained"
    type: "Boolean"
  relations:
  - name: "order"
    type: "ClinicalOrder"
    multiplicity: "ManyToOne"
  - name: "facility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "procedure"
    type: "Procedure"
    multiplicity: "OneToOne"
- name: "Procedure"
  description: "Clinical or surgical action performed on a patient."
  data:
  - name: "procedureCode"
    type: "String"
  - name: "startDateTime"
    type: "DateTime"
  - name: "endDateTime"
    type: "DateTime"
  - name: "status"
    type: "ProcedureStatus"
  relations:
  - name: "encounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
  - name: "performer"
    type: "Clinician"
    multiplicity: "ManyToOne"
  - name: "procedureOrder"
    type: "ProcedureOrder"
    multiplicity: "ManyToOne"
- name: "Pharmacy"
