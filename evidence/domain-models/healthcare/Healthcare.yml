    type: "AllergySeverity"
  - name: "status"
    type: "AllergyStatus"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
- name: "Condition"
  description: "Ongoing or historical health condition tracked for a patient."
  data:
  - name: "code"
    type: "String"
  - name: "clinicalStatus"
    type: "ConditionStatus"
  - name: "verificationStatus"
    type: "DiagnosisCertainty"
  - name: "onsetDate"
    type: "Date"
  - name: "abatementDate"
