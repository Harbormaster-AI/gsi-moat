---
entities:
- name: "HealthSystem"
  description: "Legal entity responsible for coordinating and delivering healthcare\
    \ services across facilities."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "facilities"
    type: "Facility"
    multiplicity: "OneToMany"
  - name: "suppliers"
    type: "MedicalSupplier"
    multiplicity: "ManyToMany"
- name: "Facility"
  description: "Licensed healthcare facility such as a hospital, clinic, ambulatory\
    \ center, or specialty site."
  data:
  - name: "name"
    type: "String"
  - name: "facilityCode"
    type: "String"
  - name: "facilityType"
    type: "FacilityType"
  - name: "address"
    type: "Address"
  relations:
  - name: "healthSystem"
    type: "HealthSystem"
    multiplicity: "ManyToOne"
  - name: "departments"
    type: "Department"
    multiplicity: "OneToMany"
  - name: "careTeams"
    type: "CareTeam"
    multiplicity: "OneToMany"
  - name: "laboratories"
    type: "Laboratory"
    multiplicity: "OneToMany"
  - name: "imagingCenters"
    type: "ImagingCenter"
    multiplicity: "OneToMany"
  - name: "pharmacies"
    type: "Pharmacy"
    multiplicity: "OneToMany"
  - name: "inventoryItems"
    type: "InventoryItem"
    multiplicity: "OneToMany"
- name: "Department"
  description: "Organizational unit within a facility focused on a clinical service\
    \ line or function."
  data:
  - name: "name"
    type: "String"
  - name: "departmentType"
    type: "DepartmentType"
  relations:
  - name: "facility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "careTeams"
    type: "CareTeam"
    multiplicity: "OneToMany"
- name: "CareTeam"
  description: "Multidisciplinary group of clinicians and staff assigned to coordinate\
    \ patient care."
  data:
  - name: "name"
    type: "String"
  - name: "careSetting"
    type: "CareSettingType"
  relations:
  - name: "department"
    type: "Department"
    multiplicity: "ManyToOne"
  - name: "clinicians"
    type: "Clinician"
    multiplicity: "ManyToMany"
  - name: "patients"
    type: "Patient"
    multiplicity: "ManyToMany"
- name: "Clinician"
  description: "Licensed healthcare professional who provides clinical services."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "clinicianType"
    type: "ClinicianType"
  - name: "specialty"
    type: "ClinicianSpecialty"
  - name: "licenseNumber"
    type: "String"
  relations:
  - name: "careTeams"
    type: "CareTeam"
    multiplicity: "ManyToMany"
  - name: "appointments"
    type: "Appointment"
    multiplicity: "OneToMany"
  - name: "encounters"
    type: "Encounter"
    multiplicity: "OneToMany"
  - name: "procedures"
    type: "Procedure"
    multiplicity: "OneToMany"
  - name: "imagingReports"
    type: "ImagingReport"
    multiplicity: "OneToMany"
- name: "Patient"
  description: "Individual receiving healthcare services."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "mrn"
    type: "MRN"
  - name: "dateOfBirth"
    type: "Date"
  - name: "sexAtBirth"
    type: "AdministrativeSex"
  - name: "bloodType"
    type: "BloodType"
  - name: "address"
    type: "Address"
  - name: "primaryLanguage"
    type: "String"
  relations:
  - name: "appointments"
    type: "Appointment"
    multiplicity: "OneToMany"
  - name: "encounters"
    type: "Encounter"
    multiplicity: "OneToMany"
  - name: "carePlans"
    type: "CarePlan"
    multiplicity: "OneToMany"
  - name: "allergies"
    type: "Allergy"
    multiplicity: "OneToMany"
  - name: "conditions"
    type: "Condition"
    multiplicity: "OneToMany"
  - name: "medicationOrders"
    type: "MedicationOrder"
    multiplicity: "OneToMany"
  - name: "labOrders"
    type: "LaboratoryOrder"
    multiplicity: "OneToMany"
  - name: "imagingOrders"
    type: "ImagingOrder"
    multiplicity: "OneToMany"
  - name: "coverages"
    type: "Coverage"
    multiplicity: "OneToMany"
  - name: "claims"
    type: "Claim"
    multiplicity: "OneToMany"
  - name: "devices"
    type: "MedicalDevice"
    multiplicity: "OneToMany"
  - name: "observations"
    type: "Observation"
    multiplicity: "OneToMany"
- name: "Appointment"
  description: "Scheduled meeting between a patient and a clinician at a facility."
  data:
  - name: "appointmentDate"
    type: "DateTime"
  - name: "status"
    type: "AppointmentStatus"
  - name: "reason"
    type: "String"
  - name: "priority"
    type: "Priority"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "clinician"
    type: "Clinician"
    multiplicity: "ManyToOne"
  - name: "facility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "encounter"
    type: "Encounter"
    multiplicity: "OneToOne"
- name: "Encounter"
  description: "An interaction during which healthcare services are provided to a\
    \ patient."
  data:
  - name: "encounterNumber"
    type: "String"
  - name: "startDateTime"
    type: "DateTime"
  - name: "endDateTime"
    type: "DateTime"
  - name: "status"
    type: "EncounterStatus"
  - name: "encounterType"
    type: "EncounterType"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "clinician"
    type: "Clinician"
    multiplicity: "ManyToOne"
  - name: "facility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "appointment"
    type: "Appointment"
    multiplicity: "OneToOne"
  - name: "diagnoses"
    type: "Diagnosis"
    multiplicity: "OneToMany"
  - name: "procedures"
    type: "Procedure"
    multiplicity: "OneToMany"
  - name: "observations"
    type: "Observation"
    multiplicity: "OneToMany"
  - name: "orders"
    type: "ClinicalOrder"
    multiplicity: "OneToMany"
  - name: "admission"
    type: "Admission"
    multiplicity: "OneToOne"
  - name: "discharge"
    type: "Discharge"
    multiplicity: "OneToOne"
- name: "Admission"
  description: "Administrative record of a patient being admitted for inpatient care."
  data:
  - name: "admitDateTime"
    type: "DateTime"
  - name: "admissionType"
    type: "AdmissionType"
  - name: "bed"
    type: "String"
  relations:
  - name: "encounter"
    type: "Encounter"
    multiplicity: "OneToOne"
  - name: "facility"
    type: "Facility"
    multiplicity: "ManyToOne"
- name: "Discharge"
  description: "Administrative record of a patient's release from care."
  data:
  - name: "dischargeDateTime"
    type: "DateTime"
  - name: "disposition"
    type: "DischargeDisposition"
  relations:
  - name: "encounter"
    type: "Encounter"
    multiplicity: "OneToOne"
- name: "ClinicalOrder"
  description: "Physician or clinician directive to provide a diagnostic test, medication,\
    \ or procedure."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "status"
    type: "OrderStatus"
  - name: "orderType"
    type: "ClinicalOrderType"
  - name: "priority"
    type: "Priority"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "encounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
  - name: "orderingClinician"
    type: "Clinician"
    multiplicity: "ManyToOne"
  - name: "medicationOrders"
    type: "MedicationOrder"
    multiplicity: "OneToMany"
  - name: "laboratoryOrders"
    type: "LaboratoryOrder"
    multiplicity: "OneToMany"
  - name: "imagingOrders"
    type: "ImagingOrder"
    multiplicity: "OneToMany"
  - name: "procedureOrders"
    type: "ProcedureOrder"
    multiplicity: "OneToMany"
  - name: "authorizations"
    type: "Authorization"
    multiplicity: "OneToMany"
- name: "MedicationOrder"
  description: "Prescribed medication with dose, route, and schedule instructions."
  data:
  - name: "medicationCode"
    type: "String"
  - name: "dose"
    type: "Dose"
  - name: "route"
    type: "RouteOfAdministration"
  - name: "frequency"
    type: "String"
  - name: "duration"
    type: "String"
  relations:
  - name: "order"
    type: "ClinicalOrder"
    multiplicity: "ManyToOne"
  - name: "pharmacy"
    type: "Pharmacy"
    multiplicity: "ManyToOne"
  - name: "dispenses"
    type: "MedicationDispense"
    multiplicity: "OneToMany"
- name: "Laboratory"
  description: "Diagnostic laboratory accredited to perform clinical testing."
