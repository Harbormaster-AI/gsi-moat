    type: "Encounter"
    multiplicity: "ManyToOne"
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
- name: "Observation"
  description: "Measurement or assertion about a patient's health state."
  data:
  - name: "code"
    type: "String"
  - name: "value"
    type: "String"
  - name: "unit"
    type: "String"
  - name: "effectiveDateTime"
    type: "DateTime"
  - name: "interpretation"
    type: "ObservationInterpretation"
