  data:
  - name: "udi"
    type: "String"
  - name: "deviceType"
    type: "DeviceType"
  - name: "manufacturer"
    type: "String"
  - name: "connectivityStatus"
    type: "DeviceConnectivityStatus"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "observations"
    type: "Observation"
    multiplicity: "OneToMany"
  - name: "softwareUpdates"
    type: "SoftwareUpdate"
    multiplicity: "OneToMany"
- name: "SoftwareUpdate"
