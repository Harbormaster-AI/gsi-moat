  - name: "name"
    type: "String"
  - name: "planCode"
    type: "String"
  - name: "planType"
    type: "InsurancePlanType"
  relations:
  - name: "payer"
    type: "InsurancePayer"
    multiplicity: "ManyToOne"
  - name: "coverages"
    type: "Coverage"
    multiplicity: "OneToMany"
- name: "Coverage"
  description: "Enrollment and benefits information for a member under a plan."
  data:
  - name: "memberId"
    type: "String"
  - name: "groupNumber"
    type: "String"
  - name: "effectiveDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "coverageType"
    type: "CoverageType"
