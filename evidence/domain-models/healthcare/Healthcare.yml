  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "plan"
    type: "InsurancePlan"
    multiplicity: "ManyToOne"
  - name: "claims"
    type: "Claim"
    multiplicity: "OneToMany"
  - name: "authorizations"
    type: "Authorization"
    multiplicity: "OneToMany"
- name: "Claim"
  description: "Request for reimbursement for services rendered."
  data:
  - name: "claimNumber"
    type: "String"
  - name: "status"
    type: "ClaimStatus"
  - name: "totalAmount"
    type: "Money"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "coverage"
    type: "Coverage"
    multiplicity: "ManyToOne"
  - name: "encounter"
    type: "Encounter"
    multiplicity: "ManyToOne"
  - name: "invoices"
    type: "Invoice"
    multiplicity: "OneToMany"
  - name: "payer"
    type: "InsurancePayer"
    multiplicity: "ManyToOne"
- name: "Authorization"
  description: "Prior approval from a payer for a specified service or order."
  data:
  - name: "authNumber"
    type: "String"
  - name: "status"
    type: "AuthorizationStatus"
  - name: "requestedService"
    type: "String"
  relations:
  - name: "coverage"
    type: "Coverage"
    multiplicity: "ManyToOne"
  - name: "order"
    type: "ClinicalOrder"
    multiplicity: "ManyToOne"
