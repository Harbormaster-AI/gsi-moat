  - name: "encounters"
    type: "Encounter"
    multiplicity: "OneToMany"
  - name: "tasks"
    type: "CareTask"
    multiplicity: "OneToMany"
  - name: "careTeam"
    type: "CareTeam"
    multiplicity: "ManyToOne"
- name: "CareTask"
  description: "Actionable task associated with a care plan."
  data:
  - name: "description"
    type: "String"
  - name: "dueDate"
    type: "Date"
  - name: "status"
    type: "TaskStatus"
  - name: "priority"
    type: "Priority"
  relations:
  - name: "carePlan"
    type: "CarePlan"
    multiplicity: "ManyToOne"
  - name: "assignedTo"
