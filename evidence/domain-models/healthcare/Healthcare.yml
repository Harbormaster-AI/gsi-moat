    type: "String"
  - name: "quantityOnHand"
    type: "Integer"
  - name: "quantityReserved"
    type: "Integer"
  relations:
  - name: "facility"
    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "supplier"
    type: "MedicalSupplier"
    multiplicity: "ManyToOne"
metadata:
  name: "Healthcare Industry Domain Model"
  version: "1.0.0"
  industry: "Healthcare"
  category: "Healthcare"
