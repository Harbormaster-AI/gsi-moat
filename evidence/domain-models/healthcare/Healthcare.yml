    type: "Facility"
    multiplicity: "ManyToOne"
  - name: "medicationDispenses"
    type: "MedicationDispense"
    multiplicity: "OneToMany"
  - name: "medicationOrders"
    type: "MedicationOrder"
    multiplicity: "OneToMany"
- name: "MedicationDispense"
  description: "Record of medication prepared and provided to a patient."
  data:
  - name: "dispenseNumber"
    type: "String"
  - name: "quantity"
    type: "Decimal"
  - name: "whenPrepared"
    type: "DateTime"
  - name: "status"
    type: "DispenseStatus"
  relations:
  - name: "medicationOrder"
    type: "MedicationOrder"
    multiplicity: "ManyToOne"
  - name: "pharmacy"
    type: "Pharmacy"
    multiplicity: "ManyToOne"
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
