  - name: "totalAmount"
    type: "Money"
  - name: "status"
    type: "InvoiceStatus"
  - name: "dueDate"
    type: "Date"
  relations:
  - name: "patient"
    type: "Patient"
    multiplicity: "ManyToOne"
  - name: "claim"
    type: "Claim"
    multiplicity: "ManyToOne"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
- name: "Payment"
  description: "Monetary transaction applied to an invoice."
  data:
  - name: "paymentNumber"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "paymentDate"
    type: "Date"
  - name: "method"
    type: "PaymentMethod"
