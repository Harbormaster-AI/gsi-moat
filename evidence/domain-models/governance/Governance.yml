enums:
  - name: "GovernanceBodyType"
    description: "Types of oversight groups that provide governance direction and decisions."
    data:
      - name: "Board"
      - name: "Committee"
      - name: "Council"
      - name: "WorkingGroup"
  - name: "PolicyType"
    description: "Categories of policies used to govern organizational behavior and\
    \ controls."
    data:
      - name: "InformationSecurity"
      - name: "DataProtection"
      - name: "Ethics"
      - name: "RecordsManagement"
      - name: "RiskManagement"
      - name: "Compliance"
      - name: "Privacy"
      - name: "AcceptableUse"
  - name: "DocumentStatus"
    description: "Lifecycle state of a controlled document."
    data:
      - name: "Draft"
      - name: "InReview"
      - name: "Approved"
      - name: "Retired"
  - name: "ControlType"
    description: "Functional nature of a control."
    data:
      - name: "Preventive"
      - name: "Detective"
      - name: "Corrective"
      - name: "Directive"
  - name: "ControlFrequency"
    description: "How often a control is executed or monitored."
    data:
      - name: "Continuous"
      - name: "Daily"
      - name: "Weekly"
      - name: "Monthly"
      - name: "Quarterly"
      - name: "Annually"
      - name: "AdHoc"
  - name: "ControlStatus"
    description: "Implementation and operational status of a control."
    data:
      - name: "Designed"
      - name: "Implemented"
      - name: "Operating"
      - name: "Retired"
  - name: "RiskCategory"
    description: "Classification of risks by domain of impact."
    data:
      - name: "Strategic"
      - name: "Operational"
      - name: "Financial"
      - name: "Compliance"
      - name: "Reputational"
      - name: "Privacy"
      - name: "Cybersecurity"
      - name: "ThirdParty"
  - name: "RiskImpact"
    description: "Estimated magnitude of effect if a risk materializes."
    data:
      - name: "Insignificant"
      - name: "Minor"
      - name: "Moderate"
      - name: "Major"
      - name: "Severe"
  - name: "RiskLikelihood"
    description: "Estimated probability of a risk event occurring."
    data:
      - name: "Rare"
      - name: "Unlikely"
      - name: "Possible"
      - name: "Likely"
      - name: "AlmostCertain"
  - name: "RiskStatus"
    description: "Current treatment or disposition of a risk."
    data:
      - name: "Identified"
      - name: "Assessed"
      - name: "Mitigated"
      - name: "Accepted"
      - name: "Transferred"
      - name: "Closed"
  - name: "AssessmentType"
    description: "Methods used to evaluate processes, risks, or controls."
    data:
      - name: "SelfAssessment"
      - name: "InternalAssessment"
      - name: "ExternalAssessment"
      - name: "ReadinessReview"
  - name: "TestType"
    description: "Techniques used to test control design or operation."
    data:
      - name: "DesignEffectiveness"
      - name: "OperatingEffectiveness"
      - name: "Walkthrough"
      - name: "Reperformance"
      - name: "Inquiry"
      - name: "Observation"
      - name: "Inspection"
      - name: "DataAnalysis"
  - name: "ControlEffectiveness"
    description: "Outcome of control testing relative to objectives."
    data:
      - name: "Effective"
      - name: "PartiallyEffective"
      - name: "Ineffective"
      - name: "NotTested"
  - name: "TestStatus"
    description: "Progress state of a control test."
    data:
      - name: "Planned"
      - name: "InProgress"
      - name: "Completed"
      - name: "Blocked"
      - name: "Cancelled"
  - name: "EvidenceType"
    description: "Forms of artifacts supporting compliance and control performance."
    data:
      - name: "Document"
      - name: "Screenshot"
      - name: "LogExport"
      - name: "SystemReport"
      - name: "Ticket"
      - name: "Attestation"
      - name: "Configuration"
      - name: "Dataset"
  - name: "AuditCycle"
    description: "Cadence used for planning audit activities."
    data:
      - name: "Annual"
      - name: "SemiAnnual"
      - name: "Quarterly"
      - name: "Continuous"
      - name: "OneTime"
  - name: "AuditStatus"
    description: "Lifecycle state of an audit activity."
    data:
      - name: "Planned"
      - name: "Fieldwork"
      - name: "Reporting"
      - name: "Closed"
      - name: "OnHold"
  - name: "FindingSeverity"
    description: "Relative seriousness of an audit finding."
    data:
      - name: "Low"
      - name: "Medium"
      - name: "High"
      - name: "Critical"
  - name: "FindingStatus"
    description: "Remediation state of an audit finding."
    data:
      - name: "Open"
      - name: "InRemediation"
      - name: "Validated"
      - name: "Closed"
  - name: "ActionStatus"
    description: "Progress of a corrective action."
    data:
      - name: "NotStarted"
      - name: "InProgress"
      - name: "Deferred"
      - name: "Completed"
      - name: "Cancelled"
  - name: "IssueType"
    description: "Nature of a tracked issue or deficiency."
    data:
      - name: "ControlDeficiency"
      - name: "ProcessGap"
      - name: "ComplianceBreach"
      - name: "SecurityIncident"
      - name: "DataQualityIssue"
      - name: "ThirdPartyIssue"
  - name: "Priority"
    description: "Urgency or importance assigned to an issue."
    data:
      - name: "Low"
      - name: "Medium"
      - name: "High"
      - name: "Urgent"
  - name: "IssueStatus"
    description: "Current state of an issue through its lifecycle."
    data:
      - name: "Open"
      - name: "Investigating"
      - name: "RemediationPlanned"
      - name: "RemediationInProgress"
      - name: "Verified"
      - name: "Closed"
  - name: "ComplianceStatus"
    description: "Degree of adherence to a requirement or program."
    data:
      - name: "NotStarted"
      - name: "InProgress"
      - name: "Compliant"
      - name: "NonCompliant"
      - name: "Waived"
  - name: "Applicability"
    description: "Degree to which a requirement applies to a scope."
    data:
      - name: "Mandatory"
      - name: "Recommended"
      - name: "NotApplicable"
  - name: "AttestationResult"
    description: "Outcome of an attestation statement."
    data:
      - name: "Affirmative"
      - name: "Negative"
      - name: "Qualified"
  - name: "LawfulBasis"
    description: "Legal justification for processing personal data."
    data:
      - name: "Consent"
      - name: "Contract"
      - name: "LegalObligation"
      - name: "VitalInterests"
      - name: "PublicTask"
      - name: "LegitimateInterests"
  - name: "DataClassificationLevel"
    description: "Sensitivity tiers used to protect information assets."
    data:
      - name: "Public"
      - name: "Internal"
      - name: "Confidential"
      - name: "Restricted"
      - name: "HighlyRestricted"
  - name: "SystemType"
    description: "Categories of systems used to store or process data."
    data:
      - name: "Application"
      - name: "Database"
      - name: "DataWarehouse"
      - name: "SaaS"
      - name: "Infrastructure"
      - name: "Endpoint"
  - name: "DataSubjectRequestType"
    description: "Rights exercised by data subjects under privacy regulations."
    data:
      - name: "Access"
      - name: "Rectification"
      - name: "Erasure"
      - name: "Restriction"
      - name: "Portability"
      - name: "Objection"
      - name: "AutomatedDecisioningReview"
  - name: "RequestStatus"
    description: "Processing state of a data subject request."
    data:
      - name: "Received"
      - name: "InValidation"
      - name: "InProgress"
      - name: "OnHold"
      - name: "Fulfilled"
      - name: "Rejected"
  - name: "RepositoryType"
    description: "Types of repositories used for records storage."
    data:
      - name: "DocumentManagement"
      - name: "RecordsArchive"
      - name: "EmailArchive"
      - name: "FileShare"
      - name: "ContentServices"
      - name: "DataLake"
  - name: "RecordType"
    description: "Classes of records maintained by the organization."
    data:
      - name: "PolicyRecord"
      - name: "ContractRecord"
      - name: "FinancialRecord"
      - name: "HRRecord"
      - name: "CustomerRecord"
      - name: "TechnicalRecord"
      - name: "AuditRecord"
      - name: "LegalRecord"
  - name: "RecordStatus"
    description: "Lifecycle state of a record."
    data:
      - name: "Active"
      - name: "Archived"
      - name: "PendingDisposition"
      - name: "Disposed"
      - name: "OnHold"
  - name: "RetentionTrigger"
    description: "Event that starts the retention period for records."
    data:
      - name: "CreationDate"
      - name: "LastModified"
      - name: "Termination"
      - name: "ContractEnd"
      - name: "EventCompletion"
      - name: "FiscalYearEnd"
  - name: "DispositionAction"
    description: "Action to be taken when retention has expired."
    data:
      - name: "Destroy"
      - name: "TransferToArchive"
      - name: "Review"
      - name: "SecureDelete"
      - name: "ReturnToOwner"
  - name: "RetentionStatus"
    description: "Adoption state of a retention schedule."
    data:
      - name: "Draft"
      - name: "Approved"
      - name: "InEffect"
      - name: "Suspended"
      - name: "Retired"
  - name: "DispositionOutcome"
    description: "Result of a disposition review for records."
    data:
      - name: "Approved"
      - name: "Deferred"
      - name: "Rejected"
      - name: "Executed"
  - name: "LegalHoldStatus"
    description: "Current state of a legal hold directive."
    data:
      - name: "Active"
      - name: "Released"
      - name: "Superseded"
  - name: "MatterType"
    description: "Type of legal or regulatory matter."
    data:
      - name: "Litigation"
      - name: "Investigation"
      - name: "RegulatoryInquiry"
      - name: "Complaint"
      - name: "Arbitration"
  - name: "MatterStatus"
    description: "Progress state of a legal matter."
    data:
      - name: "Open"
      - name: "ActiveDiscovery"
      - name: "Negotiation"
      - name: "Settled"
      - name: "Closed"
  - name: "ThirdPartyType"
    description: "Classification of external entities engaged by the organization."
    data:
      - name: "Vendor"
      - name: "Processor"
      - name: "JointController"
      - name: "Subprocessor"
      - name: "Partner"
      - name: "Consultant"
  - name: "VendorCriticality"
    description: "Degree of dependency and risk associated with a third party."
    data:
      - name: "Low"
      - name: "Medium"
      - name: "High"
      - name: "Critical"
  - name: "AssessmentResult"
    description: "Outcome of a third-party or internal assessment."
    data:
      - name: "Pass"
      - name: "ConditionalPass"
      - name: "Fail"
  - name: "ContractStatus"
    description: "Lifecycle state of a contract."
    data:
      - name: "Draft"
      - name: "Active"
      - name: "Expiring"
      - name: "Terminated"
      - name: "Archived"
  - name: "ObligationType"
    description: "Source-derived category for a specific duty or requirement."
    data:
      - name: "Regulatory"
      - name: "Contractual"
      - name: "PolicyDerived"
      - name: "IndustryStandard"
  - name: "ExceptionType"
    description: "Nature of a deviation granted from a defined requirement."
    data:
      - name: "PolicyException"
      - name: "ControlException"
      - name: "RetentionException"
      - name: "RiskAcceptance"
      - name: "ComplianceWaiver"
  - name: "ExceptionStatus"
    description: "Approval and lifecycle state of an exception."
    data:
      - name: "Draft"
      - name: "Submitted"
      - name: "Approved"
      - name: "Rejected"
      - name: "Expired"
  - name: "ConsentType"
    description: "Categories of consent collected from data subjects."
    data:
      - name: "Marketing"
      - name: "Profiling"
      - name: "Cookies"
      - name: "Location"
      - name: "Biometric"
  - name: "ConsentStatus"
    description: "Current validity of a consent record."
    data:
      - name: "Granted"
      - name: "Withdrawn"
      - name: "Expired"
      - name: "NotRequired"
  - name: "BreachSeverity"
    description: "Impact level assigned to a data breach incident."
    data:
      - name: "Low"
      - name: "Medium"
      - name: "High"
      - name: "Critical"
  - name: "IncidentStatus"
    description: "Handling stage of a security or privacy incident."
    data:
      - name: "Identified"
      - name: "Contained"
      - name: "Notified"
      - name: "Resolved"
      - name: "Closed"
