---
metadata:
  name: "HCIDL Governance Capabilities Model"
  description: "Canonical capabilities model for enterprise governance spanning compliance,\
    \ risk, policy, audit, privacy, records, data retention, and legal hold functions."
  version: "1.0.0"
  industry: "Cross-Industry GRC"
  category: "Governance"
  type: "Capability"
  domain: "Governance"
entities:
  - name: "Organization"
    description: "Legal entity or subsidiary subject to governance, risk, and compliance\
    \ oversight."
    data:
      - name: "name"
        type: "String"
      - name: "legalName"
        type: "String"
      - name: "jurisdiction"
        type: "String"
      - name: "industrySector"
        type: "String"
    relations:
      - name: "governanceBodies"
        type: "GovernanceBody"
        multiplicity: "OneToMany"
      - name: "policies"
        type: "Policy"
        multiplicity: "OneToMany"
      - name: "risks"
        type: "Risk"
        multiplicity: "OneToMany"
      - name: "thirdParties"
        type: "ThirdParty"
        multiplicity: "OneToMany"
      - name: "recordsRepositories"
        type: "RecordsRepository"
        multiplicity: "OneToMany"
      - name: "dataProcessingActivities"
        type: "DataProcessingActivity"
        multiplicity: "OneToMany"
      - name: "compliancePrograms"
        type: "ComplianceProgram"
        multiplicity: "OneToMany"
      - name: "auditPrograms"
        type: "AuditProgram"
        multiplicity: "OneToMany"
      - name: "businessUnits"
        type: "BusinessUnit"
        multiplicity: "OneToMany"
      - name: "matters"
        type: "Matter"
        multiplicity: "OneToMany"
      - name: "dataBreaches"
        type: "DataBreach"
        multiplicity: "OneToMany"
  - name: "GovernanceBody"
    description: "Board, committee, or council providing oversight and decision-making\
    \ authority."
    data:
      - name: "name"
        type: "String"
      - name: "bodyType"
        type: "GovernanceBodyType"
      - name: "charterUrl"
        type: "URL"
      - name: "chair"
        type: "String"
    relations:
      - name: "organization"
        type: "Organization"
        multiplicity: "ManyToOne"
      - name: "roleAssignments"
        type: "RoleAssignment"
        multiplicity: "OneToMany"
      - name: "policies"
        type: "Policy"
        multiplicity: "ManyToMany"
  - name: "Person"
    description: "Individual participating in governance activities and control ownership."
    data:
      - name: "firstName"
        type: "String"
      - name: "lastName"
        type: "String"
      - name: "email"
        type: "EmailAddress"
      - name: "department"
        type: "String"
    relations:
      - name: "roleAssignments"
        type: "RoleAssignment"
        multiplicity: "OneToMany"
      - name: "ownedPolicies"
        type: "Policy"
        multiplicity: "ManyToMany"
      - name: "correctiveActions"
        type: "CorrectiveAction"
        multiplicity: "OneToMany"
  - name: "Role"
    description: "Governance role that defines responsibilities and authority."
    data:
      - name: "name"
        type: "String"
      - name: "responsibility"
        type: "String"
    relations:
      - name: "assignments"
        type: "RoleAssignment"
        multiplicity: "OneToMany"
  - name: "RoleAssignment"
    description: "Assignment of a person to a role within an organization or governance\
    \ body."
    data:
      - name: "effectiveFrom"
        type: "Date"
      - name: "effectiveTo"
        type: "Date"
    relations:
      - name: "person"
        type: "Person"
        multiplicity: "ManyToOne"
      - name: "role"
        type: "Role"
        multiplicity: "ManyToOne"
      - name: "governanceBody"
        type: "GovernanceBody"
        multiplicity: "ManyToOne"
      - name: "organization"
        type: "Organization"
        multiplicity: "ManyToOne"
  - name: "Policy"
    description: "Formal statement of governance intent and rules guiding organizational\
    \ behavior."
    data:
      - name: "title"
        type: "String"
      - name: "policyType"
        type: "PolicyType"
      - name: "versionLabel"
        type: "String"
      - name: "status"
        type: "DocumentStatus"
      - name: "approvalDate"
        type: "Date"
      - name: "nextReviewDate"
        type: "Date"
      - name: "documentUrl"
        type: "URL"
    relations:
      - name: "organization"
        type: "Organization"
        multiplicity: "ManyToOne"
      - name: "owners"
        type: "Person"
        multiplicity: "ManyToMany"
      - name: "relatedRequirements"
        type: "ComplianceRequirement"
        multiplicity: "ManyToMany"
      - name: "controls"
        type: "Control"
        multiplicity: "OneToMany"
      - name: "procedures"
        type: "Procedure"
        multiplicity: "OneToMany"
      - name: "exceptions"
        type: "Exception_"
        multiplicity: "OneToMany"
      - name: "attestations"
        type: "Attestation"
        multiplicity: "OneToMany"
  - name: "Procedure"
    description: "Detailed steps and instructions to operationalize a policy or control."
    data:
      - name: "title"
        type: "String"
      - name: "versionLabel"
        type: "String"
      - name: "status"
        type: "DocumentStatus"
    relations:
      - name: "policy"
        type: "Policy"
        multiplicity: "ManyToOne"
      - name: "controls"
        type: "Control"
        multiplicity: "ManyToMany"
  - name: "Regulation"
    description: "External law, regulation, or standard establishing mandatory obligations."
    data:
      - name: "name"
        type: "String"
      - name: "citation"
        type: "String"
      - name: "jurisdiction"
        type: "String"
      - name: "publicationUrl"
        type: "URL"
    relations:
      - name: "obligations"
        type: "Obligation"
        multiplicity: "OneToMany"
      - name: "compliancePrograms"
        type: "ComplianceProgram"
        multiplicity: "ManyToMany"
  - name: "Obligation"
    description: "Specific regulatory or contractual requirement that must be satisfied."
    data:
      - name: "referenceNumber"
        type: "String"
      - name: "obligationType"
        type: "ObligationType"
      - name: "descriptionText"
        type: "String"
      - name: "reviewFrequency"
        type: "ControlFrequency"
    relations:
      - name: "regulation"
        type: "Regulation"
        multiplicity: "ManyToOne"
      - name: "controls"
        type: "Control"
        multiplicity: "ManyToMany"
      - name: "policies"
        type: "Policy"
        multiplicity: "ManyToMany"
      - name: "contracts"
        type: "Contract"
        multiplicity: "ManyToMany"
  - name: "Control"
    description: "Mechanism or activity designed to achieve governance objectives and\
    \ manage risk."
    data:
      - name: "name"
        type: "String"
      - name: "controlType"
        type: "ControlType"
      - name: "objective"
        type: "String"
      - name: "frequency"
        type: "ControlFrequency"
      - name: "ownerDepartment"
        type: "String"
      - name: "status"
        type: "ControlStatus"
    relations:
      - name: "policy"
        type: "Policy"
        multiplicity: "ManyToOne"
      - name: "controlTests"
        type: "ControlTest_"
        multiplicity: "OneToMany"
      - name: "evidence"
        type: "Evidence"
        multiplicity: "OneToMany"
      - name: "risks"
        type: "Risk"
        multiplicity: "ManyToMany"
      - name: "obligations"
        type: "Obligation"
        multiplicity: "ManyToMany"
      - name: "procedures"
        type: "Procedure"
        multiplicity: "ManyToMany"
      - name: "issues"
        type: "Issue"
        multiplicity: "OneToMany"
  - name: "ControlTest_"
    description: "Evaluation of control design or operating effectiveness over a specified\
    \ period."
    data:
      - name: "name"
        type: "String"
      - name: "testType"
        type: "TestType"
      - name: "testPeriodStart"
        type: "Date"
      - name: "testPeriodEnd"
        type: "Date"
      - name: "sampleSize"
        type: "Integer"
      - name: "effectiveness"
        type: "ControlEffectiveness"
      - name: "status"
        type: "TestStatus"
    relations:
      - name: "control"
        type: "Control"
        multiplicity: "ManyToOne"
      - name: "evidence"
        type: "Evidence"
        multiplicity: "OneToMany"
      - name: "engagement"
        type: "AuditEngagement"
        multiplicity: "ManyToOne"
  - name: "Evidence"
    description: "Artifact or record supporting the performance or effectiveness of\
    \ a control."
    data:
      - name: "title"
        type: "String"
      - name: "evidenceType"
        type: "EvidenceType"
      - name: "locationUrl"
        type: "URL"
      - name: "receivedDate"
        type: "Date"
    relations:
      - name: "controlTest"
        type: "ControlTest_"
        multiplicity: "ManyToOne"
      - name: "control"
        type: "Control"
        multiplicity: "ManyToOne"
      - name: "obligation"
        type: "Obligation"
        multiplicity: "ManyToOne"
      - name: "workpaper"
        type: "AuditWorkpaper"
        multiplicity: "ManyToOne"
  - name: "Risk"
    description: "Uncertain event or condition that could impact objectives."
    data:
      - name: "name"
        type: "String"
      - name: "category"
        type: "RiskCategory"
      - name: "description"
        type: "String"
      - name: "impact"
        type: "RiskImpact"
      - name: "likelihood"
        type: "RiskLikelihood"
      - name: "inherentRiskScore"
        type: "Integer"
      - name: "residualRiskScore"
        type: "Integer"
      - name: "status"
        type: "RiskStatus"
    relations:
      - name: "organization"
        type: "Organization"
        multiplicity: "ManyToOne"
      - name: "controls"
        type: "Control"
        multiplicity: "ManyToMany"
      - name: "assessments"
        type: "RiskAssessment"
        multiplicity: "OneToMany"
      - name: "issues"
        type: "Issue"
        multiplicity: "OneToMany"
      - name: "findings"
        type: "AuditFinding"
        multiplicity: "ManyToMany"
  - name: "RiskAssessment"
    description: "Periodic evaluation of a risk’s severity, treatment, and residual\
    \ exposure."
    data:
      - name: "assessmentDate"
        type: "Date"
      - name: "assessmentType"
        type: "AssessmentType"
      - name: "assessor"
        type: "String"
      - name: "summary"
        type: "String"
    relations:
      - name: "risk"
        type: "Risk"
        multiplicity: "ManyToOne"
  - name: "ComplianceProgram"
    description: "Structured program to manage adherence to frameworks, laws, and standards."
    data:
      - name: "name"
        type: "String"
      - name: "framework"
        type: "String"
      - name: "status"
        type: "ComplianceStatus"
    relations:
      - name: "organization"
        type: "Organization"
        multiplicity: "ManyToOne"
      - name: "requirements"
        type: "ComplianceRequirement"
        multiplicity: "OneToMany"
      - name: "controls"
        type: "Control"
        multiplicity: "ManyToMany"
      - name: "attestations"
        type: "Attestation"
        multiplicity: "OneToMany"
      - name: "regulations"
        type: "Regulation"
        multiplicity: "ManyToMany"
  - name: "ComplianceRequirement"
    description: "Internalized control or process requirement derived from a framework\
    \ or regulation."
    data:
      - name: "name"
        type: "String"
      - name: "source"
        type: "String"
      - name: "citation"
        type: "String"
      - name: "applicability"
        type: "Applicability"
      - name: "status"
        type: "ComplianceStatus"
    relations:
      - name: "complianceProgram"
        type: "ComplianceProgram"
        multiplicity: "ManyToOne"
      - name: "policies"
        type: "Policy"
        multiplicity: "ManyToMany"
      - name: "controls"
        type: "Control"
        multiplicity: "ManyToMany"
      - name: "obligations"
        type: "Obligation"
        multiplicity: "ManyToMany"
  - name: "Attestation"
    description: "Formal confirmation by an accountable party that requirements have\
    \ been met."
    data:
      - name: "statement"
        type: "String"
      - name: "attestor"
        type: "String"
      - name: "dateSigned"
        type: "Date"
      - name: "result"
        type: "AttestationResult"
    relations:
      - name: "control"
        type: "Control"
        multiplicity: "ManyToOne"
      - name: "policy"
        type: "Policy"
        multiplicity: "ManyToOne"
      - name: "complianceProgram"
        type: "ComplianceProgram"
        multiplicity: "ManyToOne"
  - name: "AuditProgram"
    description: "Portfolio of audit activities planned over a defined cycle."
    data:
      - name: "name"
        type: "String"
      - name: "scope"
        type: "String"
      - name: "cycle"
        type: "AuditCycle"
      - name: "status"
        type: "AuditStatus"
    relations:
      - name: "organization"
        type: "Organization"
        multiplicity: "ManyToOne"
      - name: "engagements"
        type: "AuditEngagement"
        multiplicity: "OneToMany"
  - name: "AuditEngagement"
    description: "Discrete audit execution covering defined objectives, scope, and period."
    data:
      - name: "title"
        type: "String"
      - name: "startDate"
        type: "Date"
      - name: "endDate"
        type: "Date"
      - name: "status"
        type: "AuditStatus"
    relations:
      - name: "auditProgram"
        type: "AuditProgram"
        multiplicity: "ManyToOne"
      - name: "businessUnits"
        type: "BusinessUnit"
        multiplicity: "ManyToMany"
      - name: "controlTests"
        type: "ControlTest_"
        multiplicity: "OneToMany"
      - name: "workpapers"
        type: "AuditWorkpaper"
        multiplicity: "OneToMany"
      - name: "findings"
        type: "AuditFinding"
        multiplicity: "OneToMany"
  - name: "AuditWorkpaper"
    description: "Working paper capturing procedures performed, evidence, and conclusions."
    data:
      - name: "workpaperRef"
        type: "String"
      - name: "subject"
        type: "String"
      - name: "workpaperUrl"
        type: "URL"
    relations:
      - name: "engagement"
        type: "AuditEngagement"
        multiplicity: "ManyToOne"
      - name: "evidence"
        type: "Evidence"
        multiplicity: "ManyToMany"
      - name: "findings"
        type: "AuditFinding"
        multiplicity: "OneToMany"
  - name: "AuditFinding"
    description: "Resulting observation identifying a deficiency, nonconformance, or\
    \ improvement area."
    data:
      - name: "title"
        type: "String"
      - name: "severity"
        type: "FindingSeverity"
      - name: "description"
        type: "String"
      - name: "status"
        type: "FindingStatus"
      - name: "dueDate"
        type: "Date"
    relations:
      - name: "engagement"
        type: "AuditEngagement"
        multiplicity: "ManyToOne"
      - name: "workpaper"
        type: "AuditWorkpaper"
        multiplicity: "ManyToOne"
      - name: "correctiveActions"
        type: "CorrectiveAction"
        multiplicity: "OneToMany"
      - name: "relatedRisks"
        type: "Risk"
        multiplicity: "ManyToMany"
      - name: "relatedControls"
        type: "Control"
        multiplicity: "ManyToMany"
      - name: "issues"
        type: "Issue"
        multiplicity: "OneToMany"
  - name: "CorrectiveAction"
    description: "Remediation task to address a finding or issue within an agreed timeframe."
    data:
      - name: "actionTitle"
        type: "String"
      - name: "owner"
        type: "String"
      - name: "targetDate"
        type: "Date"
      - name: "status"
        type: "ActionStatus"
    relations:
      - name: "finding"
        type: "AuditFinding"
        multiplicity: "ManyToOne"
      - name: "issue"
        type: "Issue"
        multiplicity: "ManyToOne"
  - name: "Issue"
    description: "Tracked deficiency or incident requiring remediation and validation."
    data:
      - name: "title"
        type: "String"
      - name: "issueType"
        type: "IssueType"
      - name: "priority"
        type: "Priority"
      - name: "status"
        type: "IssueStatus"
      - name: "openedDate"
        type: "Date"
      - name: "closedDate"
        type: "Date"
    relations:
      - name: "risk"
        type: "Risk"
        multiplicity: "ManyToOne"
      - name: "finding"
        type: "AuditFinding"
        multiplicity: "ManyToOne"
      - name: "correctiveActions"
        type: "CorrectiveAction"
        multiplicity: "OneToMany"
      - name: "control"
        type: "Control"
        multiplicity: "ManyToOne"
  - name: "BusinessUnit"
    description: "Operational unit or function that may be subject to audits and policies."
    data:
      - name: "name"
        type: "String"
      - name: "leader"
        type: "String"
    relations:
      - name: "organization"
        type: "Organization"
        multiplicity: "ManyToOne"
      - name: "audits"
        type: "AuditEngagement"
        multiplicity: "ManyToMany"
  - name: "DataProcessingActivity"
    description: "Activity involving personal or sensitive data with a defined purpose\
    \ and basis."
    data:
      - name: "name"
        type: "String"
      - name: "purpose"
        type: "String"
      - name: "lawfulBasis"
        type: "LawfulBasis"
      - name: "startDate"
        type: "Date"
    relations:
      - name: "organization"
        type: "Organization"
        multiplicity: "ManyToOne"
      - name: "dataCategories"
        type: "DataCategory"
        multiplicity: "ManyToMany"
      - name: "systems"
        type: "System_"
        multiplicity: "ManyToMany"
      - name: "records"
        type: "Record_"
        multiplicity: "ManyToMany"
      - name: "privacyNotices"
        type: "PrivacyNotice"
        multiplicity: "ManyToMany"
      - name: "thirdParties"
        type: "ThirdParty"
        multiplicity: "ManyToMany"
      - name: "consents"
        type: "Consent"
        multiplicity: "ManyToMany"
      - name: "dataBreaches"
        type: "DataBreach"
        multiplicity: "ManyToMany"
      - name: "dataSubjectRequests"
        type: "DataSubjectRequest"
        multiplicity: "ManyToMany"
  - name: "DataCategory"
    description: "Classification of data processed, often tied to sensitivity and regulatory\
    \ scope."
    data:
      - name: "name"
        type: "String"
      - name: "classification"
        type: "DataClassificationLevel"
      - name: "description"
        type: "String"
    relations:
      - name: "processingActivities"
        type: "DataProcessingActivity"
        multiplicity: "ManyToMany"
      - name: "records"
        type: "Record_"
        multiplicity: "ManyToMany"
      - name: "dataBreaches"
        type: "DataBreach"
        multiplicity: "ManyToMany"
  - name: "System_"
    description: "Application or platform that stores or processes governed data."
    data:
      - name: "name"
        type: "String"
      - name: "systemType"
        type: "SystemType"
      - name: "ownerDepartment"
        type: "String"
    relations:
      - name: "processingActivities"
        type: "DataProcessingActivity"
        multiplicity: "ManyToMany"
      - name: "recordsRepositories"
        type: "RecordsRepository"
        multiplicity: "ManyToMany"
  - name: "PrivacyNotice"
    description: "Published notice describing processing purposes, rights, and contact\
    \ points."
    data:
      - name: "title"
        type: "String"
      - name: "audience"
        type: "String"
      - name: "versionLabel"
        type: "String"
      - name: "status"
        type: "DocumentStatus"
      - name: "publicationDate"
        type: "Date"
      - name: "publicationUrl"
        type: "URL"
    relations:
      - name: "processingActivities"
        type: "DataProcessingActivity"
        multiplicity: "ManyToMany"
      - name: "organization"
        type: "Organization"
        multiplicity: "ManyToOne"
      - name: "consents"
        type: "Consent"
        multiplicity: "OneToMany"
  - name: "DataSubjectRequest"
    description: "Rights request submitted by or on behalf of a data subject."
    data:
      - name: "requestType"
        type: "DataSubjectRequestType"
      - name: "receivedDate"
        type: "Date"
      - name: "dueDate"
        type: "Date"
      - name: "status"
        type: "RequestStatus"
      - name: "requesterCountry"
        type: "String"
    relations:
      - name: "organization"
        type: "Organization"
        multiplicity: "ManyToOne"
      - name: "processingActivities"
        type: "DataProcessingActivity"
        multiplicity: "ManyToMany"
      - name: "records"
        type: "Record_"
        multiplicity: "ManyToMany"
  - name: "RecordsRepository"
    description: "System of record or archive holding official business records."
    data:
      - name: "name"
        type: "String"
      - name: "repositoryType"
        type: "RepositoryType"
      - name: "location"
        type: "String"
      - name: "ownerDepartment"
        type: "String"
    relations:
      - name: "organization"
        type: "Organization"
        multiplicity: "ManyToOne"
      - name: "records"
        type: "Record_"
        multiplicity: "OneToMany"
      - name: "systems"
        type: "System_"
        multiplicity: "ManyToMany"
      - name: "retentionSchedules"
        type: "RetentionSchedule"
        multiplicity: "ManyToMany"
      - name: "legalHolds"
        type: "LegalHold"
        multiplicity: "ManyToMany"
  - name: "Record_"
    description: "Information object maintained as evidence of activities, decisions,\
    \ or transactions."
    data:
      - name: "title"
        type: "String"
      - name: "recordType"
        type: "RecordType"
      - name: "creationDate"
        type: "Date"
      - name: "classification"
        type: "DataClassificationLevel"
      - name: "status"
        type: "RecordStatus"
    relations:
      - name: "repository"
        type: "RecordsRepository"
        multiplicity: "ManyToOne"
      - name: "retentionSchedule"
        type: "RetentionSchedule"
        multiplicity: "ManyToOne"
      - name: "processingActivities"
        type: "DataProcessingActivity"
        multiplicity: "ManyToMany"
      - name: "dataCategories"
        type: "DataCategory"
        multiplicity: "ManyToMany"
      - name: "legalHolds"
        type: "LegalHold"
        multiplicity: "ManyToMany"
      - name: "dataSubjectRequests"
        type: "DataSubjectRequest"
        multiplicity: "ManyToMany"
  - name: "RetentionSchedule"
    description: "Policy rule defining how long records are retained and how they are\
    \ disposed."
    data:
      - name: "name"
        type: "String"
      - name: "retentionTrigger"
        type: "RetentionTrigger"
      - name: "retentionPeriodMonths"
        type: "Integer"
      - name: "dispositionAction"
        type: "DispositionAction"
      - name: "status"
        type: "RetentionStatus"
    relations:
      - name: "repositories"
        type: "RecordsRepository"
        multiplicity: "ManyToMany"
      - name: "records"
        type: "Record_"
        multiplicity: "OneToMany"
      - name: "exceptions"
        type: "Exception_"
        multiplicity: "OneToMany"
      - name: "dispositionReviews"
        type: "DispositionReview"
        multiplicity: "OneToMany"
  - name: "DispositionReview"
    description: "Review activity to authorize final disposition actions on records."
    data:
      - name: "reviewDate"
        type: "Date"
      - name: "reviewer"
        type: "String"
      - name: "outcome"
        type: "DispositionOutcome"
      - name: "notes"
        type: "String"
    relations:
      - name: "record"
        type: "Record_"
        multiplicity: "ManyToOne"
      - name: "retentionSchedule"
        type: "RetentionSchedule"
        multiplicity: "ManyToOne"
  - name: "LegalHold"
    description: "Directive suspending normal disposition due to litigation or investigation."
    data:
      - name: "name"
        type: "String"
      - name: "reason"
        type: "String"
      - name: "holdStatus"
        type: "LegalHoldStatus"
      - name: "issuedDate"
        type: "Date"
      - name: "releaseDate"
        type: "Date"
    relations:
      - name: "repositories"
        type: "RecordsRepository"
        multiplicity: "ManyToMany"
      - name: "records"
        type: "Record_"
