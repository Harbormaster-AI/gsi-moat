---
entities:
- name: "Merchant"
  description: "Legal entity operating the e-commerce business and owning selling\
    \ policies, channels, and fulfillment assets."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "website"
    type: "String"
  - name: "defaultCurrency"
    type: "String"
  - name: "defaultLocale"
    type: "String"
  - name: "supportEmail"
    type: "String"
  relations:
  - name: "channels"
    type: "Channel"
    multiplicity: "OneToMany"
  - name: "brands"
    type: "Brand"
    multiplicity: "OneToMany"
  - name: "fulfillmentCenters"
    type: "FulfillmentCenter"
    multiplicity: "OneToMany"
  - name: "taxRules"
    type: "TaxRule"
    multiplicity: "OneToMany"
  - name: "paymentProviders"
    type: "PaymentProvider"
    multiplicity: "OneToMany"
  - name: "sellers"
    type: "Seller"
    multiplicity: "OneToMany"
  - name: "promotions"
    type: "Promotion"
    multiplicity: "OneToMany"
- name: "Channel"
  description: "Sales channel such as a web storefront, mobile app, or marketplace\
    \ listing."
  data:
  - name: "name"
    type: "String"
  - name: "channelCode"
    type: "String"
  - name: "channelType"
    type: "ChannelType"
  - name: "locale"
    type: "String"
  - name: "domain"
    type: "String"
  - name: "asActive"
    type: "Boolean"
  - name: "defaultCurrency"
    type: "String"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "catalogs"
    type: "Catalog"
    multiplicity: "OneToMany"
  - name: "promotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
  - name: "shippingMethods"
    type: "ShippingMethod"
    multiplicity: "ManyToMany"
  - name: "paymentProviders"
    type: "PaymentProvider"
    multiplicity: "ManyToMany"
- name: "Brand"
  description: "Consumer-facing brand under which products are marketed."
  data:
  - name: "name"
    type: "String"
  - name: "description"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "products"
    type: "Product"
    multiplicity: "OneToMany"
- name: "Catalog"
  description: "Organized collection of categories and listings offered in a channel."
  data:
  - name: "name"
    type: "String"
  - name: "catalogCode"
    type: "String"
  - name: "asActive"
    type: "Boolean"
  relations:
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "categories"
    type: "Category"
    multiplicity: "OneToMany"
- name: "Category"
  description: "Hierarchical grouping used to classify and browse products within\
    \ a catalog."
  data:
  - name: "name"
    type: "String"
  - name: "slug"
    type: "String"
  - name: "position"
    type: "Integer"
  - name: "asActive"
    type: "Boolean"
  relations:
  - name: "catalog"
    type: "Catalog"
    multiplicity: "ManyToOne"
  - name: "parentCategory"
    type: "Category"
    multiplicity: "ManyToOne"
  - name: "subcategories"
    type: "Category"
    multiplicity: "OneToMany"
  - name: "products"
    type: "Product"
    multiplicity: "ManyToMany"
- name: "Product"
  description: "Sellable item definition with shared content and options across variants."
  data:
  - name: "name"
    type: "String"
  - name: "slug"
    type: "String"
  - name: "productType"
    type: "ProductType"
  - name: "asActive"
    type: "Boolean"
  - name: "defaultTaxClass"
    type: "TaxClass"
  relations:
  - name: "brand"
    type: "Brand"
    multiplicity: "ManyToOne"
  - name: "categories"
    type: "Category"
    multiplicity: "ManyToMany"
  - name: "variants"
    type: "ProductVariant"
    multiplicity: "OneToMany"
  - name: "mediaAssets"
    type: "MediaAsset"
    multiplicity: "OneToMany"
  - name: "reviews"
    type: "Review"
    multiplicity: "OneToMany"
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
- name: "ProductVariant"
  description: "Specific purchasable configuration of a product defined by SKU and\
    \ options."
  data:
  - name: "sku"
    type: "SKU"
  - name: "barcode"
    type: "String"
  - name: "title"
    type: "String"
  - name: "weight"
    type: "Decimal"
  - name: "weightUnit"
    type: "WeightUnit"
  - name: "requiresShipping"
    type: "Boolean"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "pricing"
    type: "ProductPricing"
    multiplicity: "OneToMany"
  - name: "inventoryItems"
    type: "InventoryItem"
    multiplicity: "OneToMany"
  - name: "mediaAssets"
    type: "MediaAsset"
    multiplicity: "OneToMany"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
  - name: "cartItems"
    type: "CartItem"
    multiplicity: "OneToMany"
  - name: "orderLines"
    type: "OrderLine"
    multiplicity: "OneToMany"
  - name: "wishlistItems"
    type: "WishlistItem"
    multiplicity: "OneToMany"
- name: "ProductPricing"
  description: "Channel-aware price list entry for a given variant and time window."
  data:
  - name: "listPrice"
    type: "Money"
  - name: "salePrice"
    type: "Money"
  - name: "validFrom"
    type: "Date"
  - name: "validTo"
    type: "Date"
  relations:
  - name: "variant"
    type: "ProductVariant"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
- name: "MediaAsset"
  description: "Digital media associated with products or variants for merchandising."
  data:
  - name: "url"
    type: "String"
  - name: "altText"
    type: "String"
  - name: "mediaType"
    type: "MediaType"
  - name: "position"
    type: "Integer"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "variant"
    type: "ProductVariant"
    multiplicity: "ManyToOne"
- name: "FulfillmentCenter"
  description: "Physical location that stores inventory and ships customer orders."
  data:
  - name: "name"
    type: "String"
  - name: "centerCode"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "timezone"
    type: "String"
  - name: "asActive"
    type: "Boolean"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "inventoryItems"
    type: "InventoryItem"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
- name: "InventoryItem"
  description: "Stock record of a variant at a specific fulfillment center."
  data:
  - name: "quantityOnHand"
    type: "Integer"
  - name: "quantityReserved"
    type: "Integer"
  - name: "safetyStock"
    type: "Integer"
  - name: "status"
    type: "InventoryStatus"
  relations:
  - name: "variant"
    type: "ProductVariant"
    multiplicity: "ManyToOne"
  - name: "fulfillmentCenter"
    type: "FulfillmentCenter"
    multiplicity: "ManyToOne"
- name: "Supplier"
  description: "Organization providing products or materials to the merchant, including\
    \ drop-ship arrangements."
  data:
  - name: "name"
    type: "String"
  - name: "contactEmail"
    type: "String"
  - name: "status"
    type: "SupplierStatus"
  - name: "website"
    type: "String"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "products"
    type: "Product"
    multiplicity: "ManyToMany"
  - name: "fulfillmentCenters"
    type: "FulfillmentCenter"
    multiplicity: "ManyToMany"
- name: "Seller"
  description: "Third-party marketplace seller authorized to list and fulfill products\
    \ through the merchant."
  data:
  - name: "name"
    type: "String"
  - name: "sellerCode"
    type: "String"
  - name: "status"
    type: "SellerStatus"
  - name: "contactEmail"
    type: "String"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "products"
    type: "Product"
    multiplicity: "OneToMany"
  - name: "payouts"
    type: "Payout"
    multiplicity: "OneToMany"
  - name: "orders"
    type: "Order"
    multiplicity: "OneToMany"
- name: "Customer"
  description: "Individual or organization purchasing goods or services from the merchant."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "phone"
    type: "String"
  - name: "customerGroup"
    type: "CustomerGroup"
  - name: "marketingOptIn"
    type: "Boolean"
  relations:
  - name: "addresses"
    type: "CustomerAddress"
    multiplicity: "OneToMany"
  - name: "carts"
    type: "Cart"
    multiplicity: "OneToMany"
  - name: "orders"
    type: "Order"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "reviews"
    type: "Review"
    multiplicity: "OneToMany"
  - name: "wishlists"
    type: "Wishlist"
    multiplicity: "OneToMany"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
  - name: "couponRedemptions"
    type: "CouponRedemption"
    multiplicity: "OneToMany"
  - name: "giftCards"
    type: "GiftCard"
    multiplicity: "OneToMany"
- name: "CustomerAddress"
  description: "Saved postal address for customer billing and shipping."
  data:
  - name: "label"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "asDefaultShipping"
    type: "Boolean"
  - name: "asDefaultBilling"
    type: "Boolean"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
- name: "Wishlist"
  description: "Curated list of products a customer intends to track or purchase later."
  data:
  - name: "name"
    type: "String"
  - name: "asPublic"
    type: "Boolean"
  - name: "createdAt"
    type: "Date"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "WishlistItem"
    multiplicity: "OneToMany"
- name: "WishlistItem"
  description: "Specific variant saved to a customer's wishlist."
  data:
  - name: "addedDate"
    type: "Date"
  relations:
  - name: "wishlist"
    type: "Wishlist"
    multiplicity: "ManyToOne"
  - name: "variant"
    type: "ProductVariant"
    multiplicity: "ManyToOne"
- name: "Cart"
  description: "Temporary collection of items selected by the customer prior to checkout."
  data:
  - name: "cartNumber"
    type: "String"
  - name: "createdAt"
    type: "Date"
  - name: "status"
    type: "CartStatus"
  - name: "currency"
    type: "String"
  - name: "shippingAddress"
    type: "Address"
  - name: "billingAddress"
    type: "Address"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "CartItem"
    multiplicity: "OneToMany"
  - name: "appliedPromotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
- name: "CartItem"
  description: "Line item in a cart referencing a purchasable variant and desired\
    \ quantity."
  data:
  - name: "quantity"
    type: "Integer"
  - name: "unitPrice"
    type: "Money"
  - name: "totalPrice"
    type: "Money"
  relations:
  - name: "cart"
    type: "Cart"
    multiplicity: "ManyToOne"
  - name: "variant"
    type: "ProductVariant"
    multiplicity: "ManyToOne"
  - name: "appliedPromotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
- name: "Order"
  description: "Commercial document representing a finalized customer purchase."
  data:
  - name: "orderNumber"
    type: "String"
  - name: "status"
    type: "OrderStatus"
  - name: "placedDate"
    type: "Date"
  - name: "subtotal"
    type: "Money"
  - name: "discountTotal"
    type: "Money"
  - name: "shippingTotal"
    type: "Money"
  - name: "taxTotal"
    type: "Money"
  - name: "grandTotal"
    type: "Money"
  - name: "shippingAddress"
    type: "Address"
  - name: "billingAddress"
    type: "Address"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
  - name: "orderLines"
    type: "OrderLine"
    multiplicity: "OneToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "shipments"
    type: "Shipment"
    multiplicity: "OneToMany"
  - name: "refunds"
    type: "Refund"
    multiplicity: "OneToMany"
  - name: "appliedPromotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "giftCardRedemptions"
    type: "GiftCardRedemption"
    multiplicity: "OneToMany"
  - name: "couponRedemptions"
    type: "CouponRedemption"
    multiplicity: "OneToMany"
  - name: "returnRequests"
    type: "ReturnRequest"
    multiplicity: "OneToMany"
  - name: "invoice"
    type: "Invoice"
    multiplicity: "OneToOne"
- name: "OrderLine"
  description: "Itemized component of an order, including pricing and taxation details."
  data:
  - name: "quantity"
    type: "Integer"
  - name: "unitPrice"
    type: "Money"
  - name: "totalPrice"
    type: "Money"
  - name: "taxRate"
    type: "Percentage"
  - name: "lineStatus"
    type: "OrderLineStatus"
  relations:
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
  - name: "variant"
    type: "ProductVariant"
    multiplicity: "ManyToOne"
  - name: "appliedPromotions"
    type: "Promotion"
    multiplicity: "ManyToMany"
- name: "Payment"
  description: "Monetary transaction associated with an order."
  data:
  - name: "paymentNumber"
    type: "String"
  - name: "status"
    type: "PaymentStatus"
  - name: "amount"
    type: "Money"
  - name: "paymentMethod"
    type: "PaymentMethodType"
  - name: "transactionId"
    type: "String"
  - name: "authorizedAt"
    type: "Date"
  - name: "capturedAt"
    type: "Date"
  relations:
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "paymentProvider"
    type: "PaymentProvider"
    multiplicity: "ManyToOne"
  - name: "refunds"
    type: "Refund"
    multiplicity: "OneToMany"
- name: "Refund"
  description: "Reversal of a payment, full or partial, against an order."
  data:
  - name: "refundNumber"
    type: "String"
  - name: "status"
    type: "RefundStatus"
  - name: "amount"
    type: "Money"
  - name: "reason"
    type: "String"
  - name: "createdAt"
    type: "Date"
  relations:
  - name: "payment"
    type: "Payment"
    multiplicity: "ManyToOne"
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
- name: "Shipment"
  description: "Outbound delivery containing one or more items from an order."
  data:
  - name: "shipmentNumber"
    type: "String"
  - name: "status"
    type: "ShipmentStatus"
  - name: "shippedDate"
    type: "Date"
  - name: "deliveredDate"
    type: "Date"
  - name: "trackingNumber"
    type: "String"
  - name: "carrier"
    type: "Carrier"
  - name: "shippingAddress"
    type: "Address"
  relations:
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
  - name: "shipmentItems"
    type: "ShipmentItem"
    multiplicity: "OneToMany"
  - name: "fulfillmentCenter"
    type: "FulfillmentCenter"
    multiplicity: "ManyToOne"
- name: "ShipmentItem"
  description: "Quantity of a specific order line included in a shipment."
  data:
  - name: "quantity"
    type: "Integer"
  relations:
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
  - name: "orderLine"
    type: "OrderLine"
    multiplicity: "ManyToOne"
- name: "ReturnRequest"
  description: "Customer-initiated request to return items from an order."
  data:
  - name: "returnNumber"
    type: "String"
  - name: "status"
    type: "ReturnStatus"
  - name: "createdAt"
    type: "Date"
  - name: "refundAmount"
    type: "Money"
  relations:
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
  - name: "items"
    type: "ReturnItem"
    multiplicity: "OneToMany"
  - name: "refund"
    type: "Refund"
    multiplicity: "OneToOne"
  - name: "shipment"
    type: "Shipment"
    multiplicity: "ManyToOne"
- name: "ReturnItem"
  description: "Item within a return request and its assessed condition."
  data:
  - name: "quantity"
    type: "Integer"
  - name: "reason"
    type: "ReturnReason"
  - name: "condition"
    type: "ReturnItemCondition"
  relations:
  - name: "returnRequest"
    type: "ReturnRequest"
    multiplicity: "ManyToOne"
  - name: "orderLine"
    type: "OrderLine"
    multiplicity: "ManyToOne"
- name: "Promotion"
  description: "Configurable discount logic applied to products, carts, or shipping."
  data:
  - name: "name"
    type: "String"
  - name: "code"
    type: "String"
  - name: "promotionType"
    type: "PromotionType"
  - name: "discountType"
    type: "DiscountType"
  - name: "value"
    type: "Decimal"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  - name: "asStackable"
    type: "Boolean"
  - name: "maxRedemptions"
    type: "Integer"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "channels"
    type: "Channel"
    multiplicity: "ManyToMany"
  - name: "applicableProducts"
    type: "Product"
    multiplicity: "ManyToMany"
  - name: "applicableCategories"
    type: "Category"
    multiplicity: "ManyToMany"
  - name: "coupons"
    type: "Coupon"
    multiplicity: "OneToMany"
- name: "Coupon"
  description: "Redeemable code enabling a promotion under defined limitations."
  data:
  - name: "code"
    type: "String"
  - name: "status"
    type: "CouponStatus"
  - name: "usageLimit"
    type: "Integer"
  - name: "perCustomerLimit"
    type: "Integer"
  - name: "expirationDate"
    type: "Date"
  relations:
  - name: "promotion"
    type: "Promotion"
    multiplicity: "ManyToOne"
  - name: "redemptions"
    type: "CouponRedemption"
    multiplicity: "OneToMany"
- name: "CouponRedemption"
  description: "Record of a coupon being consumed by a customer for a specific order."
  data:
  - name: "redeemedAt"
    type: "Date"
  relations:
  - name: "coupon"
    type: "Coupon"
    multiplicity: "ManyToOne"
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
- name: "TaxRule"
  description: "Jurisdictional tax policy applicable to a class of goods within a\
    \ channel."
  data:
  - name: "name"
    type: "String"
  - name: "country"
    type: "String"
  - name: "region"
    type: "String"
  - name: "taxClass"
    type: "TaxClass"
  - name: "rate"
    type: "Percentage"
  - name: "taxInclusive"
    type: "Boolean"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "channels"
    type: "Channel"
    multiplicity: "ManyToMany"
- name: "ShippingMethod"
  description: "Customer-selectable shipping option with service level and pricing."
  data:
  - name: "name"
    type: "String"
  - name: "methodType"
    type: "ShippingMethodType"
  - name: "flatRate"
    type: "Money"
  - name: "estimatedDays"
    type: "Integer"
  - name: "asActive"
    type: "Boolean"
  relations:
  - name: "channels"
    type: "Channel"
    multiplicity: "ManyToMany"
  - name: "carrierService"
    type: "CarrierService"
    multiplicity: "ManyToOne"
- name: "CarrierService"
  description: "Carrier-specific service configuration such as ground or next-day\
    \ air."
  data:
  - name: "name"
    type: "String"
  - name: "carrier"
    type: "Carrier"
  - name: "serviceLevel"
    type: "ServiceLevel"
  - name: "code"
    type: "String"
  relations:
  - name: "shippingMethods"
    type: "ShippingMethod"
    multiplicity: "OneToMany"
- name: "Review"
  description: "Customer evaluation of a product including rating and content."
  data:
  - name: "rating"
    type: "Integer"
  - name: "title"
    type: "String"
  - name: "content"
    type: "String"
  - name: "createdAt"
    type: "Date"
  - name: "status"
    type: "ReviewStatus"
  relations:
  - name: "product"
    type: "Product"
    multiplicity: "ManyToOne"
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
- name: "Subscription"
  description: "Recurring purchase agreement scheduling automatic orders and billing."
  data:
  - name: "subscriptionNumber"
    type: "String"
  - name: "status"
    type: "SubscriptionStatus"
  - name: "interval"
    type: "SubscriptionInterval"
  - name: "nextBillingDate"
    type: "Date"
  - name: "startDate"
    type: "Date"
  - name: "endDate"
    type: "Date"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "variant"
    type: "ProductVariant"
    multiplicity: "ManyToOne"
  - name: "paymentProvider"
    type: "PaymentProvider"
    multiplicity: "ManyToOne"
  - name: "channel"
    type: "Channel"
    multiplicity: "ManyToOne"
- name: "PaymentProvider"
  description: "Configured payment service enabling authorization and capture flows."
  data:
  - name: "name"
    type: "String"
  - name: "providerType"
    type: "PaymentProviderType"
  - name: "enabled"
    type: "Boolean"
  - name: "merchantAccountId"
    type: "String"
  relations:
  - name: "merchant"
    type: "Merchant"
    multiplicity: "ManyToOne"
  - name: "channels"
    type: "Channel"
    multiplicity: "ManyToMany"
  - name: "payments"
    type: "Payment"
    multiplicity: "OneToMany"
  - name: "subscriptions"
    type: "Subscription"
    multiplicity: "OneToMany"
- name: "Invoice"
  description: "Billing document issued for an order with payment due terms."
  data:
  - name: "invoiceNumber"
    type: "String"
  - name: "issuedDate"
    type: "Date"
  - name: "dueDate"
    type: "Date"
  - name: "total"
    type: "Money"
  - name: "status"
    type: "InvoiceStatus"
  relations:
  - name: "order"
    type: "Order"
    multiplicity: "OneToOne"
- name: "GiftCard"
  description: "Prepaid stored-value instrument redeemable toward orders."
  data:
  - name: "code"
    type: "String"
  - name: "balance"
    type: "Money"
  - name: "expirationDate"
    type: "Date"
  - name: "status"
    type: "GiftCardStatus"
  relations:
  - name: "customer"
    type: "Customer"
    multiplicity: "ManyToOne"
  - name: "issuedOrder"
    type: "Order"
    multiplicity: "ManyToOne"
  - name: "redemptions"
    type: "GiftCardRedemption"
    multiplicity: "OneToMany"
- name: "GiftCardRedemption"
  description: "Application of a gift card balance against an order."
  data:
  - name: "redeemedAt"
    type: "Date"
  - name: "amount"
    type: "Money"
  relations:
  - name: "giftCard"
    type: "GiftCard"
    multiplicity: "ManyToOne"
  - name: "order"
    type: "Order"
    multiplicity: "ManyToOne"
- name: "Payout"
  description: "Remittance from the marketplace operator to a seller for completed\
    \ sales."
  data:
  - name: "payoutNumber"
    type: "String"
  - name: "amount"
    type: "Money"
  - name: "status"
    type: "PayoutStatus"
  - name: "scheduledDate"
    type: "Date"
  - name: "paidDate"
    type: "Date"
  relations:
  - name: "seller"
    type: "Seller"
    multiplicity: "ManyToOne"
  - name: "orders"
    type: "Order"
    multiplicity: "ManyToMany"
metadata:
  name: "ECommerce Industry Domain Model"
  version: "1.0.0"
  industry: "ECommerce"
  category: "Commerce"
  description: "HCIDL model capturing core e-commerce capabilities across catalog,\
    \ pricing, cart, order, payment, fulfillment, promotions, taxation, and marketplace\
    \ operations."
  type: "Industry"
  domain: "ECommerce"
enums:
- name: "ChannelType"
  description: "Modes by which customers interact and place orders."
  data:
  - name: "Web"
  - name: "MobileApp"
  - name: "Marketplace"
  - name: "Social"
  - name: "POS"
- name: "ProductType"
  description: "Nature of the sellable product for merchandising and fulfillment."
  data:
  - name: "Physical"
  - name: "Digital"
  - name: "Service"
  - name: "Bundle"
  - name: "Subscription"
- name: "WeightUnit"
  description: "Units used to express product weight for shipping and handling."
  data:
  - name: "Gram"
  - name: "Kilogram"
  - name: "Ounce"
  - name: "Pound"
- name: "InventoryStatus"
  description: "Availability state of a variant at a fulfillment location."
  data:
  - name: "InStock"
  - name: "LowStock"
  - name: "OutOfStock"
  - name: "Backorder"
  - name: "Preorder"
- name: "SupplierStatus"
  description: "Operational readiness of a supplier to provide goods or services."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Onboarding"
  - name: "Suspended"
- name: "SellerStatus"
  description: "Authorization and operational state of a marketplace seller."
  data:
  - name: "Active"
  - name: "Inactive"
  - name: "Suspended"
- name: "CustomerGroup"
  description: "Segmentation used for pricing, access, and promotions."
  data:
  - name: "Retail"
  - name: "Wholesale"
  - name: "VIP"
  - name: "Employee"
- name: "CartStatus"
  description: "Lifecycle stage of a shopping cart prior to order conversion."
  data:
  - name: "Active"
  - name: "Merged"
  - name: "Ordered"
  - name: "Abandoned"
- name: "OrderStatus"
  description: "End-to-end state of the order from creation to completion."
  data:
  - name: "Pending"
  - name: "Confirmed"
  - name: "Paid"
  - name: "PartiallyShipped"
  - name: "Shipped"
  - name: "Delivered"
  - name: "Cancelled"
  - name: "Refunded"
  - name: "PartiallyRefunded"
- name: "OrderLineStatus"
  description: "Fulfillment state of an individual order line."
  data:
  - name: "Pending"
  - name: "Fulfilled"
  - name: "Cancelled"
  - name: "Backordered"
  - name: "Returned"
- name: "PaymentStatus"
  description: "Processing status of funds movement tied to an order."
  data:
  - name: "Authorized"
  - name: "Captured"
  - name: "PartiallyCaptured"
  - name: "Declined"
  - name: "Refunded"
  - name: "PartiallyRefunded"
  - name: "Voided"
  - name: "Pending"
- name: "PaymentMethodType"
  description: "Mechanism selected by the customer to pay for an order."
  data:
  - name: "CreditCard"
  - name: "DebitCard"
  - name: "PayPal"
  - name: "BankTransfer"
  - name: "CashOnDelivery"
  - name: "GiftCard"
  - name: "ApplePay"
  - name: "GooglePay"
  - name: "BuyNowPayLater"
- name: "RefundStatus"
  description: "Progress of a payment reversal request."
  data:
  - name: "Requested"
  - name: "Approved"
  - name: "Declined"
  - name: "Processed"
- name: "ShipmentStatus"
  description: "Operational state of an outbound shipment."
  data:
  - name: "Pending"
  - name: "Packed"
  - name: "Shipped"
  - name: "InTransit"
  - name: "Delivered"
  - name: "Delayed"
  - name: "Returned"
  - name: "Cancelled"
- name: "Carrier"
  description: "Logistics carrier responsible for transportation."
  data:
  - name: "UPS"
  - name: "FedEx"
  - name: "USPS"
  - name: "DHL"
  - name: "RoyalMail"
  - name: "CanadaPost"
  - name: "LocalCourier"
  - name: "Other"
- name: "ReturnStatus"
  description: "Milestones for handling returns through completion."
  data:
  - name: "Requested"
  - name: "Approved"
  - name: "Rejected"
  - name: "InTransit"
  - name: "Received"
  - name: "Refunded"
  - name: "Closed"
- name: "ReturnReason"
  description: "Customer-stated cause for returning merchandise."
  data:
  - name: "Defective"
  - name: "Damaged"
  - name: "NotAsDescribed"
  - name: "WrongItem"
  - name: "NoLongerNeeded"
  - name: "SizeFitIssue"
  - name: "Other"
- name: "ReturnItemCondition"
  description: "Physical state of returned goods upon receipt and inspection."
  data:
  - name: "New"
  - name: "OpenBox"
  - name: "Used"
  - name: "Damaged"
  - name: "MissingParts"
- name: "PromotionType"
  description: "Scope of discount application."
  data:
  - name: "Catalog"
  - name: "Cart"
  - name: "Shipping"
- name: "DiscountType"
  description: "Discount calculation method applied to prices."
  data:
  - name: "AmountOff"
  - name: "PercentOff"
  - name: "BuyXGetY"
  - name: "FreeShipping"
- name: "CouponStatus"
  description: "Availability of a coupon for redemption."
  data:
  - name: "Active"
  - name: "Expired"
  - name: "Disabled"
  - name: "Exhausted"
- name: "TaxClass"
  description: "Taxability grouping for products and services."
  data:
  - name: "Standard"
  - name: "Reduced"
  - name: "Zero"
  - name: "Exempt"
  - name: "DigitalServices"
  - name: "Food"
  - name: "Clothing"
- name: "ShippingMethodType"
  description: "Delivery speed or modality presented to customers at checkout."
  data:
  - name: "Standard"
  - name: "Expedited"
  - name: "Overnight"
  - name: "SameDay"
  - name: "Pickup"
- name: "ServiceLevel"
  description: "Carrier service promise tier associated with a shipping method."
  data:
  - name: "Economy"
  - name: "Standard"
  - name: "Express"
  - name: "Priority"
  - name: "NextDay"
- name: "ReviewStatus"
  description: "Moderation and publication state of a product review."
  data:
  - name: "Pending"
  - name: "Approved"
  - name: "Rejected"
  - name: "Flagged"
- name: "SubscriptionStatus"
  description: "Current activity state of a recurring order agreement."
  data:
  - name: "Active"
  - name: "Paused"
  - name: "Cancelled"
  - name: "Expired"
- name: "SubscriptionInterval"
  description: "Frequency at which a subscription generates orders."
  data:
  - name: "Weekly"
  - name: "BiWeekly"
  - name: "Monthly"
  - name: "Quarterly"
  - name: "SemiAnnual"
  - name: "Annual"
- name: "PaymentProviderType"
  description: "Integration category for moving funds from customers."
  data:
  - name: "PSP"
  - name: "Gateway"
  - name: "Aggregator"
  - name: "Manual"
- name: "InvoiceStatus"
  description: "Billing document state with respect to issuance and settlement."
  data:
  - name: "Draft"
  - name: "Issued"
  - name: "Paid"
  - name: "Overdue"
  - name: "Cancelled"
- name: "GiftCardStatus"
  description: "Usability and balance state of a gift card."
  data:
  - name: "Active"
  - name: "Redeemed"
  - name: "Expired"
  - name: "Disabled"
- name: "MediaType"
  description: "Classification of digital assets used in merchandising."
  data:
  - name: "Image"
  - name: "Video"
  - name: "Document"
  - name: "Audio"
  - name: "Other"
- name: "PayoutStatus"
  description: "Disbursement progress for seller remittances."
  data:
  - name: "Pending"
  - name: "Scheduled"
  - name: "Paid"
  - name: "Failed"
  - name: "Cancelled"
valueObjects:
- name: "Money"
  description: "Monetary value with explicit currency for pricing and totals."
  data:
  - name: "amount"
    type: "Decimal"
  - name: "currency"
    type: "String"
- name: "Address"
  description: "Postal address supporting shipping, billing, and fulfillment operations."
  data:
  - name: "street"
    type: "String"
  - name: "city"
    type: "String"
  - name: "state"
    type: "String"
  - name: "postalCode"
    type: "String"
  - name: "country"
    type: "String"
- name: "SKU"
  description: "Merchant-assigned stock keeping unit uniquely identifying a sellable\
    \ variant."
  data:
  - name: "value"
    type: "String"
- name: "Percentage"
  description: "Numeric percentage value expressed as 0–100 for rates and discounts."
  data:
  - name: "value"
    type: "Decimal"
