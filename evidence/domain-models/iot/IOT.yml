    type: "String"
  - name: "desiredStateVersion"
    type: "Integer"
  - name: "reportedStateVersion"
    type: "Integer"
  - name: "lastSyncAt"
    type: "DateTime"
  relations:
  - name: "device"
    type: "IoTDevice"
    multiplicity: "OneToOne"
  - name: "gateway"
    type: "Gateway"
    multiplicity: "OneToOne"
  - name: "template"
    type: "TwinTemplate"
    multiplicity: "ManyToOne"
  - name: "changeEvents"
    type: "TwinChangeEvent"
    multiplicity: "OneToMany"
- name: "TwinTemplate"
  description: "Reusable definition of properties, tags, and capabilities for a twin."
  data:
  - name: "name"
    type: "String"
  - name: "schemaUri"
    type: "Uri"
  - name: "version"
    type: "String"
  relations:
  - name: "deviceModels"
    type: "DeviceModel"
    multiplicity: "OneToMany"
- name: "TwinChangeEvent"
  description: "Historical record of desired, reported, or tag changes to a twin."
  data:
  - name: "eventId"
    type: "String"
  - name: "changeType"
    type: "TwinChangeType"
  - name: "occurredAt"
    type: "DateTime"
  relations:
  - name: "twin"
    type: "DigitalTwin"
    multiplicity: "ManyToOne"
- name: "MaintenanceTicket"
  description: "Work order to inspect, repair, or replace an IoT device."
  data:
  - name: "ticketNumber"
    type: "String"
  - name: "priority"
    type: "MaintenancePriority"
  - name: "status"
    type: "MaintenanceStatus"
  - name: "openedAt"
    type: "DateTime"
  - name: "closedAt"
    type: "DateTime"
  relations:
  - name: "device"
    type: "IoTDevice"
    multiplicity: "ManyToOne"
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
- name: "DataRetentionPolicy"
  description: "Policy defining how long telemetry and logs are preserved."
  data:
  - name: "name"
    type: "String"
  - name: "retentionDays"
    type: "Integer"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "streams"
    type: "TelemetryStream"
    multiplicity: "OneToMany"
- name: "SoftwareUpdateCampaign"
