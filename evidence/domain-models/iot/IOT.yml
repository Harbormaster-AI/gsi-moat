    multiplicity: "ManyToOne"
  - name: "gateway"
    type: "Gateway"
    multiplicity: "ManyToOne"
  - name: "simCard"
    type: "SimCard"
    multiplicity: "ManyToOne"
- name: "SimCard"
  description: "Cellular SIM or eUICC used to provide wide-area connectivity."
