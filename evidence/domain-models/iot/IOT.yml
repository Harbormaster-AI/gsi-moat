  relations:
  - name: "firmwareRelease"
    type: "FirmwareRelease"
    multiplicity: "ManyToOne"
  - name: "deviceGroup"
    type: "DeviceGroup"
    multiplicity: "ManyToOne"
  - name: "executions"
    type: "SoftwareUpdateExecution"
    multiplicity: "OneToMany"
- name: "SoftwareUpdateExecution"
  description: "Per-device execution result for a particular update campaign."
  data:
  - name: "status"
    type: "UpdateStatus"
  - name: "startedAt"
    type: "DateTime"
  - name: "completedAt"
    type: "DateTime"
  relations:
  - name: "campaign"
    type: "SoftwareUpdateCampaign"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "IoTDevice"
    multiplicity: "ManyToOne"
- name: "DeviceGroup"
  description: "Logical grouping of devices for lifecycle operations and targeting."
