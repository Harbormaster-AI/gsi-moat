  - name: "name"
    type: "String"
  - name: "scope"
    type: "String"
  - name: "expiresAt"
    type: "DateTime"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "apiKeys"
    type: "ApiKey"
    multiplicity: "OneToMany"
  - name: "users"
    type: "TenantUser"
    multiplicity: "ManyToMany"
- name: "ApiKey"
  description: "Credential for programmatic access controlled by an access policy."
  data:
  - name: "keyId"
    type: "String"
  - name: "hashedSecret"
    type: "String"
  - name: "createdAt"
    type: "DateTime"
  - name: "lastUsedAt"
    type: "DateTime"
  relations:
  - name: "accessPolicy"
    type: "AccessPolicy"
    multiplicity: "ManyToOne"
- name: "DeviceCertificate"
  description: "X.509 or similar certificate used for mutual authentication."
  data:
  - name: "certificateType"
    type: "CertificateType"
  - name: "serialNumber"
    type: "String"
  - name: "notBefore"
    type: "DateTime"
  - name: "notAfter"
    type: "DateTime"
  - name: "fingerprint"
    type: "String"
  relations:
  - name: "device"
    type: "IoTDevice"
    multiplicity: "ManyToOne"
  - name: "gateway"
    type: "Gateway"
    multiplicity: "ManyToOne"
- name: "ProvisioningRecord"
  description: "Enrollment record created during device onboarding to a platform."
  data:
  - name: "method"
    type: "ProvisioningMethod"
  - name: "status"
    type: "ProvisioningStatus"
  - name: "enrolledAt"
    type: "DateTime"
  - name: "provisioningService"
    type: "String"
  relations:
  - name: "device"
    type: "IoTDevice"
    multiplicity: "OneToOne"
  - name: "certificate"
    type: "DeviceCertificate"
    multiplicity: "OneToOne"
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
- name: "DigitalTwin"
