---
entities:
- name: "DeviceVendor"
  description: "Company responsible for designing and producing IoT hardware modules\
    \ and device models."
  data:
  - name: "name"
    type: "String"
  - name: "legalName"
    type: "String"
  - name: "headquartersCountry"
    type: "String"
  - name: "website"
    type: "String"
  relations:
  - name: "deviceModels"
    type: "DeviceModel"
    multiplicity: "OneToMany"
  - name: "firmwareReleases"
    type: "FirmwareRelease"
    multiplicity: "OneToMany"
  - name: "hardwareModules"
    type: "HardwareModule"
    multiplicity: "OneToMany"
- name: "HardwareModule"
  description: "Discrete hardware module such as MCU, radio, sensor chipset, or power\
    \ unit used in IoT devices."
  data:
  - name: "moduleCode"
    type: "String"
  - name: "moduleType"
    type: "ModuleType"
  - name: "datasheetUri"
    type: "Uri"
  relations:
  - name: "vendor"
    type: "DeviceVendor"
    multiplicity: "ManyToOne"
- name: "DeviceModel"
  description: "Defined IoT device SKU with fixed capabilities, connectivity, and\
    \ twin template."
  data:
  - name: "name"
    type: "String"
  - name: "modelNumber"
    type: "String"
  - name: "hardwareRevision"
    type: "String"
  - name: "supportedConnectivity"
    type: "ConnectivityType"
  - name: "defaultTelemetryEncoding"
    type: "TelemetryEncoding"
  relations:
  - name: "vendor"
    type: "DeviceVendor"
    multiplicity: "ManyToOne"
  - name: "hardwareModules"
    type: "HardwareModule"
    multiplicity: "ManyToMany"
  - name: "twinTemplate"
    type: "TwinTemplate"
    multiplicity: "ManyToOne"
  - name: "firmwareReleases"
    type: "FirmwareRelease"
    multiplicity: "OneToMany"
  - name: "commandDefinitions"
    type: "CommandDefinition"
    multiplicity: "OneToMany"
- name: "FirmwareRelease"
  description: "Versioned firmware image and metadata for a specific device model."
  data:
  - name: "version"
    type: "FirmwareVersion"
  - name: "releaseDate"
    type: "Date"
  - name: "releaseNotes"
    type: "String"
  - name: "checksum"
    type: "Checksum"
  relations:
  - name: "deviceModel"
    type: "DeviceModel"
    multiplicity: "ManyToOne"
- name: "IoTDevice"
  description: "Individually provisioned IoT device instance operating in the field."
  data:
  - name: "deviceId"
    type: "DeviceId"
  - name: "serialNumber"
    type: "String"
  - name: "status"
    type: "DeviceStatus"
  - name: "lastSeen"
    type: "DateTime"
  - name: "powerSource"
    type: "PowerSource"
  - name: "firmwareVersion"
    type: "FirmwareVersion"
  relations:
  - name: "deviceModel"
    type: "DeviceModel"
    multiplicity: "ManyToOne"
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "room"
    type: "Room"
    multiplicity: "ManyToOne"
  - name: "gateway"
    type: "Gateway"
    multiplicity: "ManyToOne"
  - name: "sensors"
    type: "SensorInstance"
    multiplicity: "OneToMany"
  - name: "actuators"
    type: "ActuatorInstance"
    multiplicity: "OneToMany"
  - name: "certificates"
    type: "DeviceCertificate"
    multiplicity: "OneToMany"
  - name: "digitalTwin"
    type: "DigitalTwin"
    multiplicity: "OneToOne"
  - name: "telemetryStreams"
    type: "TelemetryStream"
    multiplicity: "OneToMany"
  - name: "commandInvocations"
    type: "CommandInvocation"
    multiplicity: "OneToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
  - name: "provisioningRecord"
    type: "ProvisioningRecord"
    multiplicity: "OneToOne"
  - name: "deviceGroups"
    type: "DeviceGroup"
    multiplicity: "ManyToMany"
  - name: "networkProfiles"
    type: "NetworkProfile"
    multiplicity: "OneToMany"
- name: "SensorInstance"
  description: "Concrete sensor attached to a device that emits measurements."
  data:
  - name: "name"
    type: "String"
  - name: "sensorType"
    type: "SensorType"
  - name: "unit"
    type: "String"
  - name: "samplingIntervalMs"
    type: "Integer"
  relations:
  - name: "device"
    type: "IoTDevice"
    multiplicity: "ManyToOne"
  - name: "telemetryStreams"
    type: "TelemetryStream"
    multiplicity: "OneToMany"
- name: "ActuatorInstance"
  description: "Concrete actuator endpoint controllable on a device."
  data:
  - name: "name"
    type: "String"
  - name: "actuatorType"
    type: "ActuatorType"
  - name: "commandTopic"
    type: "TopicName"
  relations:
  - name: "device"
    type: "IoTDevice"
    multiplicity: "ManyToOne"
  - name: "supportedCommands"
    type: "CommandDefinition"
    multiplicity: "ManyToMany"
- name: "TelemetrySchema"
  description: "Schema definition and encoding for validating telemetry payloads."
  data:
  - name: "schemaId"
    type: "String"
  - name: "encoding"
    type: "TelemetryEncoding"
  - name: "schemaUri"
    type: "Uri"
  relations:
  - name: "streams"
    type: "TelemetryStream"
    multiplicity: "OneToMany"
- name: "TelemetryStream"
  description: "Logical stream of telemetry for a device or sensor with broker and\
    \ retention settings."
  data:
  - name: "streamName"
    type: "String"
  - name: "qos"
    type: "MessageQoS"
  - name: "retentionDays"
    type: "Integer"
  relations:
  - name: "device"
    type: "IoTDevice"
    multiplicity: "ManyToOne"
  - name: "sensor"
    type: "SensorInstance"
    multiplicity: "ManyToOne"
  - name: "schema"
    type: "TelemetrySchema"
    multiplicity: "ManyToOne"
  - name: "messagingEndpoint"
    type: "MessagingEndpoint"
    multiplicity: "ManyToOne"
  - name: "retentionPolicy"
    type: "DataRetentionPolicy"
    multiplicity: "ManyToOne"
- name: "CommandDefinition"
  description: "Declarative definition of a remotely invokable command and its schemas."
  data:
  - name: "name"
    type: "String"
  - name: "requestSchemaUri"
    type: "Uri"
  - name: "responseSchemaUri"
    type: "Uri"
  - name: "timeoutSeconds"
    type: "Integer"
  relations:
  - name: "deviceModel"
    type: "DeviceModel"
    multiplicity: "ManyToOne"
  - name: "actuators"
    type: "ActuatorInstance"
    multiplicity: "ManyToMany"
  - name: "commandInvocations"
    type: "CommandInvocation"
    multiplicity: "OneToMany"
- name: "CommandInvocation"
  description: "Execution record for a command sent to a device or actuator."
  data:
  - name: "invocationId"
    type: "String"
  - name: "status"
    type: "CommandStatus"
  - name: "requestedAt"
    type: "DateTime"
  - name: "completedAt"
    type: "DateTime"
  relations:
  - name: "device"
    type: "IoTDevice"
    multiplicity: "ManyToOne"
  - name: "commandDefinition"
    type: "CommandDefinition"
    multiplicity: "ManyToOne"
  - name: "actuator"
    type: "ActuatorInstance"
    multiplicity: "ManyToOne"
  - name: "user"
    type: "TenantUser"
    multiplicity: "ManyToOne"
- name: "AlertRule"
  description: "Condition or threshold that evaluates telemetry and generates alerts."
  data:
  - name: "name"
    type: "String"
  - name: "severity"
    type: "AlertSeverity"
  - name: "expression"
    type: "String"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "streams"
    type: "TelemetryStream"
    multiplicity: "ManyToMany"
  - name: "alerts"
    type: "Alert"
    multiplicity: "OneToMany"
- name: "Alert"
  description: "Runtime alert created by rules or device self-reports."
  data:
  - name: "alertId"
    type: "String"
  - name: "status"
    type: "AlertStatus"
  - name: "raisedAt"
    type: "DateTime"
  - name: "clearedAt"
    type: "DateTime"
  - name: "message"
    type: "String"
  relations:
  - name: "device"
    type: "IoTDevice"
    multiplicity: "ManyToOne"
  - name: "alertRule"
    type: "AlertRule"
    multiplicity: "ManyToOne"
- name: "Tenant"
  description: "Organization that owns and operates IoT assets and data."
  data:
  - name: "name"
    type: "String"
  - name: "tenantType"
    type: "TenantType"
  relations:
  - name: "sites"
    type: "Site"
    multiplicity: "OneToMany"
  - name: "users"
    type: "TenantUser"
    multiplicity: "OneToMany"
  - name: "devices"
    type: "IoTDevice"
    multiplicity: "OneToMany"
  - name: "dataRetentionPolicies"
    type: "DataRetentionPolicy"
    multiplicity: "OneToMany"
  - name: "connectivityPlans"
    type: "ConnectivityPlan"
    multiplicity: "OneToMany"
  - name: "simCards"
    type: "SimCard"
    multiplicity: "OneToMany"
  - name: "messagingEndpoints"
    type: "MessagingEndpoint"
    multiplicity: "OneToMany"
  - name: "accessPolicies"
    type: "AccessPolicy"
    multiplicity: "OneToMany"
  - name: "deviceGroups"
    type: "DeviceGroup"
    multiplicity: "OneToMany"
  - name: "alertRules"
    type: "AlertRule"
    multiplicity: "OneToMany"
  - name: "maintenanceTickets"
    type: "MaintenanceTicket"
    multiplicity: "OneToMany"
  - name: "usageRecords"
    type: "UsageRecord"
    multiplicity: "OneToMany"
- name: "TenantUser"
  description: "End user within a tenant with a defined operational role."
  data:
  - name: "firstName"
    type: "String"
  - name: "lastName"
    type: "String"
  - name: "email"
    type: "String"
  - name: "role"
    type: "UserRole"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "commandInvocations"
    type: "CommandInvocation"
    multiplicity: "OneToMany"
- name: "Site"
  description: "Physical deployment location where devices and gateways are installed."
  data:
  - name: "name"
    type: "String"
  - name: "address"
    type: "Address"
  - name: "timezone"
    type: "String"
  - name: "latitude"
    type: "Decimal"
  - name: "longitude"
    type: "Decimal"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "buildings"
    type: "Building"
    multiplicity: "OneToMany"
  - name: "devices"
    type: "IoTDevice"
    multiplicity: "OneToMany"
  - name: "gateways"
    type: "Gateway"
    multiplicity: "OneToMany"
- name: "Building"
  description: "Building within a site used to organize deployments."
  data:
  - name: "name"
    type: "String"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "floors"
    type: "Floor"
    multiplicity: "OneToMany"
- name: "Floor"
  description: "Floor level in a building."
