  - name: "name"
    type: "String"
  - name: "version"
    type: "String"
  - name: "image"
    type: "String"
  - name: "status"
    type: "DeploymentStatus"
  relations:
  - name: "gateway"
    type: "Gateway"
    multiplicity: "ManyToOne"
- name: "NetworkProfile"
  description: "Connectivity configuration assigned to a device or gateway."
