  - name: "name"
    type: "String"
  - name: "level"
    type: "Integer"
  relations:
  - name: "building"
    type: "Building"
    multiplicity: "ManyToOne"
  - name: "rooms"
    type: "Room"
    multiplicity: "OneToMany"
- name: "Room"
  description: "Room or area within a floor where equipment is located."
  data:
  - name: "name"
    type: "String"
  relations:
  - name: "floor"
    type: "Floor"
    multiplicity: "ManyToOne"
  - name: "devices"
    type: "IoTDevice"
    multiplicity: "OneToMany"
  - name: "gateways"
    type: "Gateway"
    multiplicity: "OneToMany"
- name: "Gateway"
  description: "Edge computing node that bridges local devices to cloud services."
  data:
  - name: "gatewayId"
    type: "String"
  - name: "status"
    type: "DeviceStatus"
  - name: "softwareVersion"
    type: "String"
  relations:
  - name: "site"
    type: "Site"
    multiplicity: "ManyToOne"
  - name: "room"
    type: "Room"
    multiplicity: "ManyToOne"
  - name: "devices"
    type: "IoTDevice"
    multiplicity: "OneToMany"
  - name: "edgeApplications"
    type: "EdgeApplication"
    multiplicity: "OneToMany"
  - name: "certificates"
    type: "DeviceCertificate"
    multiplicity: "OneToMany"
  - name: "digitalTwin"
    type: "DigitalTwin"
    multiplicity: "OneToOne"
  - name: "networkProfiles"
    type: "NetworkProfile"
    multiplicity: "OneToMany"
- name: "EdgeApplication"
  description: "Workload deployed on a gateway to process or route data."
