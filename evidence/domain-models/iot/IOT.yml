    type: "Date"
  - name: "messagesSent"
    type: "Integer"
  - name: "dataVolumeMB"
    type: "Integer"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "device"
    type: "IoTDevice"
    multiplicity: "ManyToOne"
  - name: "connectivityPlan"
    type: "ConnectivityPlan"
    multiplicity: "ManyToOne"
metadata:
  name: "IoT Industry Domain Model"
  description: "HCIDL model capturing core IoT device, connectivity, telemetry, twin,\
    \ command, security, and operations capabilities."
  version: "1.0.0"
  industry: "Internet of Things"
  category: "Integration"
  language: "English"
  type: "Industry"
  domain: "IOT"
enums:
- name: "ConnectivityType"
  description: "Physical or LPWAN connectivity medium used by IoT devices."
  data:
  - name: "WiFi"
  - name: "Ethernet"
  - name: "LTE"
  - name: "FiveG"
  - name: "NBIoT"
  - name: "LoRaWAN"
  - name: "Zigbee"
  - name: "BLE"
  - name: "Satellite"
- name: "DeviceStatus"
  description: "Lifecycle and operational state of a device or gateway."
  data:
  - name: "Provisioning"
  - name: "Active"
  - name: "Suspended"
  - name: "Offline"
  - name: "Decommissioned"
- name: "TelemetryEncoding"
  description: "Serialization format used for telemetry payloads."
  data:
  - name: "JSON"
  - name: "CBOR"
  - name: "Protobuf"
  - name: "Avro"
  - name: "Binary"
- name: "MessageQoS"
  description: "Delivery guarantee level for messaging systems."
  data:
  - name: "AtMostOnce"
  - name: "AtLeastOnce"
  - name: "ExactlyOnce"
- name: "CertificateType"
  description: "Type and trust model of device identity certificates."
  data:
  - name: "X509"
  - name: "X509_CA"
  - name: "X509_SelfSigned"
- name: "ProvisioningMethod"
  description: "Process by which devices are enrolled and authenticated."
  data:
