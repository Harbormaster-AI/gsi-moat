  - name: "networkProfiles"
    type: "NetworkProfile"
    multiplicity: "OneToMany"
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "connectivityPlan"
    type: "ConnectivityPlan"
    multiplicity: "ManyToOne"
- name: "ConnectivityPlan"
  description: "Commercial plan defining data caps and billing cycles for connectivity."
  data:
  - name: "name"
    type: "String"
  - name: "dataCapMB"
    type: "Integer"
  - name: "billingCycleDays"
    type: "Integer"
  relations:
  - name: "simCards"
    type: "SimCard"
    multiplicity: "OneToMany"
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
- name: "MessagingEndpoint"
  description: "Broker or endpoint for telemetry ingestion and command delivery."
  data:
  - name: "protocol"
    type: "MessagingProtocol"
  - name: "host"
    type: "String"
  - name: "port"
    type: "Integer"
  - name: "secure"
    type: "Boolean"
  relations:
  - name: "tenant"
    type: "Tenant"
    multiplicity: "ManyToOne"
  - name: "streams"
    type: "TelemetryStream"
    multiplicity: "OneToMany"
- name: "AccessPolicy"
