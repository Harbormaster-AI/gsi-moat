
# -------------------------------------------------------------
# Standard System-as-Code file.
#
# Pay close attention to parameters that require values unique
# to you, such as those for Git, Docker, and AWS.
#
# To use Git, Docker, and any provider, be sure to have created
# an account with each.
#
# For Git, before generating the project be sure to create the
# repository.
# -------------------------------------------------------------

system:
    name: Core System - v2.1
    description: Core system on Axon 4  using MySQL 8
    blueprint:
        name:             Axon4-Framework-Server
        features:         aws,docker,terraform
    model:
        name:             #set as an input-arg

    # ------------------------------------------------------------
    # Docker parameters
    # ------------------------------------------------------------
    docker:
        inUse:        true
        username:     tylertravismya
        password:     #set as an input-arg
        orgName:      theharbormaster
        repository:   #set as an input-arg
        tag:          latest
        host:         docker.io

    # ------------------------------------------------------------
    # Git repository parameters
    # - password is a Git token.  This data is never stored
    # ------------------------------------------------------------
    git:
        inUse:          true
        name:           git-spring-boot
        host:           https://github.com
        owner:          Harbormaster-AI
        repository:     #set as an input-arg
        password:       #set as an input-arg
        tag:            latest


    # ------------------------------------------------------------
    # Terraform properties
    # ------------------------------------------------------------
    terraform:
        inUse:             true
        dbUsername:
        dbPassword:
        dbEngine:          mysql   # options - mysql, mongo, postgres
        dbVersion:         # leave blank to apply vendor default
        dbPort:            3306
        provider:           aws

    # ------------------------------------------------------------
    # AWS properties
    # ------------------------------------------------------------
    aws:
        accessKey:
        secretKey:
        vpc:
        region:             us-east-2
        ec2InstanceType:    t2.medium
        dbInstanceType:     db.t3.medium
        amiImageId:

    # ------------------------------------------------------------
    # K8 properties
    # ------------------------------------------------------------
    kubernetes:
        inUse:             true
        host:
        hostTarget:        aws
        serviceType:       LoadBalancer

    # ------------------------------------------------------------
    # System options influence the generative output and possible
    # features of the resulting system.  Understand the purpose
    # and intent of each.
    # ------------------------------------------------------------
    options:

        # ------------------------------------------------------------
        # Application parameters
        # ------------------------------------------------------------
        application:
            name:                  banking-backend
            description:           Banking Restful Backend
            author:                Harbormaster Dev Team
            email:                 xxxx.xxxxxxxxx@xxxxxxxx.com
            application logo URL:  ./img/turnstone.bank.png
            company name:          Turnstone National Bank
            version:               0.0.1

        # ------------------------------------------------------------
        # CI/CD parameters
        # ------------------------------------------------------------
        cicd:
            platform: circlci      # options - codeship, circleci, jfrog.pipelines, jenkins, azure, aws, gitlab, bitbucket, github

        # ------------------------------------------------------------
        # Axon Framework 4.x properties
        # ------------------------------------------------------------
        axon-framework:
            version:                    4.4
            axonserver-token:
            axonserver-context:         context1
            axonserver-servers:         localhost
            spring-datasource-url:      jdbc:mysql:./database;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
            default-snapshot-threshold: 10
            use-axon-server:            false
            enable-monitoring:          true
            enable-tracing:             true

        # ------------------------------------------------------------
        # Spring 2.5 properties
        # ------------------------------------------------------------
        spring:
            server-port:             8080
            entity-store-type:       mysql                         # options - h2, mysql, postgres, mongodb
            entity-store-url:        jdbc:mysql://localhost:3306/banking-on-spring-boot
            database-username:       root
            database-password:       letmein2
            spring-profiles-active:

        # ------------------------------------------------------------
        # AWS properties
        # ------------------------------------------------------------
        aws:
            inUse:              true
            accessKey:          # set as env var on AWS
            secretKey:          # set as env var on AWS
            vpc:
            region:             us-east-2
            ec2InstanceType:    t2.medium
            dbInstanceType:     db.t3.medium
            amiImageId:         # use the default AMI

        # ------------------------------------------------------------
        # Terraform properties
        # ------------------------------------------------------------
        terraform:
            inUse:             true
            dbUsername:        no_user_name
            dbPassword:        no_password
            dbEngine:          mysql   # options - mysql, mongo, postgres
            dbVersion:         # leave blank to apply vendor default
            dbPort:            3306
            provider:          aws


        # ------------------------------------------------------------
        # K8 properties
        # ------------------------------------------------------------
        kubernetes:
            inUse:             true
            host:
            hostTarget:        aws
            serviceType:       LoadBalancer
